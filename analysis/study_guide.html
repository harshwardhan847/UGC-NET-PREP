,"dec2022_shiftii_q78","june2024_cancelled_q35"],"skip_note":"Sequence questions are common-sense rank ordering from the option patterns.","id":"u3c13","type":"same-concept-variant"},{"title":"C file-handling functions and steps","topic":"C Programming (output, pointers, operators)","technique":"fopen -> check error -> read/write -> fclose; fseek sets position, ftell gives position, rewind goes to start, feof tests end.","what_changes":"Match vs order format.","representative":"dec2024_q53","members":["dec2024_q53","june2024_reexam_q54"],"skip_note":"Same small fact set.","id":"u3c14","type":"same-concept-variant"},{"title":"Constructor facts in C++","topic":"C++ & OOP Concepts","technique":"Constructors: auto-invoked, no return type, can be overloaded, not inherited, need not be friend, defined outside as Class::Class(...) without explicit.","what_changes":"Which statements are offered.","representative":"dec2023_q48","members":["dec2023_q48","june2024_reexam_q23","dec2022_shiftii_q11","dec2022_q47"],"skip_note":"The same property list repeated.","id":"u3c15","type":"same-concept-variant"},{"title":"Polymorphism, virtual functions and inheritance benefits","topic":"C++ & OOP Concepts","technique":"Run-time polymorphism = virtual functions + base-class interface; pure virtual (=0) makes a class abstract; overriding is late binding, overloading is early binding.","what_changes":"Direct definition vs match vs T/F.","representative":"june2025_q57","members":["june2025_q57","dec2022_q46","dec2022_q11","dec2023_q10","june2024_reexam_q29"],"skip_note":"Same definition set tested five ways.","id":"u3c16","type":"same-concept-variant"},{"title":"Access control: protected inheritance, friend, scope resolution","topic":"C++ & OOP Concepts","technique":"Protected inheritance makes public/protected base members protected in derived; objects outside cannot access them; friend breaks encapsulation without being a member.","what_changes":"Which access or friend statement.","representative":"dec2023_q87","members":["dec2023_q87","dec2019_q15","dec2024_q64","dec2019_q71"],"skip_note":"Same access-rule table.","id":"u3c17","type":"same-concept-variant"},{"title":"Call by value vs reference tracing","topic":"Parameter Passing, Scope & Language Concepts","technique":"Value copies: swap on copies does nothing; reference/pointer swaps change originals; swapping char* locally vs via char** differ.","what_changes":"Language syntax and type being swapped.","representative":"june2024_reexam_q42","members":["june2024_reexam_q42","july2018_q5","dec2018_q47","june2024_reexam_q27","sep2022_q98"],"skip_note":"One parameter-passing model solves all five.","id":"u3c18","type":"same-concept-variant"},{"title":"Language-concept true/false statements","topic":"Parameter Passing, Scope & Language Concepts","technique":"Recall: static binding at compile time, globals reduce function independence, C is weak-static, Java strong-static, logical vs syntax errors.","what_changes":"Concept probed.","representative":"dec2024_q5","members":["dec2024_q5","dec2022_q9","sep2022_q96","july2018_q7"],"skip_note":"Straight fact recall; skip beyond one pass of the fact list.","id":"u3c19","type":"same-concept-variant"},{"title":"Java facts and execution model","topic":"Java / Python / Other Languages","technique":"final class cannot be extended; Java single-inheritance of classes; JVM needs class loader + interpreter; JDK/JRE/JNDI/RMI meanings.","what_changes":"Fact asked.","representative":"nov2021_q4","members":["nov2021_q4","july2018_q6","dec2019_q32"],"skip_note":"Same Java-fact bank.","id":"u3c20","type":"same-concept-variant"},{"title":"Java output tracing (references, equals, recursion)","topic":"Java / Python / Other Languages","technique":"Arrays are references so aliases share changes; equals(Good) overloads rather than overrides Object.equals; unroll recursion left-to-right.","what_changes":"Program body.","representative":"july2018_q3","members":["july2018_q3","june20 hnique":"Bytes = X*Y*bpp/8; LUT = 2^bits entries * 3 bytes; refresh = 1/(pixels*access time); resize keeps aspect ratio.","what_changes":"Resolution, bit depth, access time.","representative":"june2019_q27","members":["june2019_q27","dec2018_q41","july2018_q8","nov2021_q6","dec2019_q19"],"skip_note":"One formula family; solve the frame-buffer and refresh ones.","id":"u3c26","type":"same-formula"},{"title":"Display and colour terminology","topic":"Display Devices & Graphics Hardware","technique":"Raster scan = lines of dots; fluorescence is light during beam, phosphorescence after; hue is wavelength; input/output classification.","what_changes":"Terminology asked.","representative":"dec2024_q80","members":["dec2024_q80","dec2022_shiftii_q87","dec2023_q12","dec2022_q68"],"skip_note":"Single-line definitions.","id":"u3c27","type":"same-concept-variant"},{"title":"2D scaling arithmetic","topic":"Graphics: 2D/3D Transformations & Projections","technique":"x'=sx*x, y'=sy*y; scaling about a fixed point F: P'=F+s(P-F).","what_changes":"Scale factors and whether origin or fixed point.","representative":"june2023_q79","members":["june2023_q79","dec2023_q9","dec2022_shiftii_q46","june2023_q80"],"skip_note":"Same scaling formula.","id":"u3c28","type":"same-formula"},{"title":"Homogeneous 3x3 transformation matrices","topic":"Graphics: 2D/3D Transformations & Projections","technique":"Read the matrix: translation in last column, scale on diagonal, shear off-diagonal; compose right-to-left; reflection about x-axis is diag(1,-1).","what_changes":"Specific matrix or figure.","representative":"nov2021_q8","members":["nov2021_q8","july2018_q10","dec2018_q42","nov2020_q66","june2019_q28"],"skip_note":"Same matrix reading skill; do the shear one.","id":"u3c29","type":"same-concept-variant"},{"title":"Projection properties (perspective, parallel, oblique)","topic":"Graphics: 2D/3D Transformations & Projections","technique":"Perspective: farther is smaller, parallel lines converge, divide by z, needs homogeneous coords; orthographic is affine and keeps parallels; cavalier no foreshortening, cabinet half.","what_changes":"Statement mix.","representative":"nov2020_q46","members":["nov2020_q46","june2019_q29","dec2018_q44","nov2020_q76","june2025_q63"],"skip_note":"Same property table.","id":"u3c30","type":"same-concept-variant"},{"title":"Clipping algorithms identification","topic":"Graphics: Clipping, Curves, Surfaces & Shading","technique":"Line clipping: Cohen-Sutherland, Liang-Barsky, Nicholl-Lee-Nicholl; polygon clipping: Sutherland-Hodgman (convex window); clipping removes outside parts.","what_changes":"Identification vs match.","representative":"june2025_q31","members":["june2025_q31","dec2019_q18","june2023_q65","june2023_q77","dec2023_q68"],"skip_note":"Same classification list.","id":"u3c31","type":"same-concept-variant"},{"title":"Hidden-surface and visibility","topic":"Graphics: Clipping, Curves, Surfaces & Shading","technique":"Painter sorts by depth, z-buffer is image-space, back-face culling is object-space; collinear with viewpoint means nearer point obscures.","what_changes":"Statement set.","representative":"dec2018_q45","members":["dec2018_q45","july2018_q9","sep2022_q17","dec2023_q47"],"skip_note":"Same visibility taxonomy.","id":"u3c32","type":"same-concept-variant"},{"title":"Line-drawing algorithm facts","topic":"Graphics: Line/Circle Algorithms","technique":"DDA and Bresenham/midpoint draw lines; Bresenham is integer-only, no rounding; scan conversion causes staircase, unequal brightness, picket fence.","what_changes":"Statement set.","representative":"nov2021_q7","members":["nov2021_q7","dec2018_q43","june2024_cancelled_q80","dec2024_q51"],"skip_note":"Same line-drawing fact set.","id":"u3c33","type":"same-concept-variant"},{"title":"Bezier and curve facts","topic":"Graphics: Clipping, Curves, Surfaces & Shading","technique":"Cubic Bezier has 4 control points, passes through first and last only, stays in convex hull, tangent at ends; B-splines give local control.","what_changes":"Statement set.","representative":"nov2021_q9","members":["nov2021_q9","nov2020_q82","dec2022_q12","june2023_q11"],"skip_note":"Same Bezier property list.","id":"u3c34","type":"same-concept-variant"},{"title":"Shading models","topic":"Graphics: Clipping, Curves, Surfaces & Shading","technique":"Phong specular uses (R.V)^n; Phong shading interpolates normals, Gouraud interpolates colour and is cheaper.","what_changes":"Which model.","representative":"nov2020_q47","members":["nov2020_q47","june2019_q30"],"skip_note":"Same model facts.","id":"u3c35","type":"same-concept-variant"}],"singletons":21,"mindset":["Recent papers (2023-25) are about 36% C: pointer/array output tracing dominates; every June 2024 Re-Exam C item is a mechanical trace.","Favourite format is a 4-statement T/F set with codes like (A) and (B) only; most are decided by two facts, so eliminate options by one certain statement.","Matching and arranging items appear about 3 times per paper, usually common-sense terminology; answer from one confident pair.","Numbers are reused across years: the 640x480 frame buffer, 1024x768 resize, and recursive Java f() reappear with different constants.","Distractors exploit syntax slips: p=x without &, ptr+ptr, SQR without parentheses, counter = 1 in the return, 0x/octal literals.","Graphics items are almost never full derivations: the Bresenham error terms, clipping outcodes and Bezier blending are asked as statements.","Java/Python/web items have faded since 2022; C and C++ conceptual items have grown, so spend time accordingly.","Never asked: circle algorithms, Python code, pointer-to-pointer function arguments beyond one swap, 3D rotation matrices numerically, template syntax in depth.","Cross-unit overlap: loop/recursion tracing mirrors Unit 1 algorithms; Language and OOP basics overlap with Unit 1 programming questions."],"formulas":[{"name":"Frame buffer size","formula":"bytes = X * Y * bits_per_pixel / 8 (640*480*12/8 = 460800 B = 450 KB)","used_in":["june2019_q27","nov2021_q6"],"note":"Divide by 8 for bytes, then 1024 for KB; 1 MP is ~1e6 pixels and 1-bit images need 1/8 byte."},{"name":"Colour lookup table size","formula":"LUT = 2^bits_per_pixel entries * (3*8 bits) = 2^bits * 3 bytes","used_in":["dec2018_q41"],"note":"Frame buffer 10 bpp: LUT 1024 entries * 3 bytes = 2^10 + 2^11 bytes."},{"name":"Refresh rate","formula":"rate = 1 / (pixels * access time) (640*480*200 ns = 61.4 ms, about 16 fps)","used_in":["july2018_q8"],"note":"Pixels count first; 1 bit depth does not change per-pixel time."},{"name":"Aspect-ratio resize","formula":"h2 = h1 * w2 / w1 (768*640/1024 = 480)","used_in":["dec2019_q19"],"note":"Keep ratio, scale both sides by the same factor."},{"name":"2D scaling","formula":"x' = sx*x, y' = sy*y; matrix diag(sx, sy)","used_in":["june2023_q79","dec2022_shiftii_q46","june2023_q80"],"note":"Factor > 1 enlarges, < 1 shrinks; applied about origin."},{"name":"Scaling about fixed point F","formula":"P' = F + s(P - F)","used_in":["dec2023_q9"],"note":"F stays unchanged; compute each vertex difference from F."},{"name":"Homogeneous 2D matrices","formula":"Translate [[1,0,tx],[0,1,ty],[0,0,1]]; Scale diag(sx,sy,1); Shear-x [[1,h,0],[0,1,0],[0,0,1]]; Rotate [[c,-s,0],[s,c,0],[0,0,1]]","used_in":["nov2021_q8","july2018_q10","dec2018_q42","nov2020_q66"],"note":"Composite M = M_last ... M_first; the rightmost matrix acts first."},{"name":"Reflection about X axis","formula":"diag(1,-1); determinant -1, so not a rotation","used_in":["june2019_q28"],"note":"Reflection is not a rotation matrix; y-axis reflection is diag(-1,1)."},{"name":"Perspective division","formula":"x' = x/z, y' = y/z via homogeneous w; non-linear in Cartesian, linear only in homogeneous coordinates","used_in":["nov2020_q46","nov2020_q76","dec2018_q44"],"note":"Parallel lines converge except those parallel to the view plane; parallel projection = viewer at infinity."},{"name":"Orthographic projection","formula":"Affine: preserves parallel lines, no size change with depth","used_in":["june2019_q29","nov2020_q76"],"note":"Cavalier: no foreshortening; cabinet: half-scale depth; both oblique."},{"name":"Cubic Bezier","formula":"P(t)=sum B_i P_i, with P(0)=P0, P(1)=P3, P(1/2)=(P0+3P1+3P2+P3)/8; 4 control points, inside convex hull","used_in":["nov2021_q9","nov2020_q82","dec2022_q12"],"note":"Interpolates only end points; tangent at ends along P1-P0 and P3-P2."},{"name":"Phong specular term","formula":"I_s = k_s (R . V)^n  (reflected vector and view vector)","used_in":["june2019_q30"],"note":"Not the normal and light vector; that is the diffuse term."},{"name":"Clipping facts","formula":"Cohen-Sutherland: accept if both outcodes 0000, reject if AND != 0; Sutherland-Hodgman clips polygons against convex window; a triangle clipped by a rectangle gives at most 7 sides","used_in":["dec2019_q17","dec2019_q18","june2023_q65","nov2021_q10"],"note":"Sutherland-Hodgman is polygon clipping, not line clipping."},{"name":"Row-major 3D address","formula":"addr(A[r][s][t]) = base + w*(b*c*r + c*s + t) for int A[a][b][c]","used_in":["june2023_q45"],"note":"First index multiplies b*c; the leading dimension a never appears."},{"name":"Array/pointer identity","formula":"a[i] = *(a+i); a[i][j][k] = *(*(*(a+i)+j)+k); ptr[-1] legal; &arr+1 moves past whole array","used_in":["dec2022_q10","june2025_q13","june2024_reexam_q62","dec2023_q78"],"note":"Pointer arithmetic scales by element size."},{"name":"Pointer operation legality","formula":"ptr +/- int -> ptr; ptr - ptr -> int; ptr + ptr, ptr*int, ptr/int illegal; int to pointer needs a cast","used_in":["june2025_q68","june2023_q83","june2024_cancelled_q21","dec2019_q72"],"note":"Option \"pointer - pointer -> pointer\" is the usual trap."},{"name":"Struct alignment","formula":"member offset multiple of its size; struct size multiple of largest member alignment; union size = largest member","used_in":["nov2020_q11","june2019_q22"],"note":"Add padding after members as well as before."},{"name":"Little-endian value","formula":"two-byte value = byte1*256 + byte0 (5, 2 gives 517)","used_in":["july2018_q4"],"note":"LSB stored at lowest address."},{"name":"C operator precedence","formula":"arithmetic > shift > relational (<,>,>=) > equality (==) > && > || > ?: > assignment (=,+=) > comma","used_in":["june2025_q72","dec2024_q2"],"note":"Relational binds tighter than equality."},{"name":"Macro expansion","formula":"SQR(x) = (x*x) with x = b+2 expands to b+2*b+2 = 11 for b=3","used_in":["dec2023_q16"],"note":"No parentheses means textual substitution."},{"name":"Number literals","formula":"0x10 = 16, leading 0 means octal: 010 = 8","used_in":["june2023_q31"],"note":"Sum 24, not 26."},{"name":"Bit loop","formula":"while(n){c+=n&1; n>>=1;} counts set bits; N&(N-1)==0 tests power of 2","used_in":["june2019_q24","nov2021_q2","dec2018_q49"],"note":"Check the return statement for assignment typos."},{"name":"Loop iteration count","formula":"while(p<b){p*=a;x++;} gives x = ceil(log_a b)","used_in":["nov2020_q9"],"note":"Ceil not floor because exit needs p >= b."},{"name":"Geometric series sum","formula":"S = a/(1-r), |r|<1 (recursive Java f sums to 0.2)","used_in":["nov2020_q12","dec2018_q48"],"note":"Check the base case before summing."},{"name":"Constructor/destructor order","formula":"Constructors run base -> derived; destructors derived -> base; virtual destructor needed for delete through base pointer","used_in":["june2024_reexam_q48"],"note":"Without virtual, only the base destructor runs."},{"name":"Parameter passing","formula":"By value: copy, caller unchanged; by reference / pointer: original changed; swapping char* needs char**","used_in":["june2024_reexam_q42","june2024_reexam_q27","july2018_q5","dec2018_q47"],"note":"f1(char*,char*) swap has no caller effect."},{"name":"XML validity","formula":"valid XML => also well-formed (not the reverse); XML is case sensitive; namespaces provide globally unique nam p: SELECT is DML but not data modification; COUNT(*) vs COUNT(col); WHERE vs HAVING.","Transactions rising: precedence graph schedules and protocol property matching appear nearly every year.","Indexing and data mining are rarely asked; B+ order calculations appear only occasionally and use simplified arithmetic.","Overlaps with Unit 3/OS-style concurrency and Unit 10 big data only at the keyword level."],"formulas":[{"name":"Attribute closure","formula":"X+ = X plus attributes derived by repeatedly applying FDs; X is a superkey iff X+ = all attributes","used_in":["dec2018_q82","dec2022_q14","june2023_q51","june2025_q33","nov2020_q14"],"note":"Attributes never on any RHS must be in every key"},{"name":"Candidate key","formula":"Minimal superkey; alternate key = candidate not chosen as primary","used_in":["dec2024_q11","june2019_q36","dec2022_shiftii_q14"],"note":"Candidate key = unique and irreducible"},{"name":"Minimal cover","formula":"Single-attribute RHS; no extraneous LHS attribute; no redundant FD","used_in":["sep2022_q61","dec2019_q96","dec2019_q99","dec2022_q50"],"note":"Redundant FD = derivable from the rest"},{"name":"2NF","formula":"No non-prime attribute depends on a proper subset of a candidate key","used_in":["nov2021_q67","july2018_q66","dec2019_q98"],"note":"Partial dependency means not 2NF"},{"name":"3NF","formula":"For each X->A: X is a superkey or A is prime","used_in":["june2025_q52","june2024_reexam_q2"],"note":"Transitive dependency on non-prime breaks 3NF"},{"name":"BCNF","formula":"For each nontrivial X->A: X is a superkey","used_in":["june2023_q29","june2025_q70","dec2024_q34","june2019_q34"],"note":"BCNF => 3NF => 2NF => 1NF; may lose dependency preservation; any 2-attribute relation is in BCNF"},{"name":"4NF / 5NF","formula":"4NF: every nontrivial MVD has a superkey LHS; 5NF: every join dependency is implied by candidate keys","used_in":["dec2023_q69","june2024_reexam_q35"],"note":"5NF = project-join normal form"},{"name":"Lossless binary decomposition","formula":"R1 intersect R2 -> R1 or R1 intersect R2 -> R2","used_in":["june2024_reexam_q21","june2023_q24"],"note":"Also check each original FD is preserved in some fragment"},{"name":"3NF guarantee","formula":"3NF synthesis is always lossless and dependency preserving; BCNF is lossless but may not preserve","used_in":["june2023_q29","june2024_reexam_q41"],"note":"Classic distractor"},{"name":"Cross product and join size","formula":"Cross product: degree d1+d2, tuples n1*n2; natural join max tuples n1*n2, min 0","used_in":["nov2021_q65","dec2019_q21","dec2023_q100","dec2023_q96"],"note":"Outer joins add unmatched tuples (right outer >= |right relation|)"},{"name":"Relational division","formula":"pi(x,y)(R) / pi(y)(S) gives x paired with every y","used_in":["june2025_q17","sep2022_q34"],"note":"Use for 'all' queries"},{"name":"Degree and cardinality","formula":"Degree = number of attributes; cardinality = number of tuples","used_in":["dec2024_q65","nov2021_q62"],"note":"Snapshot gives both"},{"name":"Referential integrity","formula":"Insert into referencing and delete from referenced relation can violate; ON DELETE CASCADE deletes referencing tuples","used_in":["july2018_q69","june2019_q39"],"note":"Cascade chains transitively"},{"name":"B+ tree leaf order","formula":"p*(key + record ptr) + block ptr <= B so p = floor((B - Pb)/(K+Pr))","used_in":["nov2021_q48","nov2021_q66"],"note":"B=1024,K=9,Pr=7,Pb=6 gives 63; key for B-tree item was (57,53)"},{"name":"Conflicting operations","formula":"Different transactions, same item, at least one write","used_in":["nov2020_q48","dec2023_q49","june2025_q77"],"note":"Cycle in precedence graph => not conflict serializable"},{"name":"Serializability hierarchy","formula":"Conflict serializable => view serializable; Thomas write rule only view serializable","used_in":["june2025_q77","sep2022_q88"],"note":"Converse false"},{"name":"Concurrency protocols","formula":"2PL may deadlock; strict 2PL cascadeless; conservative 2PL and timestamp ordering deadlock-free; tree protocol deadlock-free","used_in":["june2023_q63","dec2022_q69","june2024_cancelled_q45","sep2022_q88"],"note":"Timestamp ordering is conflict serializable"},{"name":"Phantom problem","formula":"Caused by insertions; prevented by index locking or predicate locking","used_in":["dec2024_q25","june2024_cancelled_q59"],"note":"Not time stamping"},{"name":"ACID","formula":"Atomicity, Consistency, Isolation, Durability","used_in":["june2023_q53","dec2022_q49"],"note":"Deadlock-freedom is not part of ACID"},{"name":"Transaction states","formula":"Active -> partially committed -> committed; active/partially committed -> failed -> aborted","used_in":["nov2021_q69"],"note":"From active: partially committed or failed"},{"name":"Irrecoverable schedule","formula":"Tj reads data written by Ti and commits before Ti commits","used_in":["june2023_q36"],"note":"Cascadeless needs reads only of committed data"},{"name":"DDL vs DML","formula":"DDL: CREATE, ALTER, DROP; DML: SELECT, INSERT, UPDATE, DELETE","used_in":["dec2023_q13","nov2021_q70","june2019_q37","dec2024_q35","dec2024_q55"],"note":"SELECT does not modify data"},{"name":"WHERE vs HAVING","formula":"WHERE filters rows before grouping; HAVING filters groups after aggregation","used_in":["dec2022_q99","dec2019_q22","dec2018_q84"],"note":"Aggregate conditions go in HAVING"},{"name":"COUNT variants","formula":"COUNT(*) counts rows; COUNT(col) ignores NULL; COUNT(DISTINCT col) counts distinct values","used_in":["june2024_cancelled_q96","june2024_cancelled_q99"],"note":"Missing join condition gives Cartesian product (nov2020_q97)"},{"name":"Top-k correlated query","formula":"where (select count(*) from book where price > B.price) < k lists the k most expensive","used_in":["july2018_q62"],"note":"< 7 gives seven titles"},{"name":"varchar vs char","formula":"varchar uses actual length; char(n) is padded to n","used_in":["dec2018_q77"],"note":"3 and 20"},{"name":"Hadoop roles","formula": ority":"Must","why":"18 questions (11%) in 9 papers (4 early, 14 recent); address arithmetic repeated.","what_to_study":["Page/frame/offset bit calculations","Page table size, TLB EMAT","Internal vs external fragmentation, segmentation","Page table structures (hierarchical, inverted, clustered)","Swap time"]},{"topic":"Process Synchronization & Semaphores","count":13,"papers":10,"first_year":"July 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"13 questions (8%) but in 10 of 15 papers (67%) with steady trend; semaphore arithmetic recurs.","what_to_study":["Counting semaphore arithmetic","Critical section structure, mutual exclusion","Spin lock/busy waiting","Readers-writers"]},{"topic":"Deadlocks","count":8,"papers":4,"first_year":"December 2018","last_year":"June 2024 (Re-Exam)","trend":"steady","priority":"Medium","why":"8 questions (5%) in 4 papers; 5 are one Banker passage and 2 are the same formula.","what_to_study":["n(m-1)+1 rule","Safe sequence and Banker data structures"]},{"topic":"Compilers Phases (system software view)","count":5,"papers":4,"first_year":"November 2020","last_year":"June 2024 (Re-Exam)","trend":"rising","priority":"Medium","why":"5 questions (3%) in 4 papers, mostly recent.","what_to_study":["Phases of compiler and order","Symbol table uses and best data structure","Cross compiler"]},{"topic":"Assemblers, Loaders, Linkers & Macros","count":4,"papers":3,"first_year":"November 2021","last_year":"December 2022 (Shift II)","trend":"fading","priority":"Low","why":"4 questions (2%) in 3 papers, none after Dec 2022.","what_to_study":["Pseudo-instructions (ORG, END, DEC)","Load-and-go assembler","Machine/assembly language classification","Location counter, activation record matching"]}],"clusters":[{"id":"u5c1","title":"SSTF seek-time/head-movement on a request queue","type":"same-concept-variant","topic":"File Systems & Disk Scheduling","technique":"Sort out nearest-first order: from the head repeatedly pick the pending request with smallest |difference|; add the gaps (multiply by ms per cylinder if asked). Draw the visiting order on one line.","what_changes":"Request list, head start, cylinder count and ms/cylinder. june2019_q41 and june2023_q78 are the same queue (4,34,10,7,19,73,2,15,6,20 from 50 = 119).","representative":"june2023_q78","members":["june2023_q78","june2019_q41","nov2020_q16","june2025_q99"],"skip_note":"If you can run SSTF once on june2023_q78 the other three are only different numbers."},{"id":"u5c2","title":"Total head movement for FCFS / SCAN / C-SCAN / C-LOOK","type":"same-concept-variant","topic":"File Systems & Disk Scheduling","technique":"FCFS = sum of consecutive gaps. SCAN goes to the disk end then reverses; C-SCAN goes to the end then jumps to 0 (jump counted in the usual textbook answer) and continues; LOOK/C-LOOK turn at the last request, not the disk end.","what_changes":"Algorithm, direction, start head, queue, disk size.","representative":"june2025_q97","members":["june2025_q97","june2025_q100","dec2023_q17","dec2022_q80"],"skip_note":"Same single skill of tracing one policy; after solving the June 2025 queue under two policies the rest follow."},{"id":"u5c3","title":"Identify the 2nd request served / the policy from a head graph","type":"same-concept-variant","topic":"File Systems & Disk Scheduling","technique":"Trace the policy order on the same queue: C-LOOK(right) serves increasing requests then jumps to the lowest; SCAN(left) serves decreasing requests first. For a graph, look for a jump back without touching the disk end = C-LOOK.","what_changes":"Which policy and direction; asks order rather than total.","representative":"june2025_q96","members":["june2025_q96","june2025_q98","dec2024_q27"],"skip_note":"Pure order-of-service tracing already trained by the head-movement cluster."},{"id":"u5c4","title":"Disk capacity / geometry arithmetic","type":"same-formula","topic":"File Systems & Disk Scheduling","technique":"capacity = surfaces x tracks 8","title":"Paging address arithmetic (pages, frames, offset, page table size, internal fragmentation)","type":"same-formula","topic":"Memory Management & Paging/Segmentation","technique":"pages = VA size/page size; offset bits = log2(page size); frames = PM size/page size; PT size = pages x entry size; internal fragmentation = unused part of last page.","what_changes":"Memory sizes, page size, PTE size, which quantity asked.","representative":"nov2021_q79","members":["dec2024_q47","nov2021_q80","dec2023_q18","nov2021_q77","nov2021_q76","nov2021_q78","nov2021_q79"],"skip_note":"Nov 2021 passage gives all subparts; rest are variants of the same computation."},{"id":"u5c9","title":"Effective access time with TLB","type":"same-formula","topic":"Memory Management & Paging/Segmentation","technique":"EMAT = h(t+m) + (1-h)(t+2m) for single-level paging (t = TLB time, m = memory time).","what_changes":"h, t and m values.","representative":"nov2020_q18","members":["nov2020_q18","dec2019_q27"],"skip_note":"Identical formula, only numbers change."},{"id":"u5c10","title":"Logical / virtual / physical address terminology","type":"same-concept-variant","topic":"Memory Management & Paging/Segmentation","technique":"Address in main memory = physical address; CPU-generated = logical (virtual); address space = logical/virtual set, memory space = physical set.","what_changes":"Matching vs direct question.","representative":"june2025_q11","members":["dec2023_q14","june2025_q11"],"skip_note":"Same vocabulary pair."},{"id":"u5c11","title":"Count page faults on a reference string (FIFO / LRU / Optimal)","type":"same-concept-variant","topic":"Page Replacement & Virtual Memory","technique":"Simulate frames in a table; FIFO evicts oldest loaded, LRU least recently used, Optimal the page used farthest in future. Count misses.","what_changes":"Algorithm, frame count and reference string (and sometimes a difference between two algorithms).","representative":"nov2020_q15","members":["june2019_q4
