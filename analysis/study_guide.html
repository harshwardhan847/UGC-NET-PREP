ordering only.","representative":"dec2022_q53","members":["june2024_cancelled_q13","dec2022_q53"],"skip_note":"Same step sequence."},{"id":"u5c16","title":"Linux interrupt protection level ordering","type":"exact-repeat","topic":"OS Concepts, Unix/Linux & Shell","technique":"Increasing priority: user mode < kernel system service routines < bottom half handlers < top half handlers.","what_changes":"Only the lettering of the options.","representative":"june2025_q30","members":["june2025_q30","dec2023_q80"],"skip_note":"Identical question in Dec 2023 and June 2025."},{"id":"u5c17","title":"I/O protection and interrupts","type":"same-concept-variant","topic":"OS Concepts, Unix/Linux & Shell","technique":"I/O instructions are privileged; with memory-mapped I/O protection is by the OS (memory protection); I/O completion interrupts are different from a trap for protection.","what_changes":"Assertion-reason vs direct form.","representative":"june2023_q9","members":["june2023_q9","july2018_q54"],"skip_note":"Same protection concept."},{"id":"u5c18","title":"Unix/Linux command facts","type":"same-concept-variant","topic":"OS Concepts, Unix/Linux & Shell","technique":"wc -l counts lines; chmod -R a+x; lpr prints; user passwords/accounts in /etc/passwd; glob *.[ch].","what_changes":"Which command.","representative":"june2019_q50","members":["june2019_q50","dec2023_q19","july2018_q55","dec2018_q68"],"skip_note":"Single-fact recall; memorise the list."},{"id":"u5c19","title":"Process-creation system calls (fork, exec, clone, kill, exit)","type":"same-concept-variant","topic":"OS Concepts, Unix/Linux & Shell","technique":"fork creates child; exec loads new program; kill sends signal; exit terminates; clone gives selective sharing flags (Linux).","what_changes":"Matching vs fill-in.","representative":"nov2021_q74","members":["dec2022_shiftii_q17","nov2021_q74","dec2018_q76"],"skip_note":"Same syscalls."},{"id":"u5c20","title":"Match-the-following of OS terms","type":"same-concept-variant","topic":"OS Concepts, Unix/Linux & Shell","technique":"Link each term to its area: Banker = resource allocation, demand paging = virtual memory, LFU = cache replacement, critical section = mutual exclusion, firmware = ROM, PCB = TCB, IPC = computational speedup.","what_changes":"Mixed term pairs.","representative":"dec2022_shiftii_q70","members":["june2024_cancelled_q17","dec2022_shiftii_q70","sep2022_q80","sep2022_q81"],"skip_note":"Examiner reuses the same standard pairings."},{"id":"u5c21","title":"Preemptive SJF / SRTF waiting or turnaround time","type":"same-concept-variant","topic":"Process Management & CPU Scheduling","technique":"Draw the Gantt chart; at every arrival compare remaining times. TAT = CT - AT; WT = TAT - BT.","what_changes":"Arrival and burst values; nov2021_q75 and july2018_q59 are near-identical sets.","representative":"june2023_q42","members":["nov2021_q75","june2023_q42","july2018_q59","dec2022_q52","june2019_q45"],"skip_note":"Gantt-chart method same each time."},{"id":"u5c22","title":"Non-preemptive FCFS / SJF / HRRN metrics on one process set","type":"same-formula","topic":"Process Management & CPU Scheduling","technique":"FCFS by arrival; SJF picks the smallest burst among arrived processes; HRRN ratio = (W+S)/S. Weighted turnaround = TAT/burst.","what_changes":"Metric asked.","representative":"dec2024_q98","members":["dec2024_q98","dec2024_q99","dec2024_q97","dec2022_shiftii_q20"],"skip_note":"Dec 2024 passage shares one table across sub-questions."},{"id":"u5c23","title":"Priority scheduling average waiting / response time (non-preemptive)","type":"same-concept-variant","topic":"Process Management & CPU Scheduling","technique":"Order by priority (lower number first), then cumulative start times give waiting times.","what_changes":"Burst and priority values.","representative":"dec2024_q77","members":["dec2024_q96","dec2024_q77"],"skip_note":"Same procedure."},{"id":"u5c24","title":"Round-robin waiting/turnaround and maximum wait","type":"same-concept-variant","topic":"Process Management & CPU Scheduling","technique":"Simulate the queue with quantum q; waiting = completion - arrival - burst; worst-case wait for n processes = (n-1)q.","what_changes":"Quantum and processes.","representative":"dec2019_q30","members":["dec2019_q30","dec2022_shiftii_q88","dec2018_q73"],"skip_note":"One simulation skill."},{"id":"u5c25","title":"Scheduling theory statements (starvation, response time, quantum)","type":"same-concept-variant","topic":"Process Management & CPU Scheduling","technique":"SRTF and priority may starve; HRRN/aging fixes starvation; RR gives better response than FCFS; tiny quantum means many context switches.","what_changes":"Statement combinations.","representative":"dec2022_shiftii_q51","members":["june2023_q13","dec2022_shiftii_q51","dec2022_q51","dec2024_q100"],"skip_note":"Same facts recombined."},{"id":"u5c26","title":"Preemptive vs non-preemptive circumstances","type":"same-concept-variant","topic":"Process Management & CPU Scheduling","technique":"Preemption happens when running->ready or waiting->ready; non-preemptive SJF never context-switches mid-burst.","what_changes":"Option format.","representative":"dec2019_q74","members":["july2018_q60","dec2019_q74"],"skip_note":"Same distinction."},{"id":"u5c27","title":"Thread concepts and models","type":"same-concept-variant","topic":"Process Management & CPU Scheduling","technique":"Threads share code, data and files but have own stack and registers; user library creates threads; concurrency one-to-one > many-to-many > many-to-one.","what_changes":"Assertion, statement or ordering.","representative":"dec2022_q20","members":["june2025_q71","june2023_q20","dec2023_q88","dec2022_q20"],"skip_note":"Related facts about threads."},{"id":"u5c28","title":"Process model basics (states, queue, PCB, heap, cascading termination)","type":"same-concept-variant","topic":"Process Management & CPU Scheduling","technique":"Running can go to ready (timer), waiting (I/O); ready queue holds ready processes in memory; PCB holds state, registers, scheduling info (not code); heap = dynamic memory; cascading termination.","what_changes":"Definition recall.","representative":"june2024_reexam_q75","members":["june2025_q2","sep2022_q22","dec2022_q18","dec2018_q75","june2024_reexam_q75"],"skip_note":"All are definition recall."},{"id":"u5c29","title":"OS-specific scheduling (Windows, Linux)","type":"same-concept-variant","topic":"Process Management & CPU Scheduling","technique":"Windows 16 non-real-time priorities (and 16 real-time); Linux supports preemptive priority and time-sharing.","what_changes":"Which OS.","representative":"dec2019_q26","members":["june2024_cancelled_q64","dec2019_q26"],"skip_note":"Pure recall."},{"id":"u5c30","title":"Counting semaphore value after P and V operations","type":"same-formula","topic":"Process Synchronization & Semaphores","technique":"final = initial - (#P) + (#V).","what_changes":"Which of the three quantities is unknown.","representative":"june2023_q58","members":["july2018_q51","june2023_q58","dec2019_q24","june2019_q46"],"skip_note":"Same arithmetic; numbers change."},{"id":"u5c31","title":"Mutual exclusion and critical-section statements","type":"same-concept-variant","topic":"Process Synchronization & Semaphores","technique":"Only one process in critical section; structure entry/critical/exit/remainder; spin lock = busy waiting; unaware processes still have mutual exclusion, starvation, deadlock problems but not coherence.","what_changes":"Option combinations.","representative":"june2024_reexam_q5","members":["june2024_cancelled_q15","dec2023_q53","june2024_reexam_q5","dec2022_shiftii_q52","dec2018_q74"],"skip_note":"Same facts."},{"id":"u5c32","title":"Maximum processes for deadlock freedom","type":"same-formula","topic":"Deadlocks","technique":"Deadlock-free if R >= n(m-1)+1, so n_max = floor((R-1)/(m-1)).","what_changes":"R and m values.","representative":"dec2018_q70","members":["dec2018_q70","june2019_q48"],"skip_note":"Same formula, numbers only."},{"id":"u5c33","title":"Banker's algorithm passage","type":"same-concept-variant","topic":"Deadlocks","technique":"Banker avoids deadlock; needs Max, Allocation, Available matrices/vectors; grants only if the system stays in a safe state.","what_changes":"Which sub-question.","representative":"june2024_reexam_q100","members":["june2024_reexam_q98","june2024_reexam_q96","june2024_reexam_q97","june2024_reexam_q99","june2024_reexam_q100"],"skip_note":"One passage, five sub-questions."},{"id":"u5c34","title":"Symbol table","type":"same-concept-variant","topic":"Compilers Phases (system software view)","technique":"Symbol table used for storage allocation, type checking, duplicate-error suppression; hash table gives fastest access.","what_changes":"Question form.","representative":"nov2020_q41","members":["dec2023_q23","nov2020_q41"],"skip_note":"Same two facts."},{"id":"u5c35","title":"Compiler phases order and roles","type":"same-concept-variant","topic":"Compilers Phases (system software view)","technique":"Lexical -> syntax -> semantic -> intermediate code -> optimization -> code generation; syntax analysis checks grammar.","what_changes":"Order vs identification.","representative":"june2024_reexam_q71","members":["june2023_q60","june2024_reexam_q71"],"skip_note":"Same phase list."}],"singletons":45,"mindset":["Numerical questions (scheduling, disk scheduling, page-fault counting, paging arithmetic, semaphore arithmetic) form roughly a third of the unit; small data sets, always solvable by hand.","Same data is reused: june2019_q41 and june2023_q78 share one SSTF queue, nov2021_q75 and july2018_q59 share a preemptive SJF set, dec2023_q80 and june2025_q30 are the same question.","Passage-based multi-question sets (nov2020 disk, nov2021 paging, june2023 LRU array, june2024 Banker, dec2024 scheduling, june2025 disk queue) give 5 questions each and are the main source of repetition.","Match-the-following questions mix terms across OS areas; the same standard pairings recur (RAID levels, Banker = resource allocation).","Trap options: C-SCAN/SCAN differences (jump counted or not), the difference between FIFO and LRU for Belady, 'current needs' column in Banker.","Distractors are near-values from off-by-one or unit mistakes (KB vs bytes, ms vs seconds).","Difficulty is mostly easy to moderate; heavy theory such as formal proofs or code is never asked, but fork-counting appears occasionally.","Cross-unit overlap: Unit 5 questions on OS appear in matching with data structures and networking cloud terms; compiler and assembler items are minor.","Process management and file systems/disk scheduling alone take over 40% of the unit.","Never asked: kernel source code, detailed Windows internals beyond priority counts, deep distributed OS theory."],"formulas":[{"name":"Deadlock-free process bound","formula":"R >= n(m-1)+1, so n_max = floor((R-1)/(m-1))","used_in":["dec2018_q70","june2019_q48"],"note":"R resources, each process needs m; e.g. R=12,m=4 gives 3"},{"name":"Banker: Need","formula":"Need = Max - Allocation; safe if some order lets every process finish with Available","used_in":["dec2019_q28","june2024_reexam_q98","june2024_reexam_q96","june2024_reexam_q100"],"note":"In dec2019_q28 'Current needs' column is actually the allocation"},{"name":"Disk capacity","formula":"surfaces x tracks per surface x sectors per track x bytes per sector","used_in":["nov2020_q92","nov2020_q91","nov2020_q93","sep2022_q8"],"note":"Double-sided platters have 2 surfaces each"},{"name":"Sector-address bits","formula":"log2(surfaces x tracks x sectors)","used_in":["dec2018_q18"],"note":"Count total sectors, then bits"},{"name":"Rotational delay","formula":"max = 60/rpm seconds; average = half of that","used_in":["nov2020_q94"],"note":"5400 rpm gives 11.1 ms"},{"name":"Data transfer rate","formula":"bytes per track x revolutions per second","used_in":["nov2020_q95"],"note":"One track per revolution"},{"name":"Seek time","formula":"total head movement x time per cylinder","used_in":["nov2020_q16","june2023_q78","june2019_q41"],"note":"SSTF picks nearest pending request each time"},{"name":"Disk policies","formula":"SCAN goes to end then reverses; C-SCAN goes to end then jumps to start; LOOK/C-LOOK turn at the last request","used_in":["june2025_q97","june2025_q100","dec2023_q17","june2025_q99","dec2022_q80","june2025_q96","june2025_q98","dec2024_q27"],"note":"C-SCAN return jump counted in textbook answers"},{"name":"Inode maximum file size","formula":"(direct + p + p^2) x block size, p = block size/address size","used_in":["nov2020_q17"],"note":"2KB blocks,4B addresses: p=512, about 513 MB"},{"name":"Tape write time","formula":"(data / recording density) / speed (+ inter-block gaps)","used_in":["sep2022_q64"],"note":"600000/1600/200 = 1.875 s"},{"name":"Paging sizes","formula":"pages = VA/page size; offset bits = log2(page); frames = PM/page; page table size = pages x entry size","used_in":["dec2024_q47","dec2023_q18","nov2021_q77","nov2021_q76","nov2021_q78","nov2021_q79"],"note":"Physical address bits = log2(PM size)"},{"name":"Internal fragmentation","formula":"unused space in last page = pages x page size - process size","used_in":["nov2021_q80"],"note":"34 KB with 4 KB pages gives 2 KB"},{"name":"EMAT with TLB","formula":"h(t+m) + (1-h)(t+2m)","used_in":["nov2020_q18","dec2019_q27"],"note":"Single level page table; two-level adds extra m"},{"name":"EAT with page faults","formula":"(1-p)m + p x fault time; or p + q/100 if one fault per 100","used_in":["nov2021_q71","july2018_q52"],"note":"Hit ratio form h*t1 + (1-h)*t2"},{"name":"Swap time","formula":"2 x (size/transfer rate) + latencies","used_in":["june2025_q62"],"note":"15MB/30MBps=0.5s each way"},{"name":"Belady's anomaly","formula":"Occurs for FIFO; LRU and optimal are stack algorithms and have no anomaly","used_in":["june2023_q38","june2023_q13"],"note":"Common trap in statement questions"},{"name":"Little's law","formula":"n = lambda x W","used_in":["june2025_q4"],"note":"20 = 10 x W gives 2 s"},{"name":"Scheduling times","formula":"TAT = CT - AT; WT = TAT - BT; RT = first run - AT; HRRN ratio = (W+S)/S","used_in":["dec2024_q98","dec2022_q52","dec2019_q30","dec2024_q99","nov2021_q75","june2023_q42","dec2024_q97","dec2018_q73"],"note":"Weighted TAT = TAT/burst"},{"name":"RR worst-case wait","formula":"(n-1) x q","used_in":["dec2022_shiftii_q88"],"note":"20 processes, q=4 gives 76 ms"},{"name":"Counting semaphore","formula":"final = initial - #P + #V","used_in":["july2018_q51","june2023_q58","dec2019_q24","june2019_q46"],"note":"Solve for unknown #V"},{"name":"fork count","formula":"k sequential forks create 2^k processes","used_in":["nov2020_q84"],"note":"Count prints by tracing each fork"},{"name":"RAID levels","formula":"0 striping,1 mirror,2 bit ECC,3 bit parity,4 block parity,5 distributed block parity,6 P+Q","used_in":["june2025_q64","dec2024_q41","june2023_q46","june2024_cancelled_q25","dec2022_q15"],"note":"Level 1 for write-heavy logs"},{"name":"Linux interrupt priority","formula":"user < kernel system service < bottom half < top half","used_in":["june2025_q30","dec2023_q80"],"note":"Exact repeat"},{"name":"Thread sharing","formula":"Shared: code,data,files,address space. Private: stack,registers,PC","used_in":["june2019_q43","dec2023_q88"],"note":"Threads of same process share address space"},{"name":"Thread model concurrency","formula":"one-to-one > many-to-many > many-to-one","used_in":["dec2022_q20"],"note":"Many-to-one blocks entirely on a blocking call"},{"name":"Boot order","formula":"ROM firmware -> boot block -> bootstrap loader -> kernel","used_in":["dec2022_shiftii_q80"],"note":"Ordering trap"},{"name":"Layered file system","formula":"Application -> logical FS -> file organization module -> basic FS -> I/O control","used_in":["june2025_q19"],"note":"Top to bottom"},{"name":"File allocation","formula":"Contiguous has external fragmentation; linked and indexed do not","used_in":["dec2023_q52","nov2021_q72"],"note":"Indexed supports direct+sequential access"},{"name":"Compiler phase order","formula":"lexical, syntax, semantic, intermediate code, optimization, code generation","used_in":["june2023_q60","june2024_reexam_q71"],"note":"Hash table best for symbol table"},{"name":"Unix facts","formula":"fork creates child; exec loads program; kill signals; clone selective sharing; wc -l; lpr; /etc/passwd; chmod -R a+x","used_in":["june2019_q50","dec2022_shiftii_q17","dec2023_q19","july2018_q55","nov2021_q74","dec2018_q68","dec2018_q76"],"note":"Single-fact recall"}],"plan":[{"step":1,"focus":"Scheduling numericals","topics":["Process Management & CPU Scheduling"],"hours":3.0,"do":"Solve reps u5c21 june2023_q42, u5c22 dec2024_q98, u5c23 dec2024_q77, u5c24 dec2019_q30 with Gantt charts; memorise formulas."},{"step":2,"focus":"Process/thread theory","topics":["Process Management & CPU Scheduling"],"hours":1.5,"do":"Read clusters u5c25 to u5c29 and singletons on fork, Little's law."},{"step":3,"focus":"Disk scheduling and geometry","topics":["File Systems & Disk Scheduling"],"hours":3.0,"do":"Trace reps u5c1 to u5c5 (june2023_q78, june2025_q97, june2025_q96, nov2020_q92, nov2020_q95)."},{"step":4,"focus":"RAID, allocation, inode","topics":["File Systems & Disk Scheduling"],"hours":1.5,"do":"Memorise RAID table; do u5c6, u5c7 and inode/tape singletons."},{"step":5,"focus":"Paging arithmetic","topics":["Memory Management & Paging/Segmentation"],"hours":2.0,"do":"Solve nov2021_q79 set, TLB rep nov2020_q18 and the singletons on swap time and page table structures."},{"step":6,"focus":"Page replacement","topics":["Page Replacement & Virtual Memory"],"hours":2.5,"do":"Simulate nov2020_q15 style strings (FIFO, LRU, Optimal), June 2023 passage rep june2023_q93, EAT rep july2018_q52."},{"step":7,"focus":"OS concepts recall","topics":["OS Concepts, Unix/Linux & Shell"],"hours":2.0,"do":"Learn u5c16 to u5c20 reps; scan singletons on boot, kernel, privileged instructions."},{"step":8,"focus":"Synchronization and deadlocks","topics":["Process Synchronization & Semaphores","Deadlocks"],"hours":1.5,"do":"Semaphore formula (june2023_q58), mutual exclusion statements, deadlock rule dec2018_q70, Banker passage."},{"step":9,"focus":"Compilers and assemblers quick pass","topics":["Compilers Phases (system software view)","Assemblers, Loaders, Linkers & Macros"],"hours":0.5,"do":"Memorise phase order, symbol table facts and pseudo-instructions."}],"minset":50},{"unit":6,"name":"Software Engineering","total":144,"papers":15,"topics":[{"topic":"Software Quality, Maintenance & Configuration Mgmt","count":33,"papers":13,"first_year":"July 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"Largest topic: 33 questions, 13 papers.","what_to_study":["Maintenance types, reengineering","CMM levels","ISO 9126/McCall","SCM/version control","Reliability and availability formulas"]},{"topic":"Software Testing","count":27,"papers":14,"first_year":"December 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"27 questions, 14 papers; matching and classification dominate.","what_to_study":["Test type tables","Black vs white box","Coverage, BVA","Flowgraph questions"]},{"topic":"Software Process Models","count":23,"papers":13,"first_year":"July 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"Frequent (23 of 144, 13 papers) with agile/cleanroom/ordering variants every few papers.","what_to_study":["Agile model list, principles, FDD order","Cleanroom facts","Prototype/spiral/incremental/RAD/evolutionary suitability","Generic framework activity order"]},{"topic":"Requirements Engineering & UML","count":22,"papers":11,"first_year":"December 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"22 questions in 11 papers; SRS attributes, UML and elicitation repeat.","what_to_study":["SRS attributes and definitions","Elicitation and validation techniques","UML diagram types and purpose, sequence diagrams","DFD levels, NFRs, formal methods"]},{"topic":"Software Design, Coupling & Cohesion","count":16,"papers":11,"first_year":"July 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"16 questions, 11 papers; cohesion/coupling dominate.","what_to_study":["Cohesion and coupling ranking and definitions","MVC and design patterns","Modularity glossary"]},{"topic":"Software Metrics, Estimation & COCOMO","count":16,"papers":11,"first_year":"July 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"16 questions (11%) incl. computational ones, 11 papers.","what_to_study":["LOC/productivity arithmetic","Cyclomatic complexity","COCOMO forms","FP, maturity index, software equation"]},{"topic":"Project Management, Risk & Scheduling","count":7,"papers":6,"first_year":"June 2019","last_year":"December 2024","trend":"steady","priority":"High","why":"7 questions but in 6 of 15 papers (40%); small but recurring.","what_to_study":["PERT/CPM","Risk categories and RE","EVM CPI","Project manager roles"]}],"clusters":[{"id":"u6c1","title":"Agile: which models/principles are agile","type":"same-concept-variant","topic":"Software Process Models","technique":"Agile = XP, Scrum, FDD, ASD, Crystal, DSDM; NOT waterfall/spiral/incremental. Agile principles favour change, customer collaboration, working software, delivering increments; 'following the plan' is the anti-principle.","what_changes":"Pick-the-agile-models, odd-one-out principle, or correct handling of unpredictability","representative":"june2024_reexam_q15","members":["june2024_reexam_q15","dec2018_q59","dec2022_shiftii_q53"],"skip_note":"All three test 'agile = embrace change, incremental delivery'; one pass covers all."},{"id":"u6c2","title":"Agile/FDD sequence and artifact matching","type":"same-concept-variant","topic":"Software Process Models","technique":"Memorise FDD order: overall model, feature list, plan by feature, design by feature, build by feature. Agile flow: plan, design, develop, test, release. Scrum=sprint backlog, XP=CRC cards, ASD=speculate-collaborate-learn.","what_changes":"Ordering vs matching of agile phases/artifacts","representative":"june2024_reexam_q10","members":["june2024_reexam_q10","june2024_reexam_q22","dec2019_q84"],"skip_note":"Same memorised sequences/artifacts reappear; learn the lists once."},{"id":"u6c3","title":"Cleanroom software engineering","type":"same-concept-variant","topic":"Software Process Models","technique":"Cleanroom: incremental model, formal specification, statistical (usage-based) testing and certification, correctness verification (static); no unit testing/dynamic verification by developers.","what_changes":"Which statement is false / which is not a strategy","representative":"nov2021_q19","members":["nov2021_q19","july2018_q19","dec2018_q55"],"skip_note":"Same 3-4 facts about cleanroom each time."},{"id":"u6c4","title":"Process model suitability matching","type":"same-concept-variant","topic":"Software Process Models","technique":"Waterfall=stable requirements; incremental=core product quickly; evolutionary/prototype=unclear reqs; component-based=reuse, compromises inevitable; spiral=risk driven.","what_changes":"Match model to system type","representative":"nov2021_q17","members":["nov2021_q17","june2019_q57"],"skip_note":"Both are the same model-to-situation table."},{"id":"u6c5","title":"Spiral model characteristics","type":"same-concept-variant","topic":"Software Process Models","technique":"Spiral = risk-driven, evolutionary/cyclic, suited to changing/unclear requirements, large projects.","what_changes":"Select-correct-statements format","representative":"dec2024_q39","members":["dec2024_q39","dec2023_q60"],"skip_note":"Same risk-driven/changing-requirement facts."},{"id":"u6c6","title":"Prototype model phase order","type":"same-concept-variant","topic":"Software Process Models","technique":"Order: requirements/quick play -> quick design -> build prototype -> customer evaluation -> refine -> deliver/engineer final product.","what_changes":"Wording of steps differs, order same","representative":"dec2024_q1","members":["dec2024_q1","dec2023_q82"],"skip_note":"Same sequence reworded."},{"id":"u6c7","title":"SRS quality attribute definitions","type":"same-concept-variant","topic":"Requirements Engineering & UML","technique":"Map definition to attribute: unambiguous=one interpretation, consistent=no conflicts, verifiable=cost-effective check, complete, modifiable, traceable, ranked. Reliability is not an SRS attribute.","what_changes":"Which attribute / which is NOT an attribute","representative":"sep2022_q94","members":["sep2022_q94","sep2022_q26","nov2021_q14","dec2018_q52"],"skip_note":"Same attribute list, different definition asked."},{"id":"u6c8","title":"Elicitation and validation techniques","type":"same-concept-variant","topic":"Requirements Engineering & UML","technique":"Elicitation: interviews, questionnaires, ethnography (observation), prototyping, use cases/scenarios, JAD; DFD is analysis, not elicitation. Inspection/reviews/prototype/test-case generation validate requirements.","what_changes":"Name the technique from its description","representative":"june2025_q66","members":["june2025_q66","june2023_q37","dec2024_q48"],"skip_note":"Same technique-to-description mapping."},{"id":"u6c9","title":"UML diagram identity and purpose","type":"same-concept-variant","topic":"Requirements Engineering & UML","technique":"Static/structural: class, object, component, deployment, use-case(static view per UGC key). Behavioural: state, activity, sequence, collaboration. Use-case = external actors interacting with system.","what_changes":"Static vs dynamic, match diagram to description","representative":"dec2018_q54","members":["dec2018_q54","nov2020_q19","june2023_q88"],"skip_note":"Same diagram-purpose table."},{"id":"u6c10","title":"Sequence diagram reading","type":"same-concept-variant","topic":"Requirements Engineering & UML","technique":"Count lifelines/objects and follow messages top to bottom in time order.","what_changes":"Count objects vs message order","representative":"dec2019_q89","members":["dec2019_q89","dec2019_q33"],"skip_note":"Both from Dec 2019; read diagram carefully, no theory."},{"id":"u6c11","title":"OO analysis/behaviour modelling step order","type":"same-concept-variant","topic":"Requirements Engineering & UML","technique":"OOA order: use-case + activity -> interaction (sequence) -> class -> state chart/object -> component/deployment. Behaviour model: evaluate use-cases, identify events, build state transition diagram, review.","what_changes":"Order or which steps included","representative":"dec2023_q79","members":["dec2023_q79","nov2020_q50"],"skip_note":"Both ask the ordered modelling steps."},{"id":"u6c12","title":"Cohesion types and ranking","type":"same-concept-variant","topic":"Software Design, Coupling & Cohesion","technique":"Best to worst: functional > sequential > communicational > procedural > temporal > logical > coincidental. Communicational = same input/output data.","what_changes":"Rank, pick better-than-X, or define","representative":"june2025_q21","members":["june2025_q21","nov2020_q77","sep2022_q44","dec2022_shiftii_q81"],"skip_note":"One ranking list answers all."},{"id":"u6c13","title":"Coupling types","type":"same-concept-variant","topic":"Software Design, Coupling & Cohesion","technique":"Low to high: data < stamp < control < external < common < content. Common = shared global data; control = one module controls flow of another.","what_changes":"Statement validity or ordering","representative":"june2025_q69","members":["june2025_q69","july2018_q16","dec2018_q60"],"skip_note":"One ranking plus definitions answers all."},{"id":"u6c14","title":"Software engineering terms matching (coupling/cohesion=design)","type":"exact-repeat","topic":"Software Design, Coupling & Cohesion","technique":"Product complexity-> metrics; structured analysis -> requirements; coupling & cohesion -> design; symbolic execution -> validation.","what_changes":"Identical items, only the list-ordering differs","representative":"dec2022_shiftii_q71","members":["dec2022_shiftii_q71","july2018_q12"],"skip_note":"Exact repeat across 4 years."},{"id":"u6c15","title":"Design principle definitions matching","type":"same-concept-variant","topic":"Software Design, Coupling & Cohesion","technique":"Cohesion=intra-module strength, coupling=inter-module dependency, modularity=division, abstraction=hide details, encapsulation=packaging.","what_changes":"Different terms in the match list","representative":"june2024_reexam_q64","members":["june2024_reexam_q64","sep2022_q77"],"skip_note":"Same glossary matching."},{"id":"u6c16","title":"MVC component roles","type":"same-concept-variant","topic":"Software Design, Coupling & Cohesion","technique":"Model=business logic/domain data, View=UI presentation, Controller=handles input and updates model.","what_changes":"M asked vs V asked","representative":"nov2021_q12","members":["nov2021_q12","june2019_q52"],"skip_note":"Learn M,V,C once."},{"id":"u6c17","title":"Productivity/effort/time arithmetic","type":"same-formula","topic":"Software Metrics, Estimation & COCOMO","technique":"Effort = size/productivity; size = effort*productivity-rate; duration = effort/(team*hours per day).","what_changes":"Which variable is unknown","representative":"june2024_reexam_q66","members":["june2024_reexam_q66","june2024_reexam_q89","june2024_reexam_q25","july2018_q11"],"skip_note":"Same division; three came from one paper."},{"id":"u6c18","title":"Cyclomatic complexity and flow graphs","type":"same-formula","topic":"Software Metrics, Estimation & COCOMO","technique":"V(G)=E-N+2=P+1=number of regions; independent paths = V(G).","what_changes":"Graph given, compute V(G) or related counts","representative":"june2024_cancelled_q61","members":["june2024_cancelled_q61","dec2019_q91","dec2019_q92","dec2019_q93","dec2019_q94","dec2019_q95","dec2022_q24"],"skip_note":"Single formula; the Dec 2019 passage gives five questions from one graph."},{"id":"u6c19","title":"Availability from MTBF/downtime","type":"same-formula","topic":"Software Quality, Maintenance & Configuration Mgmt","technique":"Availability = MTBF/(MTBF+MTTR) = uptime fraction; downtime = (1-A)*period.","what_changes":"Solve for repair time or availability","representative":"july2018_q14","members":["july2018_q14","nov2021_q15"],"skip_note":"Same availability formula."},{"id":"u6c20","title":"Software metric categories","type":"same-concept-variant","topic":"Software Metrics, Estimation & COCOMO","technique":"Size and complexity = product metrics; LOC/FP normalise by size (size-oriented); indirect measures = functionality, quality, reliability, maintainability.","what_changes":"Which category","representative":"sep2022_q41","members":["sep2022_q41","sep2022_q43","sep2022_q30"],"skip_note":"All from Sep 2022; one definition set."},{"id":"u6c21","title":"COCOMO basics","type":"same-concept-variant","topic":"Software Metrics, Estimation & COCOMO","technique":"COCOMO = Constructive Cost Model; basic organic E=2.4(KLOC)^1.05 PM, D=2.5E^0.38; semidetached 3.0/1.12; embedded 3.6/1.20.","what_changes":"Expansion vs equation","representative":"june2025_q32","members":["june2025_q32","dec2022_shiftii_q22"],"skip_note":"Both from COCOMO table."},{"id":"u6c22","title":"Types of maintenance","type":"same-concept-variant","topic":"Software Quality, Maintenance & Configuration Mgmt","technique":"Corrective=fix bugs, adaptive=new environment/platform, perfective=new features/restructuring for improvement, preventive=future maintainability.","what_changes":"Reason to definition","representative":"dec2018_q53","members":["dec2018_q53","june2019_q58","nov2020_q20","dec2022_shiftii_q23"],"skip_note":"Same four definitions."},{"id":"u6c23","title":"Reengineering and reverse engineering","type":"same-concept-variant","topic":"Software Quality, Maintenance & Configuration Mgmt","technique":"Reverse engineering = recover design/spec from code (analysis only, no change); reengineering = reverse + forward restructuring; reasons: adapt, new tech, maintainability.","what_changes":"True/false and goal identification","representative":"june2025_q18","members":["june2025_q18","june2024_cancelled_q48","dec2018_q58","july2018_q18"],"skip_note":"Same definition set."},{"id":"u6c24","title":"CMM maturity levels","type":"same-concept-variant","topic":"Software Quality, Maintenance & Configuration Mgmt","technique":"1 Initial, 2 Repeatable (project mgmt), 3 Defined (process definition), 4 Managed (measurement), 5 Optimizing (continuous improvement).","what_changes":"Order vs match","representative":"dec2024_q87","members":["dec2024_q87","nov2021_q18","nov2020_q68","july2018_q15"],"skip_note":"Same five-level ladder."},{"id":"u6c25","title":"Quality model attributes (ISO 9126)","type":"same-concept-variant","topic":"Software Quality, Maintenance & Configuration Mgmt","technique":"ISO 9126: functionality, reliability, usability, efficiency, maintainability, portability.","what_changes":"Match attribute to description","representative":"june2025_q10","members":["june2025_q10","dec2019_q83"],"skip_note":"Same attribute table."},{"id":"u6c26","title":"Configuration management and version control","type":"same-concept-variant","topic":"Software Quality, Maintenance & Configuration Mgmt","technique":"Commit source and documentation, not generated output; SCM provides versioning, branching, diff; Git is distributed VCS.","what_changes":"Which feature/file belongs","representative":"june2024_reexam_q70","members":["june2024_reexam_q70","nov2021_q16","july2018_q13","june2019_q55"],"skip_note":"Same SCM basics."},{"id":"u6c27","title":"Quality control vs quality assurance","type":"same-concept-variant","topic":"Software Quality, Maintenance & Configuration Mgmt","technique":"QC = inspections/tests on products (detective); QA = process, preventive, no code execution.","what_changes":"Statement truth","representative":"nov2020_q85","members":["nov2020_q85","june2024_cancelled_q89"],"skip_note":"Same QA/QC distinction."},{"id":"u6c28","title":"Testing type matching","type":"same-concept-variant","topic":"Software Testing","technique":"Unit=component, integration=interfaces, system=whole, acceptance=user; regression=no new bugs; white box=condition coverage, black box=ECP/BVA.","what_changes":"Match test type to description","representative":"june2025_q43","members":["june2025_q43","dec2022_q71","june2023_q15","june2024_reexam_q81","june2024_cancelled_q71"],"skip_note":"Same table of test types."},{"id":"u6c29","title":"Alpha and beta testing","type":"same-concept-variant","topic":"Software Testing","technique":"Alpha at developer site, beta at customer site; both acceptance testing.","what_changes":"Category vs who performs","representative":"nov2021_q11","members":["nov2021_q11","sep2022_q28"],"skip_note":"Same two facts."},{"id":"u6c30","title":"Black-box vs white-box technique classification","type":"same-concept-variant","topic":"Software Testing","technique":"Black box: ECP, BVA, graph-based; white box: path, loop, data-flow, condition coverage.","what_changes":"Classify techniques","representative":"nov2020_q51","members":["nov2020_q51","june2024_cancelled_q87"],"skip_note":"Same classification."},{"id":"u6c31","title":"Coverage criteria relations","type":"same-concept-variant","topic":"Software Testing","technique":"Path coverage subsumes branch and statement coverage; branch subsumes statement.","what_changes":"Coverage test input or statement truth","representative":"june2019_q53","members":["june2019_q53","dec2018_q56"],"skip_note":"Same coverage hierarchy."},{"id":"u6c32","title":"Testing fundamentals statements","type":"same-concept-variant","topic":"Software Testing","technique":"Exhaustive testing impractical; testing effort needs early planning and is costly.","what_changes":"Assertion-reason or two statements","representative":"dec2022_q54","members":["dec2022_q54","nov2021_q20"],"skip_note":"Both true; common sense."},{"id":"u6c33","title":"Verification vs validation","type":"same-concept-variant","topic":"Software Testing","technique":"Verification = built right (QA, reviews); validation = right product (user needs).","what_changes":"Definition","representative":"june2023_q7","members":["june2023_q7","june2019_q60"],"skip_note":"Same V&V definition."},{"id":"u6c34","title":"Risk management basics","type":"same-concept-variant","topic":"Project Management, Risk & Scheduling","technique":"RE=P*L; risk categories project/technical/business; known/predictable/unpredictable; monitoring tracks if risks occur.","what_changes":"Formula or classification","representative":"dec2024_q8","members":["dec2024_q8","dec2022_q22","june2019_q59"],"skip_note":"Small risk glossary."},{"id":"u6c35","title":"PERT/CPM and activity charts","type":"same-concept-variant","topic":"Project Management, Risk & Scheduling","technique":"CPM repetitive jobs, PERT non-repetitive; critical path = longest path of dependent tasks defining duration; optimistic = shortest time.","what_changes":"Fill blanks or match","representative":"june2023_q5","members":["june2023_q5","dec2019_q34"],"skip_note":"Same terminology."}],"singletons":44,"mindset":["Roughly 40% of questions are pure recall of definitions/lists; the rest are matching, ordering and true/false statement formats.","Favourite formats: Match List I/II and Arrange-in-order (CMM, prototype, agile, FDD, cohesion/coupling); expect one or two per paper.","Exact repeats are common: coupling statements (2018 x2), SE terms match (2018 and Dec 2022), prototype sequence, CMM order and match.","Numerics are few but reliable: 1-3 per paper (effort/productivity, cyclomatic, availability, reliability); numbers are rarely reused but formulas are.","Dec 2019 gave a five-question passage on a single flow graph; one unit can be a passage worth five marks.","Distractors: reorderings of the same list, 'All of the above/None' options, and a non-member (reliability for SRS, data flow diagram for elicitation, dynamic verification for cleanroom).","June 2024 Re-Exam leaned on easy arithmetic and definitions; Dec 2024 and June 2025 returned to ordering and 'A, B & D only' combos.","Cross-unit overlap: reliability/availability and verification vs validation touch Unit 2-style reliability; V&V appears under requirements and quality too.","He rarely asks deep COCOMO II/function point computation, EVM calculations beyond CPI, or code-level design patterns beyond proxy/MVC.","Topic tags are fuzzy: the same theme (maintenance, reengineering, V&V) is tagged under several topics, so study by theme."],"formulas":[{"name":"Cyclomatic complexity","formula":"V(G) = E - N + 2 = P + 1 = number of regions","used_in":["june2024_cancelled_q61","dec2019_q92","dec2019_q93","dec2019_q95","dec2022_q24"],"note":"P = predicate (decision) nodes; V(G) = number of independent paths"},{"name":"Risk exposure","formula":"RE = P x L","used_in":["dec2022_q22"],"note":"Probability times loss"},{"name":"Cost performance index","formula":"CPI = BCWP / ACWP","used_in":["june2023_q6"],"note":"Earned value over actual cost; schedule index SPI = BCWP/BCWS"},{"name":"Availability","formula":"A = MTBF / (MTBF + MTTR)","used_in":["nov2021_q15","july2018_q14"],"note":"Downtime = (1-A) x period; convert minutes/seconds carefully"},{"name":"Exponential reliability","formula":"R(t) = e^(-t/MTTF), MTTF = mean of times between failures","used_in":["june2023_q72"],"note":"Sample: mean 29/5 gives R(1)=e^(-5/29)"},{"name":"Web app integrity","formula":"integrity = 1 - threat x (1 - security)","used_in":["june2019_q56"],"note":"threat=probability of attack, security=probability of repelling"},{"name":"Software maturity index","formula":"SMI = (Mt - (Fa + Fc + Fd)) / Mt","used_in":["dec2018_q57"],"note":"Mt=modules in current release; Fa added, Fc changed, Fd deleted"},{"name":"Effort from productivity","formula":"Effort = size / productivity; size = effort x rate","used_in":["june2024_reexam_q89","june2024_reexam_q25","july2018_q11"],"note":"Check units (person-month vs hour)"},{"name":"Project duration","formula":"days = effort(person-hours) / (team size x hours per day)","used_in":["june2024_reexam_q66"],"note":"1500/(5x8)=37.5"},{"name":"Cost from effort","formula":"cost = effort (PM) x monthly salary x team; or FP x productivity","used_in":["july2018_q11","nov2020_q22"],"note":"Effort in person-months divided by team gives months"},{"name":"Basic COCOMO organic","formula":"E = 2.4 (KLOC)^1.05 PM; D = 2.5 E^0.38","used_in":["june2025_q32"],"note":"Semidetached 3.0/1.12, embedded 3.6/1.20"},{"name":"Software (Putnam) equation","formula":"E = [LOC x B^0.333 / P]^3 x (1/t^4)","used_in":["dec2024_q13"],"note":"Effort rises as fourth power of compression of time"},{"name":"Boundary value analysis count","formula":"4n + 1 test cases for n variables (robust: 6n + 1)","used_in":["dec2022_shiftii_q24"],"note":"Two variables gives 9"},{"name":"Defect removal efficiency","formula":"DRE = E / (E + D)","used_in":["june2024_cancelled_q24"],"note":"E errors before delivery, D after"},{"name":"Cohesion ranking (best to worst)","formula":"functional > sequential > communicational > procedural > temporal > logical > coincidental","used_in":["june2025_q21","nov2020_q77","sep2022_q44"],"note":"Communicational = same input/output data"},{"name":"Coupling ranking (low to high)","formula":"data < stamp < control < external < common < content","used_in":["june2025_q69","july2018_q16","dec2018_q60"],"note":"Common = shared global data"},{"name":"CMM levels","formula":"Initial, Repeatable, Defined, Managed, Optimizing","used_in":["dec2024_q87","nov2021_q18","nov2020_q68","july2018_q15"],"note":"Repeatable=project management, Defined=process definition, Managed=measurement"},{"name":"Maintenance types","formula":"corrective (bugs), adaptive (environment), perfective (features/restructure), preventive","used_in":["dec2018_q53","june2019_q58","nov2020_q20","dec2022_shiftii_q23"],"note":"Restructuring appears as perfective in nov2020_q20"},{"name":"FDD order","formula":"overall model, feature list, plan by feature, design by feature, build by feature","used_in":["june2024_reexam_q10"],"note":"Memorise"},{"name":"Generic framework activities","formula":"Communication, Planning, Modeling, Construction, Deployment","used_in":["june2024_cancelled_q4"],"note":"Order D,A,C,B,E in option labels"},{"name":"Testing sequence","formula":"Unit, Integration, System, Acceptance","used_in":["june2025_q85"],"note":"Alpha/beta are acceptance"},{"name":"Coverage hierarchy","formula":"path coverage implies branch implies statement coverage","used_in":["june2019_q53","dec2018_q56"],"note":"Reverse not true"},{"name":"ISO 9126 characteristics","formula":"functionality, reliability, usability, efficiency, maintainability, portability","used_in":["dec2019_q83","june2025_q10"],"note":"Reliability not an SRS attribute"}],"plan":[{"step":1,"focus":"Quality and maintenance","topics":["Software Quality, Maintenance & Configuration Mgmt"],"hours":3.0,"do":"Master CMM ladder, maintenance types, reengineering vs reverse, ISO 9126, SCM; solve reps u6c23-u6c28 and availability u6c19."},{"step":2,"focus":"Testing","topics":["Software Testing"],"hours":2.5,"do":"Test type table (u6c29), alpha/beta, black/white box, coverage; do cyclomatic passage u6c18."},{"step":3,"focus":"Process models","topics":["Software Process Models"],"hours":2.5,"do":"Agile lists, cleanroom, spiral, prototype order; solve u6c1-u6c6 reps."},{"step":4,"focus":"Requirements and UML","topics":["Requirements Engineering & UML"],"hours":2.0,"do":"SRS attributes, elicitation techniques, UML types, sequence diagram reading; reps u6c7-u6c11."},{"step":5,"focus":"Design","topics":["Software Design, Coupling & Cohesion"],"hours":1.5,"do":"Cohesion and coupling lists, MVC; reps u6c12-u6c16."},{"step":6,"focus":"Metrics and estimation","topics":["Software Metrics, Estimation & COCOMO"],"hours":2.0,"do":"Effort arithmetic, V(G), COCOMO equations, SMI, Putnam equation; reps u6c17-u6c22."},{"step":7,"focus":"Project management and singletons","topics":["Project Management, Risk & Scheduling"],"hours":1.0,"do":"PERT/CPM, risk, CPI; then skim the singletons in the minimum set."}],"minset":50},{"unit":7,"name":"Data Structures and Algorithms","total":140,"papers":15,"topics":[{"topic":"Trees, BST, AVL, B-Trees & Heaps","count":32,"papers":14,"first_year":"July 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"32 questions (23%) present in 14 of 15 papers at about 2 per paper, steady across the period. The largest block: heaps, BST/AVL/B-tree, tree counting formulas, traversals.","what_to_study":["Tree counting identities (m-ary: L=(m-1)I+1; strict binary: 2L-1 nodes; Catalan for count of binary trees)","Build/insert heaps by hand; build-heap O(n); min in max heap O(n)","AVL rotation types LL RR LR RL and counting rotations; AVL vs red-black trade-offs","B-tree: height bound, node size, insertion splits","Traversals and reconstruction from pre+in","BST construction, height, subtree size","Heap vs balanced BST for the right operations"]},{"topic":"Complexity Analysis & Recurrences","count":25,"papers":14,"first_year":"July 2018","last_year":"June 2025","trend":"rising","priority":"Must","why":"25 questions (18%), present in 14 of 15 papers, 12 of them in the last 6 papers. The single biggest recurring block: master theorem, substitution, asymptotic ordering, complexity matching.","what_to_study":["Master theorem all 3 cases with log/sqrt f(n); non-standard shapes T(3n/4)+1, T(2n/3)+1","Substitution n -> 2^m for T(sqrt n) recurrences","Order functions by growth (compare logs; n^log n vs 2^n vs n^1.5)","Asymptotic notation properties: O,Omega,o,omega transitivity and the worst/best-case definition","Memorise complexity tables: sorts, searches, graph algorithms, FFT, Fibonacci methods, A*/DFS/hill climbing space/time","Order recurrences/algorithms by running time"]},{"topic":"Algorithm Design Paradigms (DP, Greedy, D&C)","count":21,"papers":11,"first_year":"July 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"21 questions (15%) in 11 of 15 papers; Dec 2022 passage (5 Qs) and June 2025 (4 Qs) show it is alive. Mix of conceptual matching and small numerical DP/greedy problems.","what_to_study":["Greedy vs DP vs D&C vs backtracking: classify standard problems (Dijkstra, Kruskal, Huffman, fractional knapsack = greedy; Bellman-Ford, LCS, edit distance, OBST, 0/1 knapsack = DP; merge/quick/binary search, Strassen, closest pair, FFT = D&C; 8-queens = backtracking)","Fractional knapsack: sort by profit/weight, fill, take fraction of last item; O(n log n)","LCS table computation and subsequence reading","Huffman construction (merge two smallest repeatedly), average code length, weighted path length","DP development steps in order: characterize, define recursively, compute bottom-up, construct solution","FFT: polynomial multiplication in O(n lg n)"]},{"topic":"Graph Algorithms (BFS, DFS, MST, Shortest Path)","count":22,"papers":11,"first_year":"July 2018","last_year":"December 2024","trend":"fading","priority":"High","why":"22 questions (16%) in 11 papers, but only 2 came in the last 6 papers (2023-2025) versus 20 in the first 9, so it is fading; kept High (not Must) because of the large historical share and two direct hits in Dec 2024 and June 2024 Re-Exam.","what_to_study":["Run Prim and Kruskal by hand; MST weight; valid edge orders","DFS/BFS validity of traversal sequences (each next vertex must be a neighbour of the stack top / queue frontier)","Match algorithm to purpose and complexity (Dijkstra, Bellman-Ford, Floyd-Warshall, Prim, Kruskal, toposort, Edmonds-Karp)","DFS: no cross edges in undirected graph; applications are toposort and SCC","Flow network skew symmetry/conservation, Ford-Fulkerson O(E*f)","Edge relaxation: d[v]=min(d[v], d[u]+w)"]},{"topic":"Hashing","count":10,"papers":8,"first_year":"July 2018","last_year":"June 2025","trend":"steady","priority":"High","why":"10 questions (7%) in 8 of 15 papers (53%), steady 1-2 per paper. Two near-identical linear probing questions appear in different years.","what_to_study":["Simulate linear probing and closed hashing tables step by step","Chaining / linear / quadratic / double hashing definitions","Double hashing: probe difference = h2(k)","Universal hashing: table size n^2 gives collision probability < 1/2","Hash table is array-based"]},{"topic":"Arrays, Stacks, Queues & Linked Lists","count":9,"papers":6,"first_year":"December 2018","last_year":"June 2025","trend":"rising","priority":"High","why":"9 questions (6%) in 6 papers, but 7 of the 9 came in the last 6 papers (2023-2025), so it is rising. All are conceptual/definition level.","what_to_study":["Queue variants and applications (circular, priority, deque, simple) and BFS-queue / DFS-stack","Circular queue empty/full conditions (one slot sacrificed)","XOR linked list, deque via two stacks, deleting a node when only a pointer to it is given","Sparse matrix types (lower triangular) and adjacency-matrix = sequential representation"]},{"topic":"NP-Completeness & Complexity Classes","count":8,"papers":7,"first_year":"July 2018","last_year":"December 2024","trend":"steady","priority":"Medium","why":"8 questions (6%) in 7 papers; statement-type, mostly one per paper and concept-only.","what_to_study":["If any NP-complete problem is in P then P=NP; NP-complete = NP and NP-hard","SAT, CIRCUIT-SAT, TSP decision, Hamiltonian cycle are NP-complete","co-NP: P subset of co-NP; NP != co-NP implies P != NP","Approximation: vertex cover 2-approx; TSP with triangle inequality 2-approx","EXP class is 2^(n^k)"]},{"topic":"Expression Conversion & Evaluation","count":7,"papers":6,"first_year":"December 2018","last_year":"June 2025","trend":"steady","priority":"Medium","why":"7 questions (5%) in 6 papers, almost one per paper, and always mechanical. Cheap marks once the stack procedure is drilled.","what_to_study":["Infix to postfix with precedence (^ right-assoc, then * /, then + -) and parentheses","Postfix and prefix evaluation with a stack (prefix: scan right to left)","Properties: operand order identical in infix/prefix/postfix; prefix is NOT reverse of postfix in general"]},{"topic":"Sorting","count":4,"papers":3,"first_year":"July 2018","last_year":"June 2024 (Re-Exam)","trend":"fading","priority":"Low","why":"4 questions (3%) in 3 papers, only one in the last six papers; pure property facts.","what_to_study":["Stable: bubble, insertion, merge (quick, heap, shell, selection are not)","In place: insertion, heap, quick (merge is not)","Radix/counting: linear time for range n^c; radix cost = digits x n x radix"]},{"topic":"Searching","count":2,"papers":2,"first_year":"December 2018","last_year":"November 2021","trend":"fading","priority":"Low","why":"Only 2 questions (1.4%), none since 2021. Covered by the comparison/complexity facts elsewhere.","what_to_study":["Second smallest of n: n + ceil(lg n) - 2 comparisons","Binary search on B blocks: log2 B block accesses"]}],"clusters":[{"id":"u7c1","title":"Fractional knapsack passage (Dec 2022)","type":"same-concept-variant","topic":"Algorithm Design Paradigms (DP, Greedy, D&C)","technique":"Compute p/w ratios, sort descending, fill greedily, take a fraction of the last item that does not fit. Greedy is optimal for fractional, not for 0/1.","what_changes":"Capacity (15 vs 25), time complexity O(n log n) with n items, technique name, 0/1 vs fractional statement","representative":"dec2022_q92","members":["dec2022_q91","dec2022_q92","dec2022_q93","dec2022_q94","dec2022_q95"],"skip_note":"All five share one item table; solving cap 25 fully (48.1) also gives cap 15 (40) and the greedy/O(n log n) facts."},{"id":"u7c2","title":"Longest common subsequence","type":"same-formula","topic":"Algorithm Design Paradigms (DP, Greedy, D&C)","technique":"Fill LCS table: match -> diag+1 else max(up,left); read the sequence by backtracking.","what_changes":"Sequences and whether length or the actual subsequence is asked","representative":"june2025_q41","members":["dec2018_q23","june2025_q41"],"skip_note":"Same LCS recurrence; length 4 both times."},{"id":"u7c3","title":"Huffman coding computations and steps","type":"same-concept-variant","topic":"Algorithm Design Paradigms (DP, Greedy, D&C)","technique":"Repeatedly merge the two smallest weights; average length = sum(p*depth); weighted path length = sum of internal merge costs. Steps: leaves, priority queue, combine lowest, repeat.","what_changes":"Probabilities vs integer weights vs step ordering","representative":"july2018_q25","members":["july2018_q25","dec2022_q27","june2025_q86"],"skip_note":"One Huffman run + the step order covers all three."},{"id":"u7c4","title":"DP development steps and properties","type":"same-concept-variant","topic":"Algorithm Design Paradigms (DP, Greedy, D&C)","technique":"Order: characterize optimal structure, recursive definition, compute bottom-up, construct solution. Only optimal-substructure is shared with greedy. Cyclic dependency breaks DP.","what_changes":"Asked as ordering, common-steps, or true/false statements","representative":"june2025_q83","members":["june2019_q68","dec2019_q76","june2024_reexam_q83","june2025_q83"],"skip_note":"Same four-step template; know the order once."},{"id":"u7c5","title":"Classify problems by design paradigm","type":"same-concept-variant","topic":"Algorithm Design Paradigms (DP, Greedy, D&C)","technique":"Memorise the paradigm table: greedy (Dijkstra, Kruskal, Prim, Huffman, fractional knapsack), DP (Bellman-Ford, LCS, edit distance, OBST, 0/1 knapsack, Floyd), D&C (merge, quick, binary search, Strassen, closest pair), backtracking (8-queens).","what_changes":"Matching vs which-is-not vs which-uses-greedy","representative":"dec2022_q72","members":["july2018_q27","dec2022_q72","sep2022_q56","dec2024_q63","june2025_q37"],"skip_note":"Same table in every question; the matching rep covers all."},{"id":"u7c6","title":"FFT polynomial multiplication / FFT complexities","type":"same-concept-variant","topic":"Algorithm Design Paradigms (DP, Greedy, D&C)","technique":"FFT evaluates and interpolates in O(n lg n); pointwise product O(n); so multiplying degree-n polynomials is theta(n lg n).","what_changes":"Wording; June 2023 asks a match of FFT-related times","representative":"dec2022_shiftii_q27","members":["dec2019_q42","dec2022_shiftii_q27","june2023_q10"],"skip_note":"Dec 2019 and Dec 2022 are exact repeats (n lg n)."},{"id":"u7c7","title":"Queue/stack variants and applications","type":"same-concept-variant","topic":"Arrays, Stacks, Queues & Linked Lists","technique":"Know applications: circular queue-CPU scheduling, priority queue-Dijkstra, deque-palindrome check, queue-print, BFS-queue, DFS-stack, prefix-LISP, infix-syntax tree.","what_changes":"Matching form vs single-answer deque property","representative":"june2025_q49","members":["dec2024_q33","dec2024_q46","june2025_q49"],"skip_note":"Same fact set re-asked as matching."},{"id":"u7c8","title":"Asymptotic growth ordering","type":"same-concept-variant","topic":"Complexity Analysis & Recurrences","technique":"Take logs or substitute big n; known chain: log n < sqrt n < n < n log n < n^1.5 < n^2 < n^log n < 2^n < n!.","what_changes":"Functions, polynomial degrees, recurrences or search/sort names being ordered","representative":"nov2021_q47","members":["dec2023_q27","nov2021_q47","june2024_cancelled_q3","june2024_reexam_q30","dec2022_q78"],"skip_note":"Same skill; one fully worked ordering plus the chain covers all."},{"id":"u7c9","title":"Asymptotic notation properties","type":"same-concept-variant","topic":"Complexity Analysis & Recurrences","technique":"Check definitions: O,Omega transitive; e top has >= precedence (not for right-assoc ^); parentheses group; operands emitted immediately.","what_changes":"Expression and whether options reorder operators; Dec 2022 Shift II asks properties","representative":"nov2021_q85","members":["nov2021_q41","nov2021_q85","june2025_q22","dec2022_shiftii_q57"],"skip_note":"Same stack algorithm each time."},{"id":"u7c14","title":"Postfix/prefix evaluation","type":"same-concept-variant","topic":"Expression Conversion & Evaluation","technique":"Postfix: left to right, push operands, apply on two pops (second pop is left operand). Prefix: right to left.","what_changes":"Expression; final value, stack state, or ordering several values","representative":"dec2023_q4","members":["dec2018_q24","dec2023_q4","june2024_cancelled_q78"],"skip_note":"Same stack evaluation."},{"id":"u7c15","title":"Is this sequence a valid DFS?","type":"same-concept-variant","topic":"Graph Algorithms (BFS, DFS, MST, Shortest Path)","technique":"Walk the sequence: each next vertex must be adjacent to a vertex still on the DFS stack path (go back only when stuck).","what_changes":"Graph and sequences","representative":"sep2022_q73","members":["nov2021_q45","sep2022_q73"],"skip_note":"Same checking method."},{"id":"u7c16","title":"MST by hand (Prim/Kruskal)","type":"same-concept-variant","topic":"Graph Algorithms (BFS, DFS, MST, Shortest Path)","technique":"Kruskal: sort edges, add if no cycle. Prim: grow from start picking min edge to new vertex. MST weight is same.","what_changes":"Graph; asks weight, order, or invalid order","representative":"dec2019_q6","members":["dec2018_q12","dec2019_q6","nov2020_q78","dec2022_shiftii_q82"],"skip_note":"Same hand simulation; do one Kruskal and one Prim."},{"id":"u7c17","title":"Match graph algorithms to time complexities","type":"same-concept-variant","topic":"Graph Algorithms (BFS, DFS, MST, Shortest Path)","technique":"Dijkstra O(V^2) (array) / O(E lg V) (heap); Prim O(E lg V); Kruskal O(E lg E); Bellman-Ford O(V ative":"nov2021_q49","members":["july2018_q23","nov2021_q49"],"skip_note":"Exact repeat; answer 5."},{"id":"u7c22","title":"Hash insertion simulation","type":"same-concept-variant","topic":"Hashing","technique":"Compute h(x) for each key and probe forward to the next empty slot.","what_changes":"Hash function and keys; asks table state or index","representative":"sep2022_q57","members":["july2018_q70","sep2022_q57","june2023_q44"],"skip_note":"Same simulation; july2018_q70 and june2023_q44 differ only in the hash function."},{"id":"u7c23","title":"Collision resolution definitions","type":"same-concept-variant","topic":"Hashing","technique":"Chaining=linked list; linear=next slot; quadratic=skip by squares; double=second hash; hash table backed by array.","what_changes":"Matching vs one-liners","representative":"june2025_q45","members":["dec2023_q25","dec2023_q26","june2025_q45"],"skip_note":"Same definitions."},{"id":"u7c24","title":"NP-class statements","type":"same-concept-variant","topic":"NP-Completeness & Complexity Classes","technique":"Use: NPC subset of NP and NP-hard; one NPC in P implies P=NP; SAT/CIRCUIT-SAT/Hamiltonian/TSP-decision are NPC; P subset of co-NP.","what_changes":"Which statements are true","representative":"dec2024_q26","members":["june2019_q67","dec2022_q57","dec2022_shiftii_q56","june2023_q16","dec2024_q26"],"skip_note":"Same fact set."},{"id":"u7c25","title":"Stability and in-place properties of sorts","type":"same-concept-variant","topic":"Sorting","technique":"Stable: bubble, insertion, merge. In-place: insertion, heap, quick.","what_changes":"Property asked","representative":"june2024_reexam_q59","members":["june2019_q62","june2024_reexam_q59"],"skip_note":"One table."},{"id":"u7c26","title":"Linear-time and radix sorting","type":"same-concept-variant","topic":"Sorting","technique":"Radix sort on d-digit numbers: O(d(n+k)); range n^2 -> two passes base n -> O(n). Count-based answer: items x digits x radix.","what_changes":"Numbers","representative":"june2019_q64","members":["july2018_q28","june2019_q64"],"skip_note":"Both radix sort; same reasoning."},{"id":"u7c27","title":"Build heap / insert into heap by hand","type":"same-concept-variant","topic":"Trees, BST, AVL, B-Trees & Heaps","technique":"Max-heapify from n/2 down (build) or sift-up on each insertion; write array.","what_changes":"Array and build vs insert","representative":"dec2018_q22","members":["july2018_q22","dec2018_q22"],"skip_note":"Same hand simulation."},{"id":"u7c28","title":"Heap and priority-queue operation costs","type":"same-concept-variant","topic":"Trees, BST, AVL, B-Trees & Heaps","technique":"Build-heap O(n); heapify/insert/extract O(lg n); min in max-heap O(n); unsorted-array PQ insert O(1), extract-min O(n); heap cannot do dedup in O(lg n).","what_changes":"Operation asked","representative":"june2023_q2","members":["dec2019_q37","nov2020_q24","nov2021_q44","june2023_q2"],"skip_note":"Same cost table."},{"id":"u7c29","title":"Tree counting identities","type":"same-formula","topic":"Trees, BST, AVL, B-Trees & Heaps","technique":"m-ary full: L=(m-1)I+1; strict binary: n=2L-1; degree sum: L=1+sum (d-1)*n_d; leaves of complete binary tree = i+1.","what_changes":"Arity, counts","representative":"nov2020_q23","members":["july2018_q26","july2018_q29","dec2018_q26","nov2020_q23","june2024_cancelled_q84"],"skip_note":"Same identity; substitute numbers."},{"id":"u7c30","title":"Balanced tree concepts (AVL, RB, B, 2-3-4)","type":"same-concept-variant","topic":"Trees, BST, AVL, B-Trees & Heaps","technique":"AVL: strict balance, more rotations; RB: longest path <= 2x shortest, O(lg n); 2-3-4 tree equivalent to red-black; B-tree for disk; AVL rotations LL RR LR RL.","what_changes":"Assertion/reason or statement forms","representative":"dec2024_q81","members":["dec2022_q25","dec2022_q56","dec2023_q3","dec2023_q28","june2023_q21","june2024_reexam_q60","june2025_q23","dec2024_q81"],"skip_note":"Mostly definitions; dec2024_q81 reviews all properties."},{"id":"u7c31","title":"B-tree computations","type":"same-concept-variant","topic":"Trees, BST, AVL, B-Trees & Heaps","technique":"Height h <= log_t((n+1)/2); node size = keys*key size + pointers*size; insertion worst case splits every level (+1 new root).","what_changes":"Parameters","representative":"june2023_q17","members":["dec2019_q38","sep2022_q55","june2023_q17"],"skip_note":"Three small derivations."},{"id":"u7c32","title":"Tree traversals","type":"same-concept-variant","topic":"Trees, BST, AVL, B-Trees & Heaps","technique":"Inorder L-Root-R; reconstruct from preorder+inorder (root first from preorder, split inorder).","what_changes":"Figure vs reconstruction vs ordering steps","representative":"dec2024_q30","members":["sep2022_q58","dec2024_q30","dec2024_q67"],"skip_note":"Same procedure."},{"id":"u7c33","title":"BST build and measure","type":"same-concept-variant","topic":"Trees, BST, AVL, B-Trees & Heaps","technique":"Insert keys in order, then count left-subtree nodes or measure height (edges).","what_changes":"Keys and measure","representative":"dec2018_q25","members":["dec2018_q25","june2024_cancelled_q16"],"skip_note":"Same simulation."}],"singletons":24,"mindset":["Dominant format is \"match List I with List II\" and \"arrange in order\": same fact tables (complexities, paradigms, applications) re-asked with shuffled options.","Easy conceptual definitions are ~half the unit; hand-simulations (probing, heap build, Kruskal/Prim, postfix) form the numerical half and are always small.","Reuse is heavy: the Dec 2018 / Nov 2021 / July 2018 linear-probing \"key 18\" question appears twice verbatim; the Dec 2019 and Dec 2022 FFT n lg n question repeats; infix-to-postfix appears nearly every year.","Complexity block rising: master theorem variants (2T(n/4)+sqrt n, 3T(n/4)+n lg n, T(3m/4)+1, T(2n/3)+1) and sqrt(n) substitutions are favourite non-trivial items.","Graph questions faded sharply after 2022 (2 in last six papers vs 20 earlier) while arrays/queues concept questions rose (7 vs 2).","Distractors: swapping Omega/O, theta vs O, n lg n vs n^2 for sorts, n^lg n vs 2^n, rotating match options by one position, \"prefix is reverse of postfix\".","Multi-question passages appear (Dec 2022 knapsack, 5 Qs): one table gives 5 marks.","Trap statements: Bellman-Ford labelled greedy (it is DP), heap sort labelled D&C (it is not), TSP-tour called 3-approx (it is 2), EXP written 2^k.","Cross-unit overlap: DFS/BFS stack-queue (Unit 3-style programming), AI search complexities (hill climbing, A*), Dijkstra/Prim in networks-style matching.","He never asks long proofs, amortised analysis, red-black insertion step traces, Johnson/KMP algorithm traces or NP-reduction construction; all questions are 1-2 minute solvable."],"formulas":[{"name":"Master theorem","formula":"T(n)=aT(n/b)+f(n): f<n^log_b a -> theta(n^log_b a); f=n^log_b a -> theta(f lg n); f>n^log_b a (regularity) -> theta(f)","used_in":["june2025_q82","sep2022_q53","dec2022_q58","june2024_reexam_q86"],"note":"2T(n/4)+sqrt n -> sqrt n lg n (equal case); 3T(n/4)+n lg n -> n lg n (case 3)."},{"name":"Constant-work shrink","formula":"T(n)=T(cn)+1 -> theta(lg n) for 0<c<1","used_in":["july2018_q21","dec2024_q72"],"note":"T(3m/4)+1 and T(2n/3)+1 are both lg."},{"name":"sqrt recurrence","formula":"T(n)=aT(sqrt n)+f(lg n): let m=lg n -> S(m)=aS(m/2)+f(m)","used_in":["dec2018_q21","dec2019_q39"],"note":"2T(sqrt n)+lg n -> O(lg n lg lg n); 4T(sqrt n)+lg^2 n -> theta(lg^2 n lg lg n)."},{"name":"Growth chain","formula":"lg n < sqrt n < n < n lg n < n^1.5 < n^2 < n^lg n < 2^n < n!","used_in":["nov2021_q47","dec2023_q27","june2024_reexam_q30","dec2022_q78"],"note":"n^lg n is superpolynomial but below 2^n."},{"name":"Worst/best-case O","formula":"Algorithm is O(g) iff worst case O(g); f=O(g) <=> g=Omega(f); little-o and little-omega transitive","used_in":["nov2020_q52","sep2022_q52","june2023_q12"],"note":"O and o are not interchangeable; f=O(g) does not give omega."},{"name":"Sort/search complexities","formula":"binary search lg n; insertion best n worst n^2; merge n lg n; quick avg n lg n worst n^2; heap n lg n; selection n^2","used_in":["dec2024_q86","dec2022_q78","sep2022_q85"],"note":"Insertion sort best case linear."},{"name":"Graph algorithm complexities","formula":"Dijkstra V^2 (heap E lg V); Prim E lg V; Kruskal E lg E; Bellman-Ford VE; Floyd-Warshall V^3; toposort/BFS/DFS V+E; Edmonds-Karp VE^2; Ford-Fulkerson E*f","used_in":["dec2018_q27","nov2020_q70","nov2021_q50","june2019_q61","july2018_q81"],"note":"Kruskal sometimes written O(E lg V) - same."},{"name":"Edge relaxation","formula":"d[v] = min(d[v], d[u]+w(u,v))","used_in":["dec2019_q40"],"note":"Updated value 27 from 29 vs 15+12."},{"name":"Fractional knapsack","formula":"Sort by p/w descending; take whole items then fraction of next; time O(n lg n)","used_in":["dec2022_q91","dec2022_q92","dec2022_q93","dec2022_q94"],"note":"0/1 knapsack needs DP; fractional is greedy."},{"name":"LCS recurrence","formula":"c[i,j]=c[i-1,j-1]+1 if x_i=y_j else max(c[i-1,j],c[i,j-1])","used_in":["dec2018_q23","june2025_q41"],"note":"Subsequence need not be contiguous."},{"name":"Huffman","formula":"Merge two least weights repeatedly; average length = sum p_i*len_i; weighted path length = sum of all merged internal node weights","used_in":["july2018_q25","dec2022_q27","june2025_q86"],"note":"Probabilities 0.08,.40,.25,.15,.12 give 2.15."},{"name":"DP steps","formula":"Characterize structure -> define recursively -> compute bottom-up -> construct solution","used_in":["june2025_q83","june2019_q68","june2024_reexam_q83"],"note":"Only step 1 is shared with greedy."},{"name":"FFT","formula":"Multiply degree-n polynomials in theta(n lg n); point-value product theta(n); Horner evaluation at n points theta(n^2)","used_in":["dec2019_q42","dec2022_shiftii_q27","june2023_q10"],"note":"Parallel FFT span theta(lg n)."},{"name":"Full m-ary tree","formula":"L=(m-1)*I+1; total nodes = m*I+1","used_in":["july2018_q29","nov2020_q23"],"note":"41 leaves, 10 internal -> m=5."},{"name":"Strict binary tree","formula":"n = 2L-1 nodes; internal = L-1","used_in":["july2018_q26","june2024_cancelled_q84"],"note":"19 leaves -> 37 nodes exactly."},{"name":"Degree-sum leaves","formula":"L = 1 + sum over internal nodes (degree-1)","used_in":["dec2018_q26"],"note":"Ternary: 4*0+3*1+3*2+1=10."},{"name":"Catalan number","formula":"Binary trees with n nodes = C(2n,n)/(n+1)","used_in":["dec2022_shiftii_q25"],"note":"Not 2^n-1."},{"name":"Heap facts","formula":"Build-heap theta(n); heapify O(lg n); nodes of height h <= ceil(n/2^(h+1)); min of max-heap lies in leaves O(n)","used_in":["june2023_q2","sep2022_q54","nov2020_q24"],"note":"Insert = sift up."},{"name":"B-tree","formula":"height h <= log_t((n+1)/2); order M node: M-1 keys, M pointers; worst-case insert creates h+1 new nodes","used_in":["sep2022_q55","dec2019_q38","june2023_q17"],"note":"4 levels -> 5 new nodes."},{"name":"Red-black / AVL","formula":"RB: longest path <= 2x shortest, height <= 2 lg(n+1); AVL: |balance|<=1; 2-3-4 tree <-> red-black","used_in":["june2024_reexam_q60","dec2023_q28","june2023_q21"],"note":"AVL more rotations, tighter balance."},{"name":"Traversals","formula":"Inorder L,Root,R; unique tree from preorder+inorder or postorder+inorder","used_in":["sep2022_q58","dec2024_q30","dec2024_q67"],"note":"Preorder first element is root."},{"name":"Postfix/prefix","formula":"Postfix: scan left-right, pop 2 (second popped is left operand). Prefix: scan right-left. Operand order same in infix/postfix","used_in":["dec2023_q4","nov2021_q41","dec2022_shiftii_q57"],"note":"Prefix is not simply reverse of postfix."},{"name":"Circular queue","formula":"Capacity n-1 in array n; empty: front==rear; full: (rear+1) mod n == front","used_in":["june2023_q18"],"note":"One slot sacrificed."},{"name":"Double hashing","formula":"h(k,i) = (h1(k) + i*h2(k)) mod m; probe difference = h2(k)","used_in":["june2019_q66"],"note":"123456 -> 257."},{"name":"Universal hashing","formula":"m=n^2 slots, n keys: P(any collision) < 1/2","used_in":["dec2022_q28"],"note":"Expected collisions < C(n,2)/m."},{"name":"Radix sort cost","formula":"d digits, radix k: theta(d(n+k)); integers in 0..n^2-1 sort in O(n)","used_in":["july2018_q28","june2019_q64"],"note":"9*5*8=360."},{"name":"Second smallest","formula":"n + ceil(lg n) - 2 comparisons (tournament)","used_in":["dec2018_q30"],"note":"Worst case."},{"name":"NP facts","formula":"NPC in P => P=NP; NPC = NP intersect NP-hard; P subset of co-NP; NP != co-NP => P != NP; vertex cover 2-approx; TSP triangle-inequality 2-approx","used_in":["june2023_q16","dec2024_q26","june2019_q67","sep2022_q87"],"note":"EXP = 2^(n^k), not 2^k."},{"name":"Fibonacci methods","formula":"naive recursion exponential; memoised O(n); matrix/doubling O(lg n)","used_in":["june2023_q85"],"note":"Matching question."}],"plan":[{"step":1,"focus":"Complexity & recurrences (largest, rising)","topics":["Complexity Analysis & Recurrences"],"hours":3.0,"do":"Master theorem (solve june2025_q82, sep2022_q53), sqrt substitution (dec2019_q39), growth ordering (nov2021_q47), notation properties (sep2022_q52), complexity matching tables (dec2024_q86, nov2021_q50)."},{"step":2,"focus":"Trees, heaps, BST, AVL, B-trees","topics":["Trees, BST, AVL, B-Trees & Heaps"],"hours":3.5,"do":"Tree counting identities (nov2020_q23), balanced-tree concepts (dec2024_q81), heap build (dec2018_q22) and cost table (june2023_q2), B-tree derivations (june2023_q17), traversals (dec2024_q30), BST build (dec2018_q25), AVL rotations (sep2022_q59)."},{"step":3,"focus":"Algorithm design paradigms","topics":["Algorithm Design Paradigms (DP, Greedy, D&C)"],"hours":2.5,"do":"Paradigm table (dec2022_q72), knapsack passage (dec2022_q92), LCS (june2025_q41), Huffman (july2018_q25), DP steps (june2025_q83), FFT (dec2022_shiftii_q27)."},{"step":4,"focus":"Graph algorithms","topics":["Graph Algorithms (BFS, DFS, MST, Shortest Path)"],"hours":2.5
