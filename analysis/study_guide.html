<title>UGC NET Study Playbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: sticky unit rail + one unit at a time; overview first. Ink-on-paper with a teal accent. */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --fg: #15262a; --muted: #5a6b6f; --line: #d9e0dc; --accent: #0d6a6a; --accent-soft: #dcefec;
  --must: #a1262f; --must-bg: #f8e3e4; --high: #8a5a00; --high-bg: #f8ecd0; --med: #1d5a8e; --med-bg: #dcebf7; --low: #5a6b6f; --low-bg: #e6eae8;
  --code-bg: #eaf0ed;
  --serif: "Source Serif 4", Georgia, serif; --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1a1c; --surface: #162326; --fg: #e3ecea; --muted: #94a8aa; --line: #26393c; --accent: #5cc4bd; --accent-soft: #17383a;
  --must: #f0868d; --must-bg: #3a1e22; --high: #e9bd62; --high-bg: #36290f; --med: #7fb8ec; --med-bg: #16293b; --low: #94a8aa; --low-bg: #213034; --code-bg: #1b2d30; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1a1c; --surface: #162326; --fg: #e3ecea; --muted: #94a8aa; --line: #26393c; --accent: #5cc4bd; --accent-soft: #17383a;
  --must: #f0868d; --must-bg: #3a1e22; --high: #e9bd62; --high-bg: #36290f; --med: #7fb8ec; --med-bg: #16293b; --low: #94a8aa; --low-bg: #213034; --code-bg: #1b2d30; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); padding-inline: 16px; padding-block: 24px 56px; }
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--serif); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); }
h2 { font-size: 1.45rem; margin-bottom: 12px; }
h3 { font-size: 1.1rem; }
p { margin: 0; max-width: 68ch; }
.sub { color: var(--muted); margin-top: 6px; }
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; margin-top: 24px; align-items: start; }
nav.rail { position: sticky; top: env(safe-area-inset-top, 0px); display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
nav.rail a { display: flex; gap: 8px; padding: 7px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 14px; }
nav.rail a b { color: var(--muted); font-weight: 500; min-width: 1.4em; font-variant-numeric: tabular-nums; }
nav.rail a:hover { background: var(--low-bg); }
nav.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.rail a[aria-current="page"] b { color: inherit; }
a:focus-visible, summary:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
.stat dt { font-size: 12px; color: var(--muted); }
.stat dd { margin: 0; font: 600 1.5rem/1.2 var(--serif); font-variant-numeric: tabular-nums; }
.section { margin-top: 30px; }
.section > p.lead { color: var(--muted); margin: -4px 0 12px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.link { cursor: pointer; } tr.link:hover td { background: var(--low-bg); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.p-Must { background: var(--must-bg); color: var(--must); } .p-High { background: var(--high-bg); color: var(--high); }
.p-Medium { background: var(--med-bg); color: var(--med); } .p-Low { background: var(--low-bg); color: var(--low); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 12px; background: var(--low-bg); color: var(--muted); }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; } ul.plain li { max-width: 80ch; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.formula { font: 13px/1.5 var(--mono); background: var(--code-bg); padding: 8px 10px; border-radius: 6px; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.small { font-size: 13px; color: var(--muted); }
.steps { counter-reset: s; display: grid; gap: 10px; padding: 0; list-style: none; margin: 0; }
.steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.steps li::before { counter-increment: s; content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; }
details.cl { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
details.cl + details.cl { margin-top: 8px; }
details.cl > summary { cursor: pointer; padding: 11px 14px; list-style: none; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
details.cl > summary::-webkit-details-marker { display: none; }
details.cl > summary::before { content: "▸"; color: var(--muted); }
details.cl[open] > summary::before { content: "▾"; }
details.cl .body { padding: 2px 14px 14px; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.qbox { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 6px 6px 0; font-size: 14px; }
.qbox .opts { margin-top: 6px; display: grid; gap: 2px; color: var(--muted); font-size: 13px; }
.qbox .ans { color: var(--fg); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font: 12px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--low-bg); color: var(--muted); }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--low-bg); }
.bar i { display: block; background: var(--accent); }
.notes li { color: var(--muted); }
.themebtn { float: right; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  nav.rail { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  nav.rail a { white-space: nowrap; }
}
@media (prefers-reduced-motion: no-preference) { details.cl .body { animation: fade .15s ease-out; } @keyframes fade { from { opacity: 0; } } }
</style>

<div class="wrap">
  <button class="themebtn" id="themebtn" type="button">Theme</button>
  <h1>UGC NET Study Playbook</h1>
  <p class="sub" id="tagline"></p>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Units"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
const DATA = {"meta":{"total":1650,"papers":15,"fmt":{"numerical":319,"recall":492,"statement-true-false":100,"code-output":38,"multi-statement-combo":273,"match-list":165,"sequence-order":104,"assertion-reason":19,"passage":140},"diff":{"1":777,"2":719,"3":154},"skippable":914,"minset":555},"units":[{"unit":1,"name":"Discrete Structures and Optimization","total":181,"papers":15,"topics":[{"topic":"Propositional & Predicate Logic","count":34,"papers":15,"first_year":"July 2018","last_year":"June 2025","trend":"rising","priority":"Must","why":"Largest topic: 34 of 181 (19%), in all 15 papers; Dec 2023 alone has 6.","what_to_study":["Equivalence laws, converse/inverse/contrapositive","Quantifier truth, negation, translation","Tautology and equivalence identification","Normal forms (CNF), simple inference"]},{"topic":"Linear Programming & Optimization","count":26,"papers":12,"first_year":"July 2018","last_year":"December 2024","trend":"steady","priority":"Must","why":"26 of 181 (14%); 12 of 15 papers; two passages (Dec 2023, June 2024) contribute 5 each, so it can appear as a block.","what_to_study":["Formulate LP from word problem and write dual","Graphical corner-point method","Simplex and dual simplex first iteration","Duality theorems; transportation m+n-1; PERT/CPM basics"]},{"topic":"Sets, Relations & Functions","count":26,"papers":15,"first_year":"July 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"26 of 181 (14%); present in every one of 15 papers.","what_to_study":["Properties of relations (reflexive/symmetric/transitive)","Equivalence relations, closure","Inclusion-exclusion with 2-3 sets","Set identities, empty-set membership, floor/ceiling, function types"]},{"topic":"Graph Theory","count":21,"papers":11,"first_year":"December 2018","last_year":"December 2024","trend":"fading","priority":"Must","why":"21 of 181 (12%); 11 of 15 papers; counts dropped in the last 6 papers (6 vs 15), but the fundamentals remain scoring.","what_to_study":["Handshake lemma, tree and forest edge counts","Euler formula and planarity","Colouring and bipartite","Hamiltonian/Euler conditions","Spanning-tree counts and standard graph families"]},{"topic":"Combinatorics & Recurrences","count":20,"papers":8,"first_year":"December 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"20 of 181 (11%); 8 of 15 papers; arrives in blocks (3-4 per paper) when it appears.","what_to_study":["Pigeonhole N=k(r-1)+1","Stars and bars","Inclusion-exclusion and onto functions","Recurrences","Multinomial coefficients, Catalan numbers"]},{"topic":"Probability & Statistics","count":18,"papers":10,"first_year":"July 2018","last_year":"June 2025","trend":"steady","priority":"Must","why":"18 of 181 (10%); 10 of 15 papers (67%) with steady rate; Nov 2021 had a 5-question passage.","what_to_study":["Joint distribution table","Poisson P(0)=e^-lt","Conditional/union probability","Classical counting probability","Bayes theorem"]},{"topic":"Boolean Algebra, Lattices & Posets","count":12,"papers":9,"first_year":"July 2018","last_year":"June 2025","trend":"fading","priority":"High","why":"12 of 181 (7%); 9 of 15 papers; only 3 in the last 6 papers.","what_to_study":["Poset GLB/LUB, greatest/least","Boolean algebra facts and laws, duals","Counting Boolean functions 2^(2^n)","Sum of products form"]},{"topic":"Algebraic Structures (Groups, Rings)","count":11,"papers":9,"first_year":"December 2019","last_year":"June 2025","trend":"rising","priority":"High","why":"11 of 181 (6%); first appears Dec 2019 and 7 of 11 are in the last 6 papers.","what_to_study":["Group axioms and standard properties","Lagrange and order of elements","Homomorphism/automorphism","Semigroup and monoid facts"]},{"topic":"Number Theory & Number Systems","count":11,"papers":6,"first_year":"June 2019","last_year":"June 2025","trend":"steady","priority":"Medium","why":"11 of 181 (6%) but only 6 of 15 papers, bursty (June 2019 had 3).","what_to_study":["Euler phi, Fermat/Euler theorem","Modular exponentiation","Base conversion and unknown base equations"]},{"topic":"Numerical Methods & Misc Maths","count":2,"papers":1,"first_year":"June 2024 (Cancelled)","last_year":"June 2024 (Cancelled)","trend":"steady","priority":"Low","why":"2 of 181, both in one paper (June 2024 Cancelled).","what_to_study":["Bit-operation time estimate","Mathematical modelling steps order"]}],"clusters":[{"title":"Truth value of quantified statements over integers/reals","type":"same-concept-variant","topic":"Propositional & Predicate Logic","technique":"For each statement find a witness (for exists) or a counterexample (for forall) in the given universe. Quick tests: n=0, n=1, n=-1, n^2 vs n for 0<n<1 (not integers), and remember n+m=4 with n-m=1 needs n=2.5 (no integer solution).","what_changes":"The list of 4-5 statements A-E (n^2<m, n<m^2, nm=m, n^2+m^2=5 or 6, n+m=4 & n-m=1) and the universe (integers vs reals); the same statements reappear shuffled.","representative":"dec2023_q42","members":["dec2023_q42","june2024_cancelled_q22","dec2023_q56","dec2023_q57","dec2023_q41"],"skip_note":"Dec 2023 q42 and June 2024 q22 share almost identical statements; master the n^2/m pattern table and the rest follow.","id":"u1c1"},{"title":"Match propositional equivalences (implication, biconditional, negation, De Morgan)","type":"same-concept-variant","topic":"Propositional & Predicate Logic","technique":"Convert everything to the standard forms: p->q = ~p v q, p<->q = (p^q) v (~p^~q), ~(p->q)= p^~q, ~(p v q)=~p^~q, ~(p<->q)= ~p<->q. Match by elimination using one or two unambiguous pairs.","what_changes":"Which 4 equivalences are listed and the arrangement of the match options.","representative":"dec2024_q14","members":["dec2024_q14","june2019_q8","dec2023_q72"],"skip_note":"Same fixed set of identities each time; the rep covers every pair seen.","id":"u1c2"},{"title":"Converse, inverse, contrapositive, implication terminology match","type":"same-concept-variant","topic":"Propositional & Predicate Logic","technique":"p->q: converse q->p, inverse ~p->~q, contrapositive ~q->~p (equivalent to original). Equivalence is p<->q.","what_changes":"Sentences instead of symbols, or symbol forms; order of list items.","representative":"june2025_q28","members":["june2025_q28","dec2018_q2"],"skip_note":"Only four terms exist; the rep drills the word-form of the same mapping.","id":"u1c3"},{"title":"Which pairs are (not) logically equivalent / identify valid equivalence statements","type":"same-concept-variant","topic":"Propositional & Predicate Logic","technique":"Use contrapositive, De Morgan, distribution of implication: (p->r)^(q->r) = (p v q)->r while (p^q)->r = (p->r) v (q->r). Test suspicious options with a 2-3 row truth table.","what_changes":"Particular formulas; the trap is distributing implication over wrong connective; 'NOT equivalent' vs 'equivalent' stem.","representative":"nov2020_q3","members":["nov2020_q3","dec2022_q1","nov2021_q21","sep2022_q71","june2024_reexam_q47"],"skip_note":"Same traps (wrong distribution, converse vs contrapositive) recur; nov2020_q3 + nov2021_q21 cover them.","id":"u1c4"},{"title":"Identify tautologies among given formulas","type":"same-concept-variant","topic":"Propositional & Predicate Logic","technique":"Assume the formula is false and try to force a contradiction (false conclusion, true premise); or check the single falsifying assignment for each.","what_changes":"Formulas in 3 variables, 4-5 per question, multi-select options.","representative":"june2024_cancelled_q67","members":["june2024_cancelled_q67","dec2023_q46"],"skip_note":"Both use the make-it-false method; one rep suffices.","id":"u1c5"},{"title":"Translate English sentences to propositional logic","type":"same-concept-variant","topic":"Propositional & Predicate Logic","technique":"Map: 'neither P nor Q' = ~P ^ ~Q; 'if P then Q' = P->Q; 'necessary for P is Q' = P->Q (P implies Q); 'sufficient' = antecedent; 'only if' = consequent.","what_changes":"Sentences and the P/Q meanings; necessary/sufficient/neither phrasing.","representative":"june2025_q34","members":["june2025_q34","nov2020_q61","june2024_reexam_q24"],"skip_note":"Same phrase-to-connective table; rep includes necessary/sufficient wording.","id":"u1c6"},{"title":"Quantifier translation (English <-> predicate logic)","type":"same-concept-variant","topic":"Propositional & Predicate Logic","technique":"'Some A are not B' = exists x (A ^ ~B); 'all A are B' = forall x (A -> B); 'X is loved by everyone' = forall x L(x,X). For forall x exists y (x<y): for every x there is a larger y.","what_changes":"Direction of translation (to symbols or to English) and predicate names.","representative":"june2024_reexam_q61","members":["june2024_reexam_q61","june2024_reexam_q87","nov2020_q37"],"skip_note":"Argument order and exists-with-AND / forall-with-implies are the only traps; one rep is enough.","id":"u1c7"},{"title":"Negation of quantified statements","type":"exact-repeat","topic":"Propositional & Predicate Logic","technique":"~exists x Q = forall x ~Q; ~forall x Q = exists x ~Q. 'Some students like hockey' negates to 'every student dislikes hockey'.","what_changes":"Predicate and sentence wording only.","representative":"dec2022_shiftii_q1","members":["dec2022_shiftii_q1","july2018_q85"],"skip_note":"Single rule, asked twice with different wording.","id":"u1c8"},{"title":"Check reflexive/symmetric/antisymmetric/transitive properties of a given relation","type":"same-concept-variant","topic":"Sets, Relations & Functions","technique":"Test reflexive (all (a,a) present), symmetric (every (a,b) has (b,a)), antisymmetric (no a!=b both ways), transitive (check chains). Eliminate options with one failing property. For infinite relations find a counterexample.","what_changes":"The relation (pair list, formula like xv=yu, x<u & y>v, |x-y|<eps, brother-of) and which properties are asked.","representative":"dec2023_q43","members":["dec2023_q43","dec2022_q43","dec2022_shiftii_q2","dec2019_q5","nov2020_q39","sep2022_q74","june2024_reexam_q7"],"skip_note":"All use the same four definitions; do dec2023_q43 + dec2022_q43 and watch for |x-y|<eps (not transitive) and brother-of (not symmetric).","id":"u1c9"},{"title":"Identify/prove an equivalence relation","type":"same-concept-variant","topic":"Sets, Relations & Functions","technique":"Check reflexive, symmetric, transitive. Equal-mod-k or 'same value of a function' type relations are equivalences; 'f(0)=g(0) or f(1)=g(1)' fails transitivity.","what_changes":"Domain (finite set, functions Z->Z, N x N) and the defining rule.","representative":"june2023_q33","members":["june2023_q33","july2018_q88","july2018_q89"],"skip_note":"Same three-property test; the rep is the hardest algebraic version.","id":"u1c10"},{"title":"Inclusion-exclusion counting with 2 or 3 sets","type":"same-formula","topic":"Sets, Relations & Functions","technique":"|AuB|=|A|+|B|-|AnB|; |AuBuC|=sum singles - sum pairs + triple. Neither = total - union.","what_changes":"Story (languages, survey, food) and numbers.","representative":"june2025_q35","members":["june2025_q35","dec2018_q4","june2024_reexam_q79"],"skip_note":"Same formula with new numbers.","id":"u1c11"},{"title":"Empty-set and nested-set membership/subset","type":"same-concept-variant","topic":"Sets, Relations & Functions","technique":"Distinguish phi (no elements) from {phi} (one element). x in S needs x listed as an element; x subset S needs all elements of x in S.","what_changes":"Which of A-E statements are asked or the match items.","representative":"dec2024_q89","members":["dec2024_q89","dec2023_q66"],"skip_note":"Same phi vs {phi} trap.","id":"u1c12"},{"title":"Set algebra identity / operation matching","type":"same-concept-variant","topic":"Sets, Relations & Functions","technique":"A-B = A n B^c; symmetric difference = (A-B)u(B-A); A-(BuC)=(A-B)n(A-C); A-(BnC)=(A-B)u(A-C); A n (B-C)=(AnB)-(AnC). Verify with a Venn or small example.","what_changes":"Which identities are listed.","representative":"june2023_q76","members":["june2023_q76","nov2020_q64"],"skip_note":"Same identity table; the rep has all of them.","id":"u1c13"},{"title":"Poset GLB/LUB and greatest/least element under divisibility","type":"same-concept-variant","topic":"Boolean Algebra, Lattices & Posets","technique":"In (Z+, |): GLB = gcd, LUB = lcm of the set. Greatest element exists only if one element is divisible by all others (and least if one divides all).","what_changes":"The sets and whether asked for bounds or greatest/least elements.","representative":"dec2019_q4","members":["dec2019_q4","june2019_q1"],"skip_note":"Both reduce to gcd/lcm and divisibility check.","id":"u1c14"},{"title":"Boolean algebra statement-check (atoms, complement, direct product, NAND/NOR)","type":"same-concept-variant","topic":"Boolean Algebra, Lattices & Posets","technique":"A finite Boolean algebra has 2^n elements (no 5-element one); complements are unique; direct product of Boolean algebras is a Boolean algebra; any network can be built from NAND or NOR alone; two Boolean algebras with the same number of atoms are isomorphic.","what_changes":"The 4 statements chosen.","representative":"dec2022_shiftii_q42","members":["dec2022_shiftii_q42","dec2018_q5"],"skip_note":"Same fact bank; learn the facts once.","id":"u1c15"},{"title":"Boolean laws and dual expressions matching","type":"same-concept-variant","topic":"Boolean Algebra, Lattices & Posets","technique":"Dual: swap + with ., 0 with 1 (leave literals). Laws: absorption a+ab=a, bound a+1=1, identity a+0=a, distributive.","what_changes":"Expressions in the list.","representative":"dec2024_q79","members":["dec2024_q79","june2024_cancelled_q42"],"skip_note":"Pure recall of the law names and dual rule.","id":"u1c16"},{"title":"Pigeonhole principle (minimum number to guarantee)","type":"same-formula","topic":"Combinatorics & Recurrences","technique":"Worst case: fill every box to r-1, then add one: N = k(r-1)+1. For 'at least three hearts' count all non-hearts (39) + 2 hearts, plus 1 = 42.","what_changes":"Context (grades, bins, cards) and r.","representative":"dec2022_q4","members":["dec2022_q4","nov2021_q24","june2019_q7"],"skip_note":"Same worst-case-plus-one formula; the card version is the only twist.","id":"u1c17"},{"title":"Stars and bars: integral solutions / balls into bins","type":"same-formula","topic":"Combinatorics & Recurrences","technique":"Non-negative solutions of x1+..+xk = n: C(n+k-1, k-1). With lower bounds subtract them from n first (29-1-2-3=23, C(26,3)=2600).","what_changes":"n, k, lower bounds, or balls in distinguishable bins.","representative":"june2023_q50","members":["june2023_q50","june2019_q2"],"skip_note":"Same formula.","id":"u1c18"},{"title":"Onto functions / distributing distinct objects with every box non-empty","type":"same-formula","topic":"Combinatorics & Recurrences","technique":"Onto count = sum_{i=0}^{k} (-1)^i C(k,i)(k-i)^n (= k! S(n,k)). 5 jobs on 4 people = 240; 7 people on 3 floors = 3^7-3*2^7+3 = 1806.","what_changes":"Numbers n and k and the story.","representative":"dec2022_q2","members":["dec2022_q2","nov2021_q23"],"skip_note":"Same inclusion-exclusion formula.","id":"u1c19"},{"title":"Inclusion-exclusion in counting (bit strings, integers up to N)","type":"same-concept-variant","topic":"Combinatorics & Recurrences","technique":"|A u B| = |A|+|B|-|A n B|. Bit strings starting with 1 (2^9), ending 00 (2^8), both (2^7): 640. Odd or perfect square up to 100: 50 odd + 5 even squares (4,16,36,64,100) = 55.","what_changes":"Condition pair and range.","representative":"june2019_q3","members":["june2019_q3","nov2020_q1"],"skip_note":"Same overlap-subtraction method.","id":"u1c20"},{"title":"Recurrence relations: set up and solve","type":"same-concept-variant","topic":"Combinatorics & Recurrences","technique":"Linear homogeneous: characteristic equation; repeated root r gives (a+bn)r^n (r^2-8r+16 => 4^n and n4^n). Divide and conquer f(n)=a f(n/2)+c: unroll with n=2^K. Stairs: f(n)=f(n-1)+f(n-2), Fibonacci.","what_changes":"Recurrence coefficients and base case.","representative":"june2024_cancelled_q26","members":["june2024_cancelled_q26","june2024_cancelled_q10","nov2021_q25"],"skip_note":"Three recurrence types; do all three once because they differ in method.","id":"u1c21"},{"title":"Multiplication rule counting (labels, ordered selections)","type":"same-concept-variant","topic":"Combinatorics & Recurrences","technique":"Product rule; ordered selection without replacement is nPr: 42*41*40 = 68880. Labels: 26 letters x 99 positive two-digit numbers = 2574.","what_changes":"Counts and replacement condition.","representative":"june2025_q1","members":["june2025_q1","june2024_cancelled_q49"],"skip_note":"Basic rule application.","id":"u1c22"},{"title":"Handshaking lemma","type":"same-formula","topic":"Graph Theory","technique":"Sum of degrees = 2|E|; number of odd-degree vertices is even.","what_changes":"Asked as statements or as 'sum of degrees equals?'","representative":"nov2021_q46","members":["nov2021_q46","june2024_reexam_q78"],"skip_note":"One fact.","id":"u1c23"},{"title":"Planarity of drawn graphs","type":"same-concept-variant","topic":"Graph Theory","technique":"Look for a K5 or K3,3 subdivision (Kuratowski); otherwise redraw without crossings. Check E<=3V-6 as a quick necessary test.","what_changes":"The figures; format is identical image-based.","representative":"dec2024_q69","members":["dec2024_q69","nov2021_q27"],"skip_note":"Figure-based; solve dec2024 to learn the method.","id":"u1c24"},{"title":"Graph colouring and bipartite equivalence","type":"same-concept-variant","topic":"Graph Theory","technique":"Bipartite = 2-colourable = no odd cycles; trees are 2-colourable; max degree d needs at most d+1 colours; planar graphs are 4-colourable.","what_changes":"Which statements are listed as correct/incorrect.","representative":"nov2020_q53","members":["nov2020_q53","dec2018_q28"],"skip_note":"Same equivalence set.","id":"u1c25"},{"title":"Hamiltonian sufficient conditions (Dirac/Ore)","type":"same-concept-variant","topic":"Graph Theory","technique":"Dirac: n>=3 and deg(v)>=n/2 for all v => Hamiltonian. Ore: deg(v)+deg(w)>=n for each non-adjacent pair. Ore's condition is the sum, not the n/3 trap.","what_changes":"Statement form vs fill-in-the-blank.","representative":"june2024_reexam_q34","members":["june2024_reexam_q34","dec2018_q20"],"skip_note":"Same theorem.","id":"u1c26"},{"title":"Number of spanning trees of small graphs","type":"same-concept-variant","topic":"Graph Theory","technique":"Cayley: K_n has n^(n-2); cycle C_n has n; K2,2=C4 has 4; otherwise Kirchhoff or deletion-contraction (tau(G)=tau(G-e)+tau(G/e)).","what_changes":"The graphs compared or counted.","representative":"june2024_cancelled_q38","members":["june2024_cancelled_q38","dec2022_shiftii_q28"],"skip_note":"Same counting tools.","id":"u1c27"},{"title":"Trees and forests: vertex/edge counts","type":"same-formula","topic":"Graph Theory","technique":"Tree: E=V-1. Forest with k components: E=V-k, so minimum edges of a graph with k components is n-k. Use sum of degrees = 2E to find unknown n.","what_changes":"Degree sequence or number of vertices/edges.","representative":"dec2019_q7","members":["dec2019_q7","dec2022_q76","dec2022_shiftii_q41"],"skip_note":"Edge-count identities only.","id":"u1c28"},{"title":"Standard graph family properties (edges, regularity)","type":"same-concept-variant","topic":"Graph Theory","technique":"K_n: n(n-1)/2 edges; C_n: n; W_n (n vertices): 2(n-1), regular only for W4=K4; K_{n,n}: n^2; Q_n: n*2^(n-1).","what_changes":"Which families are compared.","representative":"dec2024_q58","members":["dec2024_q58","nov2021_q26"],"skip_note":"Same table.","id":"u1c29"},{"title":"Formulate the LP from the passage: objective","type":"same-concept-variant","topic":"Linear Programming & Optimization","technique":"Objective coefficient = cost/profit per unit of each product times variable (12x+20y for diet; 30x+50y for cloth).","what_changes":"Passage numbers.","representative":"june2024_cancelled_q92","members":["june2024_cancelled_q92","dec2023_q91"],"skip_note":"Same step across two passages.","id":"u1c30"},{"title":"Formulate the LP from the passage: constraints","type":"same-concept-variant","topic":"Linear Programming & Optimization","technique":"One constraint per resource/nutrient; coefficient matrix columns are products. Diet = '>=' constraints, production = '<=' constraints.","what_changes":"Passage values and direction of inequalities.","representative":"june2024_cancelled_q94","members":["june2024_cancelled_q94","dec2023_q92"],"skip_note":"Same step.","id":"u1c31"},{"title":"Write the dual of the passage LP","type":"same-concept-variant","topic":"Linear Programming & Optimization","technique":"Primal min with >= constraints => dual max with <= constraints, RHS of dual = primal costs, dual objective uses primal RHS, A is transposed.","what_changes":"Primal data.","representative":"june2024_cancelled_q91","members":["june2024_cancelled_q91","dec2023_q94"],"skip_note":"Same transposition recipe.","id":"u1c32"},{"title":"Evaluate the passage LP at corner points (optimum value/solution)","type":"same-concept-variant","topic":"Linear Programming & Optimization","technique":"Compute intersection points of constraints, evaluate objective at feasible vertices, choose max/min.","what_changes":"Which corner/value is asked.","representative":"june2024_cancelled_q95","members":["june2024_cancelled_q95","june2024_cancelled_q93","dec2023_q93","dec2023_q95"],"skip_note":"Same corner point routine.","id":"u1c33"},{"title":"Graphical LP solution","type":"same-concept-variant","topic":"Linear Programming & Optimization","technique":"Plot constraints, list feasible vertices and evaluate objective. For feasibility questions substitute each point into all constraints.","what_changes":"Objective and constraint data.","representative":"nov2021_q30","members":["nov2021_q30","nov2020_q4","dec2019_q2","dec2024_q62"],"skip_note":"Same corner-point evaluation.","id":"u1c34"},{"title":"Simplex / dual simplex iterations","type":"same-concept-variant","topic":"Linear Programming & Optimization","technique":"Entering variable: largest positive Cj-Zj (max). Leaving: min ratio. Dual simplex: leaving row = most negative RHS.","what_changes":"Problem data.","representative":"june2019_q10","members":["june2019_q10","dec2018_q9"],"skip_note":"Both reduce to one tableau pivot.","id":"u1c35"},{"title":"LP duality theorems and rules","type":"same-concept-variant","topic":"Linear Programming & Optimization","technique":"Equality constraint in max primal => unrestricted dual variable; weak/strong duality; optimal tableau gives dual solution.","what_changes":"Statement set.","representative":"dec2019_q67","members":["dec2019_q67","sep2022_q10"],"skip_note":"Same duality rules.","id":"u1c36"},{"title":"Group theory statement-check","type":"same-concept-variant","topic":"Algebraic Structures (Groups, Rings)","technique":"Facts: identity and inverse unique; element order divides |G|; even-order group has element of order 2; (xy)^2=x^2y^2 for all x,y implies abelian but x^3=1 does not; finite closed subset is a subgroup; group has at least one element.","what_changes":"Which of A-D statements are listed.","representative":"dec2022_q41","members":["dec2022_q41","dec2023_q86","dec2019_q66","june2025_q53","june2023_q82"],"skip_note":"Same fact bank across papers.","id":"u1c37"},{"title":"Semigroup property reasoning","type":"same-concept-variant","topic":"Algebraic Structures (Groups, Rings)","technique":"Use the given hypothesis to force identities; two-element semigroup with a*a=b: b*b=b.","what_changes":"Hypothesis.","representative":"sep2022_q72","members":["sep2022_q72","nov2021_q29"],"skip_note":"Same style.","id":"u1c38"},{"title":"Homomorphism and automorphism of integer/real groups","type":"same-concept-variant","topic":"Algebraic Structures (Groups, Rings)","technique":"Kernel decides injectivity; image decides surjectivity; Aut(Z,+)={x->x, x->-x}.","what_changes":"Map and groups.","representative":"june2023_q4","members":["june2023_q4","june2023_q67"],"skip_note":"Both use kernel/image.","id":"u1c39"},{"title":"Unknown-base arithmetic equation","type":"same-concept-variant","topic":"Number Theory & Number Systems","technique":"Expand each number in its base as polynomial in b, set equal, solve and check digit validity.","what_changes":"Numbers in equation.","representative":"dec2019_q12","members":["dec2019_q12","june2019_q18"],"skip_note":"Same method.","id":"u1c40"},{"title":"Radix and valid digit questions","type":"same-concept-variant","topic":"Number Theory & Number Systems","technique":"Digits must be smaller than base; for a quadratic with roots in base b, use sum/product of roots.","what_changes":"Given polynomial or digits.","representative":"nov2020_q8","members":["nov2020_q8","june2024_reexam_q11"],"skip_note":"Same digit rules.","id":"u1c41"},{"title":"Euler/Fermat/modular computation","type":"same-concept-variant","topic":"Number Theory & Number Systems","technique":"phi(n)=n*prod(1-1/p); a^phi(n) = 1 mod n; Fermat a^(p-1)=1 mod p (not a^p=1); repeated squaring.","what_changes":"Modulus and base.","representative":"dec2023_q76","members":["dec2023_q76","june2019_q70","dec2019_q35","june2019_q63","nov2020_q80"],"skip_note":"Same toolbox.","id":"u1c42"},{"title":"Poisson probability of zero arrivals","type":"same-formula","topic":"Probability & Statistics","technique":"P(0)=e^(-lambda t); convert rate to the time window (30/hr for 40 min => 20).","what_changes":"Rate and window.","representative":"june2023_q57","members":["june2023_q57","july2018_q53"],"skip_note":"Identical question with new numbers.","id":"u1c43"},{"title":"Full joint distribution table: marginal/conditional/union","type":"same-concept-variant","topic":"Probability & Statistics","technique":"Add matching cells for marginals; P(A|B)=P(A and B)/P(B); P(A or B)=P(A)+P(B)-P(A and B).","what_changes":"Event asked from the same 8-cell table.","representative":"nov2021_q60","members":["nov2021_q60","nov2021_q56","nov2021_q57","nov2021_q58","nov2021_q59","dec2018_q100"],"skip_note":"Same table method; nov2021_q60 includes all steps.","id":"u1c44"},{"title":"Probability of numbers divisible by 2 or 5","type":"exact-repeat","topic":"Probability & Statistics","technique":"Inclusion-exclusion: 1/2+1/5-1/10 = 3/5.","what_changes":"Range only.","representative":"june2025_q27","members":["june2025_q27","dec2023_q1"],"skip_note":"Same answer for any range multiple of 10.","id":"u1c45"},{"title":"Elementary probability with balls/coins","type":"same-concept-variant","topic":"Probability & Statistics","technique":"Favourable/total with combinations: C(6,2)C(4,2)/C(10,4)=3/7.","what_changes":"Context.","representative":"dec2018_q3","members":["dec2018_q3","june2024_reexam_q45","june2024_reexam_q72"],"skip_note":"Same combinations approach.","id":"u1c46"}],"singletons":55,"mindset":["Favourite format is the multi-select 'which of A-E are true' or Match-the-list: about a third of the unit uses these, so you must know every statement of a fact bank, not just one.","Recent papers re-use statement sets almost verbatim: Dec 2023 q42 and June 2024 (Cancelled) q22 share the same quantifier statements; Nov 2021 q27 and Dec 2024 q69 are the same planarity task; Dec 2023 q1 and June 2025 q27 differ only in the range (100 vs 200).","Passage blocks of five questions recur: Nov 2021 q56-60 (joint probability), Dec 2023 q91-95 (diet LP) and June 2024 Cancelled q91-95 (cloth LP). Each LP passage follows the same sequence: objective, constraints, dual, corner points, optimum.","Logic is the biggest topic (34 of 181) and almost always from the same toolbox: equivalences, quantifier truth in integers, negation, translation. Truth tables are not asked directly.","Typical distractors: converse vs contrapositive, distributing implication over AND/OR wrongly, Fermat's a^p=1 instead of a^(p-1)=1, Dirac's n/2 replaced by n/3, empty set vs {empty set}, an equivalence relation missing one property.","Difficulty is mostly easy-to-moderate recall; heavy computations (simplex tableaux, dual simplex) are rare and mostly in 2018-2019. After 2022 the examiner prefers conceptual statement checking and ordering/matching items.","Number reuse: Poisson with 20-30 requests per hour, 2-or-5 divisibility, unknown base with (b-2), and the regular wheel graph show up repeatedly with changed numbers.","Cross-unit overlap: PERT/CPM, Poisson and Bayes overlap with OR and probability topics; Boolean algebra overlaps with digital logic; trees overlap with data structures; recurrences overlap with algorithm analysis.","He never asks lengthy proofs, rings/fields in depth, calculus or matrices here; numerical methods appear only twice (June 2024 Cancelled) and the algebra part is limited to groups and semigroups.","Graph theory frequency has dropped since 2023 (6 questions in the last 6 papers vs 15 in the first 9) while LP and algebraic structures are rising."],"formulas":[{"name":"Conditional equivalences","formula":"p->q = ~p v q = ~q->~p; ~(p->q) = p ^ ~q","used_in":["dec2022_q1","june2019_q8","dec2024_q14","nov2021_q21"],"note":"Converse and inverse are NOT equivalent to p->q."},{"name":"Biconditional","formula":"p<->q = (p->q)^(q->p) = (p^q) v (~p^~q); ~(p<->q) = ~p<->q","used_in":["dec2024_q14","nov2020_q3"],"note":"Negation moves to one side only."},{"name":"De Morgan / quantifier negation","formula":"~(p^q)=~p v ~q; ~exists x P = forall x ~P; ~forall x P = exists x ~P","used_in":["july2018_q85","dec2022_shiftii_q1","june2024_reexam_q47"],"note":"Quantifier flips when negating."},{"name":"Implication distribution","formula":"(p->r)^(q->r) = (p v q)->r ; (p^q)->r = (p->r) v (q->r)","used_in":["nov2020_q3"],"note":"(p^q)->r is not equal to (p->r)^(q->r)."},{"name":"Quantifier non-equivalences","formula":"forall x(P v Q) != forall x P v forall x Q ; exists x(P^Q) != exists x P ^ exists x Q","used_in":["dec2019_q59","nov2020_q40"],"note":"Forall distributes over AND, exists over OR only."},{"name":"Reflexive relations count","formula":"2^(n^2-n) on n elements (4 elements: 2^12)","used_in":["dec2019_q8"],"note":"Symmetric relations: 2^(n(n+1)/2)."},{"name":"Inclusion-exclusion","formula":"|AuBuC| = |A|+|B|+|C|-|AnB|-|AnC|-|BnC|+|AnBnC|","used_in":["june2025_q35","dec2018_q4","june2024_reexam_q79","june2019_q3"],"note":"'Neither' = total - union."},{"name":"Pigeonhole","formula":"min objects to guarantee r in one box with k boxes: k(r-1)+1","used_in":["dec2022_q4","nov2021_q24","june2019_q7"],"note":"For cards use the worst case of all other suits."},{"name":"Stars and bars","formula":"non-negative solutions of x1+..+xk=n : C(n+k-1,k-1)","used_in":["june2019_q2","june2023_q50"],"note":"Subtract lower bounds first."},{"name":"Onto functions","formula":"onto(n->k) = sum_i (-1)^i C(k,i)(k-i)^n","used_in":["nov2021_q23","dec2022_q2"],"note":"5 to 4 = 240; 7 to 3 = 1806."},{"name":"Multinomial coefficient","formula":"coefficient of x^a y^b z^c in (x+y+z)^n = n!/(a!b!c!)","used_in":["dec2022_q3"],"note":"7!/(2!3!2!) = C(7,2)C(5,3)."},{"name":"Linear recurrence solution","formula":"repeated root r: a_n=(A+Bn)r^n; f(n)=a f(n/2)+c solved with n=2^K","used_in":["june2024_cancelled_q26","june2024_cancelled_q10","nov2021_q25"],"note":"Stairs: Fibonacci f(1)=1, f(2)=2."},{"name":"Catalan numbers","formula":"binary trees / BSTs with n nodes = (2n)!/((n+1)!n!)","used_in":["dec2022_q42"],"note":"Labelled binary trees multiply by n!."},{"name":"Handshake lemma","formula":"sum of degrees = 2|E|; number of odd-degree vertices is even","used_in":["nov2021_q46","june2024_reexam_q78","dec2019_q7"],"note":"Used to find unknown vertex count."},{"name":"Tree and forest edges","formula":"tree: E=V-1; forest with k components: E=V-k","used_in":["dec2019_q7","dec2022_q76","dec2022_shiftii_q41"],"note":"Min edges with k components = n-k."},{"name":"Euler's planar formula","formula":"V-E+F=2 (connected planar); E<=3V-6","used_in":["june2019_q4","nov2021_q27","dec2024_q69"],"note":"6 vertices of degree 4: E=12, F=8."},{"name":"Cayley spanning trees","formula":"tau(K_n)=n^(n-2); tau(C_n)=n","used_in":["june2024_cancelled_q38","dec2022_shiftii_q28"],"note":"K2,2=C4 has 4."},{"name":"Hamiltonian conditions","formula":"Dirac: deg(v)>=n/2; Ore: deg(u)+deg(v)>=n for non-adjacent u,v; K(m,n) Hamiltonian iff m=n>=2","used_in":["dec2018_q20","june2024_reexam_q34","june2019_q5"],"note":"Conditions are sufficient, not necessary."},{"name":"Colouring facts","formula":"bipartite iff 2-colourable iff no odd cycle; planar => 4-colourable; chi<=Delta+1","used_in":["nov2020_q53","dec2018_q28","dec2022_shiftii_q66"],"note":"Bipartite has no ODD cycles."},{"name":"Edge counts of graph families","formula":"K_n: n(n-1)/2; C_n: n; W_n (n vertices): 2(n-1); K_{n,n}: n^2; Q_n: n*2^(n-1)","used_in":["dec2024_q58","nov2021_q26"],"note":"W4 = K4 is the regular wheel."},{"name":"Boolean algebra counts","formula":"Boolean functions of n variables: 2^(2^n); finite Boolean algebra has 2^n elements","used_in":["june2019_q13","dec2022_shiftii_q42"],"note":"No Boolean algebra with 5 elements."},{"name":"Poset under divisibility","formula":"GLB = gcd, LUB = lcm","used_in":["dec2019_q4","june2019_q1"],"note":"Greatest element requires everything dividing it."},{"name":"Dual of Boolean expression","formula":"swap + and ., swap 0 and 1; absorption a+ab=a","used_in":["june2024_cancelled_q42","dec2024_q79"],"note":"Do not complement literals."},{"name":"Poisson","formula":"P(X=0)=e^(-lambda t); P(X=k)=e^(-lt)(lt)^k/k!","used_in":["july2018_q53","june2023_q57"],"note":"Convert the rate to the same time unit."},{"name":"Conditional and union probability","formula":"P(A|B)=P(AnB)/P(B); P(AuB)=P(A)+P(B)-P(AnB); independent: 1-(1-a)(1-b)","used_in":["nov2021_q56","nov2021_q60","dec2024_q22","dec2018_q100"],"note":"Divisible by 2 or 5: 1/2+1/5-1/10=3/5."},{"name":"Total 5-card hands","formula":"C(52,5)=2,598,960","used_in":["july2018_q80"],"note":"Atomic events in the joint distribution."},{"name":"Euler phi and theorems","formula":"phi(n)=n prod(1-1/p); a^phi(n)=1 mod n (gcd=1); a^(p-1)=1 mod p; phi(45)=24","used_in":["june2019_q63","june2019_q70","dec2023_q76","nov2020_q80"],"note":"a^p = a mod p, not 1."},{"name":"Group facts","formula":"order of a divides |G|; even order => element of order 2; (xy)^-1=y^-1x^-1; Aut(Z,+) has 2 elements; x^2=e for all x => abelian","used_in":["dec2019_q66","june2025_q53","dec2024_q40","june2023_q4"],"note":"x^3=1 for all x does not force commutativity."},{"name":"LP duality rules","formula":"max primal <= constraints => dual min >= with y>=0; equality constraint => unrestricted dual variable; BFS in transportation has m+n-1 allocations","used_in":["sep2022_q10","dec2019_q1","dec2023_q94","june2024_cancelled_q91"],"note":"Dual objective uses primal RHS."},{"name":"Place-value/base","formula":"(d_k...d_0)_b = sum d_i b^i ; digits < b ; roots 4 and 7 of x^2-10x+26 means 4+7=11=10 in base b, so b=11","used_in":["june2019_q18","dec2019_q12","nov2020_q8","june2024_reexam_q11"],"note":"Check that digits fit the base."}],"plan":[{"step":1,"focus":"Logic fact banks","topics":["Propositional & Predicate Logic"],"hours":3.0,"do":"Memorise equivalence table; solve cluster reps dec2023_q42, dec2024_q14, nov2020_q3, june2025_q34, june2024_reexam_q61, dec2022_shiftii_q1 and singletons nov2020_q40, june2019_q6, dec2022_shiftii_q86."},{"step":2,"focus":"Sets and relations","topics":["Sets, Relations & Functions"],"hours":2.5,"do":"Solve reps dec2023_q43, june2023_q33, june2025_q35 and singletons june2019_q9, dec2019_q8, nov2021_q22, july2018_q87."},{"step":3,"focus":"LP passages and graphical","topics":["Linear Programming & Optimization"],"hours":3.0,"do":"Solve the passage reps (june2024_cancelled_q91/92/94/95) and CISC","type":"same-concept-variant","topic":"CPU Organization, Instruction Formats & Addressing","technique":"RISC: load/store only memory access, fixed-length, single-cycle, pipelining friendly, hardwired. CISC: many addressing modes, variable length, microprogrammed.","what_changes":"Statement pair vs choose-characteristics format.","representative":"nov2021_q89","members":["nov2021_q89","dec2019_q68"],"skip_note":"Same RISC/CISC feature list."},{"id":"u2c6","title":"Addressing modes facts and effective address","type":"same-concept-variant","topic":"CPU Organization, Instruction Formats & Addressing","technique":"Immediate: operand in instruction; direct: EA=address field; indirect: EA=M[address] (2 memory refs); register: 0 memory refs; indexed: EA=address+XR; register indirect: EA=R. Fastest = register/immediate.","what_changes":"Conceptual statement vs numeric EA computation.","representative":"dec2019_q86","members":["dec2019_q86","june2019_q11","june2024_cancelled_q11","dec2018_q13","nov2020_q81","nov2021_q90"],"skip_note":"One table of modes with EA formulas answers all six."},{"id":"u2c7","title":"8085 instruction set and addressing","type":"same-concept-variant","topic":"CPU Organization, Instruction Formats & Addressing","technique":"Memorise 8085 categories: DAA arithmetic; LXI, MVI, MOV data transfer; JMP branch/program control; RST interrupt. Addressing: STA/LDA direct, MOV A,M register indirect, MOV A,B register, MVI immediate.","what_changes":"Match-the-list vs short program trace.","representative":"dec2022_q67","members":["dec2022_q67","dec2022_shiftii_q67","july2018_q100"],"skip_note":"Same 8085 mnemonic-to-category mapping."},{"id":"u2c8","title":"Memory capacity, address lines and chip count","type":"same-formula","topic":"Cache & Memory Hierarchy","technique":"Capacity = 2^(address lines) x data lines. Address lines = log2(words). Chips = total bits / chip bits; byte-addressable vs word-addressable changes address bits.","what_changes":"Memory ],"skip_note":"Identical statements in two shifts."},{"id":"u2c13","title":"Memory types and technology facts","type":"same-concept-variant","topic":"Cache & Memory Hierarchy","technique":"DRAM: slower, denser, cheaper, needs refresh; SRAM: faster, used for cache. CMOS chip on motherboard = ROM per the answer key; main memory = RAM+ROM; CAM = content search in parallel; access time definition.","what_changes":"Definition/true-false.","representative":"dec2022_shiftii_q44","members":["dec2022_shiftii_q44","dec2023_q45","july2018_q91","june2019_q12","dec2023_q29"],"skip_note":"All are one-line factual recalls from the same memory-type notes."},{"id":"u2c14","title":"Cache coherence and write policies","type":"same-concept-variant","topic":"Cache & Memory Hierarchy","technique":"Write-through updates cache and memory; write-back updates cache only (dirty bit). Coherence solved by snoopy controllers or by not caching shared data.","what_changes":"Statement-combination options.","representative":"june2025_q79","members":["june2025_q79","nov2021_q88"],"skip_note":"Same coherence/write-policy concepts."},{"id":"u2c15","title":"Cache terminology and mapping","type":"same-concept-variant","topic":"Cache & Memory Hierarchy","technique":"Mappings: direct, associative, set-associative. Dirty bit = block modified after loading. Hit ratio is the key performance metric. Mapping = transforming main-memory blocks to cache lines.","what_changes":"Definition recall.","representative":"july2018_q98","members":["july2018_q98","june2025_q6","dec2018_q71","dec2024_q12"],"skip_note":"One-line definitions from the cache chapter."},{"id":"u2c16","title":"K-map simplification","type":"same-concept-variant","topic":"Digital Logic & K-Maps","technique":"Plot minterms, group 1s in powers of 2 (largest groups, wrap-around), treat don't cares as 1 only if they enlarge a group, write each group as product of unchanged variables. Alternatively test each option by plugging minterms.","what_changes":"3 or 4 variables, with/without don't cares, or steps order.","representative":"dec2022_q6","members":["dec2022_q6","nov2020_q42","july2018_q99","dec2024_q20","june2024_cancelled_q34","dec2022_shiftii_q7","june2024_reexam_q46"],"skip_note":"Same grouping skill; do one 4-var with don't cares and one 3-var."},{"id":"u2c17","title":"Boolean simplification and identities","type":"same-concept-variant","topic":"Digital Logic & K-Maps","technique":"Apply absorption (x+xy=x), idempotent, domination, complement laws and XOR identities (A xor 1 = A', A xor 0 = A, A xor A = 0). Sum of A'B+AB'+AB = A+B.","what_changes":"Expression to simplify or identity to verify.","representative":"dec2018_q7","members":["dec2018_q7","dec2019_q3","june2023_q35","dec2018_q11","nov2021_q28"],"skip_note":"Same algebra toolkit."},{"id":"u2c18","title":"Complement of Boolean function","type":"same-concept-variant","topic":"Digital Logic & K-Maps","technique":"De Morgan: complement = swap AND/OR and complement each literal (dual and complement variables).","what_changes":"Expression form of options.","representative":"dec2024_q59","members":["dec2024_q59","dec2022_q44"],"skip_note":"Same De Morgan application."},{"id":"u2c19","title":"Logic gate properties","type":"same-concept-variant","topic":"Digital Logic & K-Maps","technique":"NAND/NOR universal; XOR odd function (1 when odd number of 1s); XNOR output 1 for equal inputs; with inputs 00 NAND=1,NOR=1,XNOR=1,XOR=0. 2421 and excess-3 are self-complementing; buffer = amplification.","what_changes":"Match-list or option-based gate truth tables.","representative":"june2025_q51","members":["june2025_q51","nov2021_q81"],"skip_note":"Same gate truth-table facts."},{"id":"u2c20","title":"Decoder, encoder and multiplexer functions","type":"same-concept-variant","topic":"Combinational Circuits","technique":"Decoder n -> 2^n; encoder 2^n -> n (priority encoder resolves multiple inputs); mux 2^n -> 1; demux 1 -> 2^n. Half adder = 2-bit addition.","what_changes":"Match-list or identify circuit from equations.","representative":"july2018_q93","members":["july2018_q93","sep2022_q7","june2024_reexam_q38"],"skip_note":"Same I/O line-count facts."},{"id":"u2c21","title":"Combinational versus sequential circuits","type":"same-concept-variant","topic":"Sequential Circuits & Flip-Flops","technique":"Combinational: output depends on present input only, no memory, no feedback, no clock. Sequential: has memory/feedback, clocked. FF, counter, register sequential; mux, decoder, adder combinational.","what_changes":"Statement choice or classification.","representative":"june2024_reexam_q40","members":["june2024_reexam_q40","june2024_cancelled_q86","nov2021_q87"],"skip_note":"Same classification rule."},{"id":"u2c22","title":"Counters","type":"same-concept-variant","topic":"Sequential Circuits & Flip-Flops","technique":"Cascaded counters: states multiply (MOD-2 x MOD-5 = 10). JK with J=K=1 toggling with output clocking next = ripple (asynchronous). Ring counter N states; decade counter 0-9; synchronous = common clock.","what_changes":"Counting states, identify type, match.","representative":"june2024_reexam_q53","members":["june2024_reexam_q53","june2019_q15","july2018_q94","dec2022_q7"],"skip_note":"Same counter concepts."},{"id":"u2c23","title":"Flip-flop basics","type":"same-concept-variant","topic":"Sequential Circuits & Flip-Flops","technique":"Flip-flop stores one bit. SR: S=R=0 no change, S=R=1 invalid. Register = group of FFs.","what_changes":"Direct recall.","representative":"dec2023_q5","members":["dec2023_q5","july2018_q92"],"skip_note":"One-line flip-flop facts."},{"id":"u2c24","title":"Interrupt service routine sequence","type":"exact-repeat","topic":"I/O, DMA & Interrupts","technique":"ISR order: save registers -> check which flag is set -> service device -> restore registers -> turn interrupt facility on -> return.","what_changes":"Letters shuffled only.","representative":"dec2024_q60","members":["dec2024_q60","june2024_cancelled_q70"],"skip_note":"Identical steps in two papers."},{"id":"u2c25","title":"I/O procedure ordering","type":"same-concept-variant","topic":"I/O, DMA & Interrupts","technique":"Programmed input: read status register -> check flag -> read data register -> transfer to memory. DMA: request -> grant -> transfer -> release. Complexity order: I/O module < DMA < channel < I/O processor.","what_changes":"Ordered list.","representative":"june2025_q89","members":["june2025_q89","june2024_reexam_q85","nov2021_q86"],"skip_note":"Each is one memorised ordered list."},{"id":"u2c26","title":"Isolated versus memory-mapped I/O","type":"same-concept-variant","topic":"I/O, DMA & Interrupts","technique":"Isolated: separate address space and special IN/OUT instructions. Memory-mapped: shares addresses and control signals with memory, uses normal load/store.","what_changes":"Match or identify.","representative":"dec2019_q87","members":["dec2019_q87","june2024_cancelled_q65"],"skip_note":"Same distinction."},{"id":"u2c27","title":"I/O transfer techniques","type":"same-concept-variant","topic":"I/O, DMA & Interrupts","technique":"Techniques: programmed, interrupt-driven, DMA (also IOP/channel). Handshaking uses two opposite control signals. I/O write = memory/CPU to device.","what_changes":"Choose valid technique or match.","representative":"june2024_cancelled_q88","members":["june2024_cancelled_q88","dec2023_q44","nov2020_q65","june2025_q46"],"skip_note":"Same technique definitions."},{"id":"u2c28","title":"Interrupt types and handling","type":"same-concept-variant","topic":"I/O, DMA & Interrupts","technique":"Internal (stack overflow, invalid opcode), external (timer, I/O), software (supervisor call), machine check. Handler address not fixed (vectored); dedicated interrupt request line.","what_changes":"Classification or statement truth.","representative":"sep2022_q60","members":["sep2022_q60","july2018_q97","nov2021_q73"],"skip_note":"Same interrupt taxonomy."},{"id":"u2c29","title":"Two's complement representation and arithmetic","type":"same-concept-variant","topic":"Number Representation & Arithmetic","technique":"-N in n bits = 2^n - N (invert and add 1). Overflow in addition iff both operands same sign and result sign differs. n-bit signed range -2^(n-1)..2^(n-1)-1. Subtraction = add 2's complement.","what_changes":"Representation, addition, overflow, range, NEG.","representative":"dec2022_q8","members":["dec2022_q8","july2018_q96","dec2022_q5","june2024_cancelled_q83","dec2018_q15","dec2018_q10"],"skip_note":"One 2's complement routine covers all."},{"id":"u2c30","title":"Number base conversion","type":"same-formula","topic":"Number Representation & Arithmetic","technique":"Group bits in 4s for hex, 3s for octal; fractional parts multiply by 2 repeatedly; negative fixed point = 2's complement of the positive pattern.","what_changes":"Binary/hex/octal/fixed point.","representative":"nov2021_q82","members":["nov2021_q82","july2018_q95","june2023_q32"],"skip_note":"Same grouping/conversion procedure."},{"id":"u2c31","title":"Gray and BCD-type codes","type":"same-concept-variant","topic":"Number Representation & Arithmetic","technique":"Gray: g = b xor (b>>1), successive codes differ by one bit. Self-complementing: 2421, excess-3 (not 8421).","what_changes":"Convert, identify, classify.","representative":"dec2023_q6","members":["dec2023_q6","june2025_q44","dec2019_q69"],"skip_note":"Same code rules."},{"id":"u2c32","title":"Amdahl's law speedup","type":"same-formula","topic":"Parallel Processing & Performance (Amdahl, MIPS)","technique":"Speedup = 1/((1-f)+f/s). With p processors: T = serial + parallel/p.","what_changes":"Fraction and factor, or cycle counts.","representative":"june2023_q62","members":["june2023_q62","june2019_q20","june2024_reexam_q84"],"skip_note":"Same formula, different inputs."},{"id":"u2c33","title":"Multiprocessor architecture facts","type":"same-concept-variant","topic":"Parallel Processing & Performance (Amdahl, MIPS)","technique":"Multiprocessor: one OS, shared memory; multicomputer: separate computers on communication lines. NUMA: single address space, remote access via load/store and slower than local. Crossbar is non-blocking.","what_changes":"True/false statements.","representative":"dec2023_q51","members":["dec2023_q51","nov2020_q44","sep2022_q4"],"skip_note":"Same conceptual notes."},{"id":"u2c34","title":"Pipeline speedup and total time","type":"same-formula","topic":"Pipelining & Hazards","technique":"Pipelined time = (k+n-1) x clock (clock = max stage delay + register delay); non-pipelined = n x t. Speedup = n*t_np / ((k+n-1)*tp).","what_changes":"Task count, stage delays, speedup vs total time.","representative":"sep2022_q50","members":["sep2022_q50","dec2019_q9","nov2020_q7","june2024_reexam_q37"],"skip_note":"Same (k+n-1) formula."},{"id":"u2c35","title":"Microinstruction format size","type":"same-formula","topic":"Microprogramming & Control Unit","technique":"Bits = sum of fields: each field ceil(log2 options); address field = log2(control memory words).","what_changes":"Field counts.","representative":"dec2019_q11","members":["dec2019_q11","sep2022_q100"],"skip_note":"Same field-bit summation."}],"singletons":24,"mindset":["Questions are overwhelmingly factual recall, ordered-sequence and match-the-list formats; roughly 70% need no calculation, so breadth beats depth.","Ordering questions (instruction cycle, ISR steps, memory hierarchy, DMA steps, arithmetic pipeline) recur with the options shuffled; the instruction cycle order alone appeared in 5 papers and the ISR sequence twice.","Exact repeats are common across shifts/papers: Dec 2022 Shift I/II primary-vs-secondary statements, and ISR sequence in Dec 2024 and June 2024 Cancelled.","Calculation questions reuse the same formula with new numbers: pipeline (k+n-1) formula (4 papers), Amdahl (3 papers), direct-mapped fields (2), average access time (2), instruction-field bit widths (2), microinstruction size (2).","Statement-combination and 'which are NOT' options punish half-knowledge; distractors are swapped definitions (write-through vs write-back, isolated vs memory-mapped).","Digital logic is tested through K-map and Boolean simplification at medium difficulty; every paper has about one such question and the answer is checkable by plugging minterms.","Cross-unit overlap: Boolean/K-map and gates feed Unit 2 only here but number systems and 8085/basic-computer content appear in OS/programming style questions elsewhere; digital-logic tags are sometimes assigned to memory-sizing questions.","Never asked so far: cache replacement (LRU/FIFO) numericals, hazard types/forwarding, CPI/MIPS computation, Booth multiplication, hit-ratio with miss-penalty tables, virtual memory addressing. Pipeline hazards are a likely future gap.","Difficulty is mostly 1-2 on a 3-point scale; the only multi-step items are IEEE-754 conversion, 2-level cache time, program traces and the DRAM refresh calculation.","Recent papers (2023-2025) lean toward ordered-list and statement formats in CPU, I/O and memory hierarchy, with fewer pure numericals."],"formulas":[{"name":"Instruction word bit allocation","formula":"word bits = mode/indirect + opcode + register code + address; address bits = log2(#words); register bits = log2(#registers)","used_in":["dec2019_q10","dec2018_q14"],"note":"Opcode = remainder after other fields; 512K words -> 19 address bits, 256K -> 18."},{"name":"Mano basic-computer instruction types","formula":"I + 3-bit opcode + 12-bit address; opcode 000-110 memory ref; I=0 & 111 register ref; I=1 & 111 I/O ref","used_in":["dec2024_q84","dec2023_q67"],"note":"Register ref: CLA, CMA, INC, SZA, SNA, SPA; I/O: INP, OUT, SKI, SKO; ISZ is memory-reference."},{"name":"Instruction cycle","formula":"Fetch -> Decode -> Calculate EA -> Fetch operand -> Execute; fetch: PC->MAR->Memory->MBR->IR","used_in":["june2025_q73","dec2024_q38","dec2023_q77","dec2022_q77","dec2022_shiftii_q77"],"note":"EA/operand fetch come after decode."},{"name":"Effective address by mode","formula":"immediate: operand=field; direct: EA=A; indirect: EA=M[A]; register: EA=R; reg indirect: EA=[R]; indexed: EA=A+XR; relative: EA=PC+A","used_in":["dec2019_q86","june2024_cancelled_q11","nov2020_q81"],"note":"Indirect needs 2 memory refs for operand; register needs 0."},{"name":"Memory capacity","formula":"bits = 2^(address lines) x data lines; address lines = log2(words); chips = total / chip size","used_in":["june2019_q19","dec2022_shiftii_q6","june2024_cancelled_q85","june2019_q49"],"note":"Word-addressable: divide bytes by word size first."},{"name":"Direct-mapped cache fields","formula":"address = tag | line | offset; offset = log2(block), line = log2(#lines); main memory = 2^(tag+line) words","used_in":["nov2020_q5","sep2022_q9"],"note":"Cache size = 2^line index (x block size for total)."},{"name":"Average access time","formula":"T = h*Tc + (1-h)*Tm (recursive for multi-level)","used_in":["dec2018_q19","june2024_cancelled_q36"],"note":"Check whether the question gives Tm inclusive of cache probe."},{"name":"Memory hierarchy speed order","formula":"Registers > Cache(SRAM) > DRAM > SSD > HDD > Optical > Tape","used_in":["dec2024_q18","june2024_cancelled_q68","june2024_reexam_q33"],"note":"Watch ascending vs descending."},{"name":"Write policies","formula":"write-through: cache+memory updated; write-back: cache only, dirty bit marks modified block","used_in":["june2025_q79","dec2018_q71"],"note":"Trap: statements swapped."},{"name":"DRAM refresh overhead","formula":"fraction = (rows x refresh time per row) / refresh interval","used_in":["june2023_q87"],"note":"256Mb as 16K x 16K: 16K rows x 100ns / 50ms = 3.3%."},{"name":"K-map rules","formula":"group 1s in powers of 2, wrap edges, don't care used only if it enlarges a group; each group = product of constant variables","used_in":["dec2022_q6","nov2020_q42","july2018_q99","dec2024_q20","june2024_cancelled_q34","dec2022_shiftii_q7"],"note":"Shortcut: test each option against the minterm list."},{"name":"Boolean identities","formula":"x+xy=x, x+x=x, x+1=1, x+0=x, x+x'y=x+y, A'B+AB'+AB=A+B, A xor 1 = A', A xor A = 0","used_in":["dec2018_q7","dec2019_q3","june2023_q35","dec2018_q11","nov2021_q28"],"note":"Names: idempotent, identity, domination, absorption."},{"name":"De Morgan","formula":"(A+B)' = A'B', (AB)' = A'+B'; complement of SOP = product of complemented sums","used_in":["dec2024_q59","dec2022_q44"],"note":"Complement every literal and swap AND/OR."},{"name":"Gate outputs for inputs 00","formula":"NAND=1, NOR=1, XOR=0, XNOR=1; XOR is odd function","used_in":["june2025_q51","nov2021_q81"],"note":"Universal gates: NAND, NOR."},{"name":"Decoder/mux/encoder sizes","formula":"decoder n -> 2^n; encoder 2^n -> n; mux 2^n -> 1; demux 1 -> 2^n; k arbiters need priority encoder of k lines (ceil(log2 k) outputs) and decoder back","used_in":["july2018_q93","sep2022_q7","june2019_q17","june2024_reexam_q38"],"note":"Priority encoder resolves simultaneous inputs; 5 arbiters -> 8x3 and 3x8."},{"name":"Common bus","formula":"n registers of m bits -> m multiplexers each n x 1","used_in":["nov2021_q83"],"note":"8 registers 16 bits -> 16 MUX of 8x1."},{"name":"Cascaded counters","formula":"states = product of moduli (MOD-2 followed by MOD-5 = 10); N-bit ring counter has N states","used_in":["june2019_q15","june2024_reexam_q53"],"note":"Ripple counter = output of one FF clocks next."},{"name":"SR flip-flop","formula":"S=R=0 hold; S=1,R=0 set; S=0,R=1 reset; S=R=1 invalid","used_in":["july2018_q92"],"note":"JK: J=K=1 toggle."},{"name":"ISR / programmed I/O orders","formula":"ISR: save regs, check flag, service, restore regs, enable interrupts; programmed input: read status, check flag, read data, store to memory; DMA: request, grant, transfer, release","used_in":["dec2024_q60","june2024_cancelled_q70","june2025_q89","june2024_reexam_q85"],"note":"Interrupt enable is turned on near the end."},{"name":"Isolated vs memory-mapped I/O","formula":"isolated: separate address spaces + IN/OUT; memory-mapped: shared address space, ordinary load/store","used_in":["dec2019_q87","june2024_cancelled_q65"],"note":"Memory-mapped uses same control signals as memory."},{"name":"Two's complement","formula":"-N = 2^n - N = invert + 1; range -2^(n-1) to 2^(n-1)-1; overflow iff operands same sign and result sign differs","used_in":["dec2022_q5","dec2022_q8","july2018_q96","june2024_cancelled_q83","dec2018_q15","dec2018_q10"],"note":"8-bit: -128..127; unsigned 0..255. Subtraction = add 2's complement."},{"name":"Base conversion","formula":"hex digit = 4 bits, octal digit = 3 bits; fraction: multiply by 2","used_in":["nov2021_q82","july2018_q95","june2023_q32"],"note":"Regroup binary from the radix point outward."},{"name":"Gray code","formula":"g_i = b_i xor b_(i+1); MSB unchanged; adjacent codes differ in 1 bit","used_in":["june2025_q44","dec2023_q6"],"note":"Decimal 8 = 1000 -> 1100."},{"name":"Self-complementing codes","formula":"2421 and excess-3 (and excess-3 Gray per key) are self-complementing; 8421 is not","used_in":["dec2019_q69"],"note":"8421 BCD is not self-complementing."},{"name":"IEEE-754 single precision","formula":"1 sign | 8 exponent (bias 127) | 23 mantissa; value = (-1)^s x 1.m x 2^(e-127)","used_in":["dec2018_q16"],"note":"-40.1 = 0xC2206666."},{"name":"Arithmetic shift","formula":"ASR keeps sign bit and divides by 2; ASL multiplies by 2","used_in":["dec2023_q7"],"note":"Logical shift does not preserve sign."},{"name":"Amdahl's law","formula":"Speedup = 1 / ((1-f) + f/s); with p processors: T = T_serial + T_parallel/p","used_in":["june2023_q62","june2019_q20","june2024_reexam_q84"],"note":"0.3 fraction at 2x -> 1.18; 200+800/16 = 250."},{"name":"Vector processor cycles","formula":"cycles = (elements / lanes) as keyed; x per-op cycles only if specified as a pipeline","used_in":["june2024_reexam_q88"],"note":"The key gives 64 = 1024/16, ignoring the 5-cycle latency."},{"name":"Pipeline time and speedup","formula":"T_pipe = (k+n-1) x t_clock; S = n*t_np / ((k+n-1)*t_clock); max speedup -> k","used_in":["sep2022_q50","dec2019_q9","nov2020_q7","june2024_reexam_q37","nov2020_q43"],"note":"t_clock = max stage delay + latch delay; speedup never equals k exactly."},{"name":"Pipeline speedup with different CPI","formula":"speedup = (avg unpipelined time) / (clock + overhead)","used_in":["dec2022_shiftii_q8"],"note":"Unpipelined avg CPI 4.4 x 10 ns = 44 ns; pipelined 11 ns -> 4x."},{"name":"Microinstruction size","formula":"sum of ceil(log2(options)) over fields + address bits (log2 control memory)","used_in":["dec2019_q11","sep2022_q100"],"note":"15 ops -> 4 bits; 4 status bits -> 2 bits CD; 128 words -> 7 bits."},{"name":"Flynn taxonomy","formula":"SISD, SIMD, MISD, MIMD; complexity SISD < SIMD < MIMD","used_in":["nov2020_q75"],"note":"Multiprocessor = MIMD."}],"plan":[{"step":1,"focus":"CPU organization and instruction cycle","topics":["CPU Organization, Instruction Formats & Addressing"],"hours":2.5,"do":"Solve reps u2c1, u2c2, u2c4, u2c6; memorise the Mano instruction table; trace one program (u2c3)."},{"step":2,"focus":"Memory and cache","topics":["Cache & Memory Hierarchy"],"hours":2.5,"do":"Memorise hierarchy order; solve reps of capacity, direct-mapped fields, access time clusters; read write policies and DRAM/SRAM notes."},{"step":3,"focus":"Boolean algebra and K-maps","topics":["Digital Logic & K-Maps","Combinational Circuits"],"hours":2.0,"do":"Solve K-map rep (dec2022_q6) and a don't-care one; list identities and De Morgan; memorise decoder/encoder/mux sizes."},{"step":4,"focus":"I/O and interrupts","topics":["I/O, DMA & Interrupts"],"hours":1.5,"do":"Memorise ISR, programmed I/O and DMA orders; isolated vs memory-mapped; interrupt classes."},{"step":5,"focus":"Number systems","topics":["Number Representation & Arithmetic"],"hours":1.5,"do":"Do the 2's complement rep, base conversion rep, Gray code, IEEE-754 once."},{"step":6,"focus":"Sequential circuits, pipelining and parallelism","topics":["Sequential Circuits & Flip-Flops","Pipelining & Hazards","Parallel Processing & Performance (Amdahl, MIPS)","Microprogramming & Control Unit"],"hours":2.0,"do":"Pipeline formula rep sep2022_q50, Amdahl rep, counter and flip-flop facts, microinstruction size; skim hazards theory."},{"step":7,"focus":"Revision","topics":["All"],"hours":1.0,"do":"Re-attempt the minimum set without notes and review formulas."}],"minset":49},{"unit":3,"name":"Programming Languages & Computer Graphics","total":146,"papers":15,"topics":[{"topic":"C Programming (output, pointers, operators)","count":39,"papers":15,"first_year":"July 2018","last_year":"June 2025","trend":"rising","priority":"Must","why":"39 of 146 questions (27%) in all 15 papers and sharply rising: 2024-25 papers carry 8+6+3 C items.","what_to_study":["Pointer arithmetic: *(p+k), p++, &arr+1, ptr[-i]","Legal vs illegal pointer operations","Hand-tracing loops, recursion call counts, nested loops with break","Operator precedence and expression gotchas (macro, comma, ternary, hex/octal)","Struct/union padding and little-endian layout","Multi-dim array to pointer expression; declaration decoding","File handling functions and step order"]},{"topic":"C++ & OOP Concepts","count":19,"papers":10,"first_year":"June 2019","last_year":"June 2025","trend":"rising","priority":"Must","why":"19 questions (13%), 10 of 15 papers, mostly fact-statement items and rising lately.","what_to_study":["Constructor properties and syntax","Virtual, pure virtual, abstract class, runtime vs compile-time polymorphism","Inheritance benefits, protected inheritance access, friend functions","Constructor/destructor order with virtual destructor","Pass by reference swap"]},{"topic":"Graphics: 2D/3D Transformations & Projections","count":17,"papers":12,"first_year":"July 2018","last_year":"June 2025","trend":"fading","priority":"Must","why":"17 questions (12%) in 12 papers; numeric matrix items repeat the same scaling/shear formulas.","what_to_study":["Scaling, shear, reflection, rotation matrices (2x2 and 3x3 homogeneous)","Composition order of matrices (right to left)","Scaling about a fixed point","Perspective vs orthographic vs oblique (cavalier, cabinet) properties","Homography/4x4 matrix terminology"]},{"topic":"Graphics: Clipping, Curves, Surfaces & Shading","count":17,"papers":11,"first_year":"July 2018","last_year":"June 2025","trend":"fading","priority":"Must","why":"17 questions (12%) in 11 papers, mostly fact classification that is cheap to master.","what_to_study":["Line vs polygon clipping algorithms (Cohen-Sutherland, Liang-Barsky, NLN, Sutherland-Hodgman)","Bezier properties and cubic control points","Painter, z-buffer, back-face culling; object vs image space","Phong vs Gouraud shading and Phong specular term","Scan-line fill, triangle clipping up to 7 sides"]},{"topic":"Web Technologies (HTML, XML, JS)","count":16,"papers":12,"first_year":"July 2018","last_year":"June 2025","trend":"fading","priority":"Must","why":"16 questions (11%) in 12 papers but fading in 2023-25 (1 per paper or fewer); easy factual marks.","what_to_study":["XML: well-formed vs valid, case sensitivity, namespaces, DTD","HTML tags: script, map, alt, table alignment, lists","CSS overriding order","JavaScript this, scope, dynamic typing","Match HTML/DHTML/XML roles"]},{"topic":"Parameter Passing, Scope & Language Concepts","count":13,"papers":8,"first_year":"July 2018","last_year":"December 2024","trend":"rising","priority":"High","why":"13 questions (9%) in 8 papers, steady; mix of tracing and definitions.","what_to_study":["Call by value vs reference vs pointer; swapping char*","Static vs dynamic binding times","Global variable drawbacks, stack frame","Weak/strong, static typing of C and Java","Loop invariants, top-down design, logical vs syntax errors"]},{"topic":"Java / Python / Other Languages","count":12,"papers":7,"first_year":"July 2018","last_year":"June 2024 (Cancelled)","trend":"fading","priority":"High","why":"12 questions (8%) in 7 papers but essentially absent after 2021 (1 item since); fading.","what_to_study":["Java final/inheritance rules, JVM components, acronyms","Java recursion and aliasing tracing","Programming paradigm characteristics","Which languages are OOP / allow multiple inheritance"]},{"topic":"Display Devices & Graphics Hardware","count":8,"papers":8,"first_year":"July 2018","last_year":"December 2024","trend":"fading","priority":"High","why":"8 questions (5%), one in 8 papers, mostly one-line frame-buffer arithmetic that is free marks.","what_to_study":["Frame buffer size = X*Y*bpp/8","LUT size and refresh-rate formula","Raster vs vector, CRT phosphor terms, hue/wavelength","Input/output device classification"]},{"topic":"Graphics: Line/Circle Algorithms","count":5,"papers":5,"first_year":"December 2018","last_year":"December 2024","trend":"steady","priority":"Medium","why":"5 questions (3%), 5 papers, steady low frequency; no circle question seen.","what_to_study":["DDA vs Bresenham/midpoint differences","Midpoint decision variable","Scan conversion aliasing effects"]}],"clusters":[{"title":"Bit-loop functions (popcount / power-of-2 / bit reversal)","topic":"C Programming (output, pointers, operators)","technique":"Trace n&1 and n>>=1 on a small number; popcount counts 1-bits; a stray \"counter = 1\" in the return makes the answer a constant test. For reversal, build b = 2b + (a&1).","what_changes":"Language (C, C++, Java), return expression, and which property (count of 1s, power of 2, reversed bits) is asked.","representative":"nov2021_q2","members":["nov2021_q2","june2019_q24","dec2018_q49"],"skip_note":"Same shift-and-mask loop; once you can trace one with a 4-bit input the other two take 30 seconds.","id":"u3c1","type":"same-concept-variant"},{"title":"Recursive Java f(m,n) geometric series","topic":"Java / Python / Other Languages","technique":"Unroll the recursion: result = m/n added to the recursive term; terms form a geometric series a/(1-r); plug values.","what_changes":"Only the arguments/base-condition numbers change.","representative":"nov2020_q12","members":["nov2020_q12","dec2018_q48"],"skip_note":"Identical function skeleton, only constants change; solve the Nov 2020 one and the series idea transfers.","id":"u3c2","type":"exact-repeat"},{"title":"Recursion call-counting in C","topic":"C Programming (output, pointers, operators)","technique":"Write the argument chain per call (81->27->9->3 for fun; a halving chain per outer b for Cal) and count calls/prints.","what_changes":"Function body and starting arguments.","representative":"june2024_reexam_q50","members":["june2024_reexam_q50","june2024_reexam_q6"],"skip_note":"Both from the same paper and same skill: tabulate the call chain.","id":"u3c3","type":"same-concept-variant"},{"title":"Pointer arithmetic and indexing output","topic":"C Programming (output, pointers, operators)","technique":"Rewrite everything as *(base+offset); p++ post-increments after use; &arr+1 jumps the whole array; ptr[i]=*(ptr+i) and negative indices are legal.","what_changes":"Array contents, offset expressions, whether &arr, p++ or p[-i] is used.","representative":"june2024_reexam_q62","members":["june2024_reexam_q62","june2024_reexam_q76","june2024_reexam_q12","dec2023_q78"],"skip_note":"All four are *(p+k) bookkeeping; master the &arr+1 and *p++ rules and the rest are mechanical.","id":"u3c4","type":"same-concept-variant"},{"title":"Legal and illegal pointer operations","topic":"C Programming (output, pointers, operators)","technique":"Allowed: ptr+-int, ptr-ptr (gives int), assigning &var. Illegal: ptr+ptr, ptr*int, ptr/int, assigning int to pointer without cast, &constant.","what_changes":"Which operation or statement is offered as the trap.","representative":"june2025_q68","members":["june2025_q68","june2023_q83","dec2019_q72","june2024_cancelled_q21"],"skip_note":"One rule table (pointer legality) answers all four.","id":"u3c5","type":"same-concept-variant"},{"title":"Pointer concept statements (what pointers can/cannot do)","topic":"C Programming (output, pointers, operators)","technique":"Pointers store addresses, can point to pointers, access arrays, simulate call by reference, build dynamic structures; they are not auto-dereferenced.","what_changes":"Wording of which capability is true/false.","representative":"june2024_reexam_q3","members":["june2024_reexam_q3","sep2022_q20"],"skip_note":"Pure fact-recall of the same list.","id":"u3c6","type":"same-concept-variant"},{"title":"Multi-dimensional array to pointer expression","topic":"C Programming (output, pointers, operators)","technique":"a[i][j][k] = *(*(*(a+i)+j)+k); count dereference levels equal to dimensions.","what_changes":"Dimensions and the index names.","representative":"june2025_q13","members":["june2025_q13","dec2022_q10"],"skip_note":"Same identity; distractors only mis-place parentheses.","id":"u3c7","type":"same-formula"},{"title":"Decoding C declarations (function pointer / typedef)","topic":"C Programming (output, pointers, operators)","technique":"Read declarations inside-out: int (*f)(int,int) is a pointer to function; typedef (*(*arrfptr[3])())[10] is array of 3 pointers to functions returning pointer to array of 10.","what_changes":"Declarator complexity.","representative":"june2024_reexam_q9","members":["june2024_reexam_q9","june2023_q69"],"skip_note":"Same inside-out reading rule.","id":"u3c8","type":"same-concept-variant"},{"title":"Struct/union memory layout, padding and endianness","topic":"C Programming (output, pointers, operators)","technique":"Align each member to a multiple of its size, pad struct to multiple of max alignment, union size = largest member; little endian value = b1*256+b0.","what_changes":"Member list, machine word size, or byte values.","representative":"nov2020_q11","members":["nov2020_q11","june2019_q22","july2018_q4"],"skip_note":"All three are byte-layout arithmetic; do the
