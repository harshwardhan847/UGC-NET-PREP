mple covers them."},{"id":"u8c2","title":"Closure/regularity of regular-language operations (quotient, homomorphism, reversal, union with L*)","type":"same-concept-variant","topic":"Language Hierarchy & Closure Properties","technique":"Regular languages are closed under every standard operation; apply the operation to the DFA/regex (substitute symbols for homomorphism, reverse arrows for reversal). L ∪ A* = A* is regular.","what_changes":"The operation (prefix-half quotient, homomorphism, reversal, union with Σ*).","representative":"dec2023_q22","members":["dec2018_q34","dec2023_q22","dec2019_q46","june2023_q25"],"skip_note":"Answer is always \"still regular\"; the only skill is applying h to each symbol of the regex."},{"id":"u8c3","title":"Language-class closure matching (complement/union/intersection of REC, RE, CF, regular)","type":"same-concept-variant","topic":"Language Hierarchy & Closure Properties","technique":"Use: REC closed under complement and union; RE closed under union but not complement; complement of CFL is only recursive (CSL); regular* ∩ CFL is CFL. Compose upward.","what_changes":"Which combination of classes is matched; same three-row structure.","representative":"nov2020_q71","members":["june2019_q76","nov2020_q71"],"skip_note":"Same three row pattern, only the pairing order changes."},{"id":"u8c4","title":"Chomsky hierarchy: types, automata, production forms, containment","type":"same-concept-variant","topic":"Language Hierarchy & Closure Properties","technique":"Type3=regular=FA, Type2=CFG=PDA, Type1=CSG=LBA, Type0=RE=TM. Regular ⊂ CFL ⊂ CSL ⊂ Recursive ⊂ RE. Type-3 is the only epsilon-free type by form.","what_changes":"Matching tables (grammar-automaton, grammar-production form), ordering by power, containment chain.","representative":"june2025_q76","members":["sep2022_q78","dec2024_q56","june2025_q76","june2024_reexam_q77","dec2019_q50","july2018_q37","dec2022_q30"],"skip_note":"Same hierarchy table rephrased every time."},{"id":"u8c5","title":"Classify a language with counting constraints (CF vs not CF vs CSL)","type":"same-concept-variant","topic":"Language Hierarchy & Closure Properties","technique":"One counter (a^n b^n, n_a+n_b=n_c, a^(n+m) b^n a^m) is CF; two independent equalities across three or more blocks (a^n b^n c^n, i=j=k) are not CF but CSL. Check by whether one stack can match all dependencies.","what_changes":"The exact exponent relation among blocks.","representative":"june2024_reexam_q90","members":["dec2018_q35","june2024_reexam_q90","june2023_q40","july2018_q38"],"skip_note":"All ask \"can a single stack do it\"; learn the rule, not the instances."},{"id":"u8c6","title":"CNF/GNF form and derivation-length facts","type":"same-concept-variant","topic":"Context-Free Grammars & PDA","technique":"CNF rules: A→BC or A→a. Derivation of a string of length n in CNF takes 2n-1 steps. Conversion bound (K-1)|P|+|T|. GNF: A→aα.","what_changes":"Recall a formula vs identify which grammar is in CNF/GNF.","representative":"dec2024_q66","members":["dec2019_q49","july2018_q35","june2023_q34","dec2024_q66","nov2021_q38"],"skip_note":"CNF definition plus 2n-1 covers the family."},{"id":"u8c7","title":"Ambiguity: identify ambiguous grammars, definition, dangling else","type":"same-concept-variant","topic":"Context-Free Grammars & PDA","technique":"Ambiguous iff some string has two parse trees (equivalently two leftmost or two rightmost derivations). Test the grammar with SS, SbS, or asbs patterns; if/else with unmatched else is ambiguous. Palindrome-like wwR is not inherently ambiguous; aⁿbⁿcᵐ ∪ aⁿbᵐcᵐ is.","what_changes":"Which grammars are given; definition options.","representative":"sep2022_q69","members":["july2018_q36","sep2022_q69","nov2020_q57","dec2018_q40","dec2019_q48","june2024_cancelled_q32","june2024_cancelled_q52"],"skip_note":"Find two trees for S→SS or SbS style grammars once and you can do every variant."},{"id":"u8c8","title":"What language does this grammar generate / string property","type":"same-concept-variant","topic":"Context-Free Grammars & PDA","technique":"Expand productions symbolically, find the invariant (parity, ordering, lengths) and test short strings against options.","what_changes":"Grammar and options; includes length-pattern matching for S→a^kSa^k|aa.","representative":"sep2022_q13","members":["dec2019_q45","june2019_q78","nov2021_q32","sep2022_q13","dec2022_shiftii_q73"],"skip_note":"All reduce to deriving a few short strings; do the recent one for the method."},{"id":"u8c9","title":"Construct or compare grammars for a given language","type":"same-concept-variant","topic":"Context-Free Grammars & PDA","technique":"Test each option grammar on the shortest strings of the language (and a string that must be excluded). For equivalence, compare the sets generated by recursion (SS and λ closure).","what_changes":"Target language: a^n b^(n-3), strings containing abb, concatenation of regex branches, equivalence of aSb|bSa|SS variants.","representative":"dec2022_shiftii_q58","members":["dec2019_q44","dec2022_shiftii_q58","dec2019_q43"],"skip_note":"Eliminate-by-counterexample; the same short-string test works for all."},{"id":"u8c10","title":"PDA language from transitions","type":"same-concept-variant","topic":"Context-Free Grammars & PDA","technique":"Trace stack effect: pushes per a, pops per b gives ratio language (push 3 pop 1 gives a^n b^3n; 11 per a gives a^2n b^n). Start-state epsilon move to final adds the empty string (n≥0 vs n>0).","what_changes":"Push amount and pop count; n≥0 vs n>0.","representative":"sep2022_q16","members":["sep2022_q16","june2024_cancelled_q69","nov2021_q37"],"skip_note":"Same trace; ratios and the n≥0/n>0 boundary are the only changes."},{"id":"u8c11","title":"Automata power facts (PDA, multi-stack, grammar types recognised)","type":"same-concept-variant","topic":"Context-Free Grammars & PDA","technique":"PDA recognises CFL (and regular); two stacks = TM; DPDA with prefix property corresponds to LR(0).","what_changes":"Statement wording.","representative":"june2023_q48","members":["july2018_q33","july2018_q34","june2023_q48"],"skip_note":"One-liner facts."},{"id":"u8c12","title":"CFG simplification and decision on CFL (reduced grammar, order, finiteness)","type":"same-concept-variant","topic":"Context-Free Grammars & PDA","technique":"Order: remove epsilon, then unit, then useless (non-generating before unreachable). Finiteness of CFL decided on non-redundant CNF grammar of L-{Λ} by looking for a cycle.","what_changes":"Compute reduced grammar vs recall order vs decision algorithm.","representative":"sep2022_q12","members":["dec2022_shiftii_q83","sep2022_q12","june2019_q77"],"skip_note":"Do the reduced grammar example once."},{"id":"u8c13","title":"Identify grammar type / form of productions","type":"same-concept-variant","topic":"Context-Free Grammars & PDA","technique":"Classify by LHS and RHS shape: single non-terminal LHS = CF; right-linear = regular; A→BC|a = CNF; LL(1) grammars parsable by recursive descent.","what_changes":"Which grammars are tested.","representative":"june2025_q14","members":["june2025_q14","june2024_cancelled_q5","june2024_reexam_q20"],"skip_note":"Shape-reading drill, same each time."},{"id":"u8c14","title":"Dec 2024 passage: automata for strings containing abb","type":"same-concept-variant","topic":"Finite Automata & Regular Languages","technique":"Strings over {a,b} containing abb: DFA with 4 states, final state absorbing; regex (a+b)*abb(a+b)*; grammar S→AabbA, A→aA|bA|ε. Check option by testing abb, ab, aabb.","what_changes":"Question asks for DFA, language form, regex, grammar or minimum-state identification.","representative":"dec2024_q91","members":["dec2024_q91","dec2024_q93","dec2024_q94","dec2024_q92","dec2024_q95"],"skip_note":"Whole passage is one machine seen five ways; build it once."},{"id":"u8c15","title":"Membership of strings in L* for L={ab,aa,baa}","type":"exact-repeat","topic":"Finite Automata & Regular Languages","technique":"Greedily parse into blocks ab, aa, baa; a string fails if some a-run leaves a dangling single a or b start that cannot be matched.","what_changes":"Option strings.","representative":"dec2023_q21","members":["dec2023_q21","sep2022_q15"],"skip_note":"Identical language, only options change."},{"id":"u8c16","title":"Count states/final states in (minimal) DFA","type":"same-concept-variant","topic":"Finite Automata & Regular Languages","technique":"Unary multiples of n: n states (the answer key shows n+1 for a particular form). Minimal DFA via table filling; merge states with equal outputs. Counts for n-state automata: initial 1, final 0..n.","what_changes":"Language, regex or diagram.","representative":"nov2021_q35","members":["june2019_q75","nov2021_q35","dec2018_q32","dec2023_q31","dec2022_q32"],"skip_note":"Count/minimisation drill; do table-filling once."},{"id":"u8c17","title":"Read an automaton: language, regex, equivalence","type":"same-concept-variant","topic":"Finite Automata & Regular Languages","technique":"Track parity/pattern state; for regex use state elimination or Arden R=Q+RP gives Q P*. Equivalence: minimise both and compare.","what_changes":"Diagram and options.","representative":"june2025_q75","members":["july2018_q32","june2025_q75","nov2021_q36","june2024_cancelled_q73","dec2022_q59"],"skip_note":"All require describing what each state remembers."},{"id":"u8c18","title":"NFA/DFA/epsilon-NFA conceptual facts and conversion","type":"same-concept-variant","topic":"Finite Automata & Regular Languages","technique":"NFA and DFA recognise the same class; epsilon-closure for shortest string; equivalent machines accept the same language; construction order: problem, regex, NFA-ε, DFA, min DFA.","what_changes":"Statement-based.","representative":"june2025_q50","members":["dec2022_shiftii_q32","june2025_q50","june2024_reexam_q65","july2018_q31","june2024_cancelled_q50"],"skip_note":"Concept recall."},{"id":"u8c19","title":"Regex containment and equivalence","type":"same-concept-variant","topic":"Regular Expressions & Pumping Lemma","technique":"Rewrite each regex as a description set; (a*+b)*=(a+b)*; s=aa*b ⊂ a*b; a(a+b)+ ⊂ a(a+b)*. Check inclusion by sample strings.","what_changes":"Regex trio changes.","representative":"nov2020_q79","members":["nov2020_q79","dec2018_q31","nov2020_q28"],"skip_note":"Regexes repeat; learn sample test."},{"id":"u8c20","title":"Regex algebra and writing a regex for a language","type":"same-concept-variant","topic":"Regular Expressions & Pumping Lemma","technique":"φ+L=L, εL=L, φL=φ; precedence star > concatenation > union. For a^n b^m with bounds, write a^4 a* (λ+b+bb+bbb).","what_changes":"Identity list or bound values.","representative":"sep2022_q14","members":["dec2022_shiftii_q60","dec2022_q83","sep2022_q14"],"skip_note":"Short rule recalls."},{"id":"u8c21","title":"Pumping lemma statements and non-regular languages","type":"same-concept-variant","topic":"Regular Expressions & Pumping Lemma","technique":"Regular PL: |xy|≤p, |y|≥1. CFL PL: |vx|≥1, |vwx|≤p. Languages needing unbounded comparison (n≠k, a^(n+k) with ordering, square lengths, ww) are not regular; a^(n^2) is not regular too.","what_changes":"Which language or which PL parameter.","representative":"dec2024_q19","members":["dec2024_q19","dec2022_q29","dec2022_shiftii_q30","nov2021_q31","nov2020_q56"],"skip_note":"One PL statement plus unbounded-count rule."},{"id":"u8c22","title":"Parser power ordering and parser types","type":"same-concept-variant","topic":"Parsing (LL, LR, Operator Precedence)","technique":"LR(0) < SLR < LALR < CLR(1); LL(1) and recursive descent are top-down; LR family bottom-up; Yacc generates LALR(1); operator precedence is weakest bottom-up.","what_changes":"Pairwise statements, ordering, naming.","representative":"june2025_q88","members":["sep2022_q91","june2023_q68","june2025_q88","nov2021_q40","dec2024_q74"],"skip_note":"One ordering; memorise it."},{"id":"u8c23","title":"Shift-reduce parser basics (derivation, scan order, conflicts, stack configuration)","type":"same-concept-variant","topic":"Parsing (LL, LR, Operator Precedence)","technique":"Bottom-up = rightmost derivation in reverse, scans left to right, uses stack, input buffer, table; conflicts resolved by precedence/associativity.","what_changes":"Fact asked.","representative":"dec2022_q73","members":["july2018_q39","june2019_q74","dec2022_q31","dec2022_q73","june2024_cancelled_q2"],"skip_note":"Memory facts."},{"id":"u8c24","title":"LR items, handles and GOTO","type":"same-concept-variant","topic":"Parsing (LL, LR, Operator Precedence)","technique":"A→ε yields item A→·; GOTO(I,X) moves dot over X then closure; handle is the leftmost simple phrase reduced at each step.","what_changes":"Grammar.","representative":"june2024_reexam_q1","members":["dec2023_q24","dec2022_shiftii_q31","june2024_reexam_q1"],"skip_note":"Do the GOTO closure once."},{"id":"u8c25","title":"LL(1)/FOLLOW computation","type":"same-concept-variant","topic":"Parsing (LL, LR, Operator Precedence)","technique":"FOLLOW(X) = FIRST of what comes after X; if nullable add FOLLOW of the parent. LL(1) requires unambiguous grammar with no left recursion and disjoint FIRST.","what_changes":"Grammar.","representative":"june2024_reexam_q18","members":["june2024_reexam_q18","dec2018_q39"],"skip_note":"Both revolve around LL(1) conditions."},{"id":"u8c26","title":"Compiler phases and their roles","type":"same-concept-variant","topic":"Syntax-Directed Translation, Intermediate Code & Optimization","technique":"Order: lexical, syntax, semantic, intermediate code, optimisation, code generation. Semantic analysis does type checking/conversion; symbol table holds identifiers and attributes.","what_changes":"Ordering vs input matching.","representative":"dec2023_q81","members":["dec2023_q81","dec2023_q71","june2024_cancelled_q18","june2019_q71"],"skip_note":"Phase pipeline knowledge."},{"id":"u8c27","title":"Intermediate code, SDT and syntax-tree uses","type":"same-concept-variant","topic":"Syntax-Directed Translation, Intermediate Code & Optimization","technique":"Forms: syntax tree, DAG, postfix, three-address code (quadruples, triples, indirect triples). SDT used for type checking, syntax tree, TAC; quads count = operators.","what_changes":"Statement-based and one quadruple count.","representative":"dec2023_q54","members":["nov2020_q30","dec2023_q30","dec2023_q54","june2019_q72","dec2022_q60","june2024_reexam_q51","dec2024_q43"],"skip_note":"Concept recall plus one operator count."},{"id":"u8c28","title":"Code optimisation concepts","type":"same-concept-variant","topic":"Syntax-Directed Translation, Intermediate Code & Optimization","technique":"Constant folding = compile-time evaluation; loops identified by dominators, depth-first order, reducible graphs.","what_changes":"Term vs list.","representative":"nov2021_q39","members":["june2019_q73","dec2024_q31","nov2021_q39"],"skip_note":"Terminology."},{"id":"u8c29","title":"June 2025 TAC passage: leaders, flow graph, dominators, optimisation","type":"same-concept-variant","topic":"Syntax-Directed Translation, Intermediate Code & Optimization","technique":"Leaders: first instruction, targets of jumps, instruction after a jump. Build blocks leader to leader, draw edges, derive dominators.","what_changes":"Which sub-question.","representative":"june2025_q91","members":["june2025_q91","june2025_q92","june2025_q93","june2025_q94","june2025_q95","dec2022_shiftii_q59"],"skip_note":"One TAC listing used five times."},{"id":"u8c30","title":"Decidability: Rice theorem and TM undecidable problems","type":"same-concept-variant","topic":"Turing Machines, Decidability & Reducibility","technique":"Any non-trivial property of L(M) is undecidable (equivalence, emptiness, finiteness, regularity). Halting is undecidable. Properties of the machine code itself or bounded simulation are decidable.","what_changes":"Statement set.","representative":"sep2022_q66","members":["july2018_q40","dec2019_q51","june2023_q66","sep2022_q66"],"skip_note":"Rice theorem covers."},{"id":"u8c31","title":"Decidability per language class","type":"same-concept-variant","topic":"Turing Machines, Decidability & Reducibility","technique":"Regular: all decidable. CFL: membership/emptiness/finiteness decidable, equivalence/universality undecidable. CSL: membership decidable, emptiness undecidable. Recursive: membership decidable, emptiness undecidable.","what_changes":"Class and problem.","representative":"nov2020_q55","members":["nov2020_q55","nov2020_q87","dec2018_q37","dec2018_q38","june2019_q79"],"skip_note":"One table."},{"id":"u8c32","title":"Post correspondence problem instances","type":"same-concept-variant","topic":"Turing Machines, Decidability & Reducibility","technique":"Look for a sequence where concatenations from both lists match; check length balance and first/last symbols. PCP in general is undecidable.","what_changes":"Lists.","representative":"sep2022_q65","members":["dec2019_q52","sep2022_q65"],"skip_note":"Two instances; solve one."},{"id":"u8c33","title":"TM design passage a^n b^m c^n d^m transitions","type":"same-concept-variant","topic":"Turing Machines, Decidability & Reducibility","technique":"Mark one a with X1 then move right to matching c, mark with X2; error entries are transitions that move into a wrong symbol class. Track which mark each state seeks.","what_changes":"Each question picks a different state/symbol cell.","representative":"dec2022_shiftii_q96","members":["dec2022_shiftii_q96","dec2022_shiftii_q97","dec2022_shiftii_q98","dec2022_shiftii_q99","dec2022_shiftii_q100"],"skip_note":"Understand one machine once."},{"id":"u8c34","title":"TM basics: definition, transition function, language from δ","type":"same-concept-variant","topic":"Turing Machines, Decidability & Reducibility","technique":"Single-tape δ: Q×Γ→Q×Γ×{L,R}; multi-tape adds k tapes and S. Recursive = halts on all inputs. TM exists for every regular and CF language. aⁿbⁿ marking machine includes n≥1.","what_changes":"Fact vs trace.","representative":"dec2024_q37","members":["dec2024_q37","june2024_reexam_q63","dec2022_shiftii_q29","june2019_q80","dec2022_q89"],"skip_note":"Basic definitions."}],"singletons":4,"mindset":["Fact-recall dominates: closure tables, Chomsky hierarchy, parser power ordering, decidability tables are re-asked in new wording nearly every paper.","Two-statement (Statement I/II) and \"which are correct\" multi-select formats are used for closure, parser and decidability facts; one wrong item in the list is the trap.","Passage sets (Dec 2022 Shift II TM, Dec 2024 abb machine, June 2025 TAC) deliver 5 questions on one object, so one build-the-object skill pays five times.","Distractors swap CFL closure (union/intersection/complement), LALR vs SLR power order, and recursive vs RE, so memorise directions exactly.","Numbers get reused: L={ab,aa,baa} L* asked in 2022 and 2023; CNF 2n-1; aⁿbⁿcⁿ counterexample recurs.","Difficulty is mostly easy-medium; tracing a PDA/TM or computing FOLLOW/GOTO is the hardest tier.","Cross-unit overlap: compiler topics (TAC, optimisation, parsing) overlap with the system software/programming unit.","Almost never asked: LALR table construction, Rice-theorem proofs, formal proofs of the pumping lemma, lexer generation, register allocation numerics."],"formulas":[{"name":"Chomsky hierarchy","formula":"Regular ⊂ DCFL ⊂ CFL ⊂ CSL ⊂ Recursive ⊂ RE; Type3=FA, Type2=PDA, Type1=LBA, Type0=TM","used_in":["sep2022_q78","dec2024_q56","june2025_q76","dec2019_q50","july2018_q37"],"note":"Recursive sits between CSL and RE."},{"name":"CFL closure","formula":"Closed: ∪, ·, *, reversal, homomorphism, ∩ regular. Not closed: ∩, complement, difference","used_in":["dec2018_q36","sep2022_q92","nov2021_q34","june2024_reexam_q49","nov2020_q29"],"note":"CFL − regular is CF; CFL ∩ CFL is not."},{"name":"Regular closure","formula":"Closed under all of union, concat, star, complement, intersection, reversal, homomorphism, quotient","used_in":["dec2018_q34","dec2019_q46","june2023_q25","dec2023_q22"],"note":"L ∪ Σ* = Σ* regular."},{"name":"Class closure","formula":"REC closed under complement; RE not closed under complement; regular* ∩ CFL is CFL","used_in":["june2019_q76","nov2020_q71"],"note":"Compose upward in the hierarchy."},{"name":"CNF form","formula":"A → BC or A → a; derivation of length-n string takes 2n-1 steps","used_in":["july2018_q35","dec2024_q66","nov2021_q38"],"note":"Count n-1 binary + n terminal rules."},{"name":"CNF conversion bound","formula":"(K-1)|P| + |T|","used_in":["dec2019_q49"],"note":"Per answer key of this question."},{"name":"GNF","formula":"A → a α (terminal first then variables)","used_in":["nov2021_q38"],"note":"Do not confuse with CNF."},{"name":"Ambiguity","formula":"Ambiguous iff some string has ≥2 parse trees ⇔ ≥2 leftmost derivations ⇔ ≥2 rightmost","used_in":["sep2022_q69","june2024_cancelled_q32","nov2020_q57","july2018_q36"],"note":"More than one derivation alone is not ambiguity."},{"name":"Pumping lemma (regular)","formula":"w=xyz, |xy|≤p, |y|≥1, xy^i z ∈ L for all i≥0","used_in":["dec2022_shiftii_q30","dec2024_q19"],"note":"Only proves non-regularity."},{"name":"Pumping lemma (CFL)","formula":"w=uvwxy, |vwx|≤p, |vx|≥1, uv^i wx^i y ∈ L","used_in":["dec2022_q29"],"note":"Minimum |vx|=1."},{"name":"Regex identities","formula":"φ+L=L; εL=L; φL=φ; (a*+b)*=(a+b)*; precedence star > concat > union","used_in":["dec2022_shiftii_q60","dec2022_q83","nov2020_q28"],"note":"φL is φ, not L."},{"name":"Arden theorem","formula":"R = Q + RP ⇒ R = QP*","used_in":["nov2021_q36"],"note":"P must not contain ε."},{"name":"Moore/Mealy","formula":"Every Moore machine has an equivalent Mealy machine and vice versa","used_in":["dec2023_q55"],"note":"Both are FSMs with output."},{"name":"PDA power","formula":"PDA = CFL; two stacks = TM; DPDA+prefix property ↔ LR(0)","used_in":["july2018_q33","july2018_q34","june2023_q48"],"note":"One stack is not enough for a^n b^n c^n."},{"name":"Decidability table","formula":"Regular: all decidable. CFL: membership, emptiness, finiteness decidable; equivalence, universality undecidable. CSL: membership decidable, emptiness undecidable. Recursive: membership decidable, emptiness undecidable","used_in":["nov2020_q55","nov2020_q87","dec2018_q37","dec2018_q38","june2019_q79"],"note":"Common trap: CSL membership is decidable."},{"name":"Rice theorem","formula":"Every non-trivial semantic property of L(M) is undecidable","used_in":["sep2022_q66","june2023_q66","july2018_q40","dec2019_q51"],"note":"Properties of M itself (e.g., bounded cells) can be decidable."},{"name":"PCP","formula":"Undecidable in general; solve instances by matching strings","used_in":["dec2019_q52","sep2022_q65"],"note":"Check first/last symbols."},{"name":"TM definitions","formula":"δ: Q×Γ→Q×Γ×{L,R}; multi-tape δ: Q×Γ^k→Q×Γ^k×{L,R,S}^k; recursive language = TM halts on all inputs","used_in":["dec2022_shiftii_q29","june2019_q80","dec2022_q89"],"note":"Recursive requires halting on rejected strings too."},{"name":"Parser power","formula":"LR(0) < SLR < LALR(1) < CLR(1); LL(1) ⊂ LR(1); Yacc = LALR","used_in":["sep2022_q91","june2023_q68","june2025_q88","dec2024_q74"],"note":"LALR is weaker than CLR, stronger than SLR."},{"name":"Bottom-up parsing","formula":"Reverse of rightmost derivation; scans left to right; stack+buffer+table","used_in":["july2018_q39","june2019_q74","dec2022_q31"],"note":"LL gives leftmost derivation."},{"name":"FOLLOW","formula":"FOLLOW(X) ⊇ FIRST(β) for A→αXβ; if β nullable add FOLLOW(A)","used_in":["june2024_reexam_q18"],"note":"ε never in FOLLOW; $ for start symbol."},{"name":"LR item","formula":"A → ε yields item A → ·","used_in":["dec2022_shiftii_q31"],"note":"GOTO moves dot then closes."},{"name":"Quadruple count","formula":"One quadruple per operator","used_in":["june2019_q72"],"note":"Expression (i*j)+(e+f)*(a*b+c) has 6."},{"name":"Basic block leaders","formula":"First instruction; target of any jump; instruction immediately after a jump","used_in":["dec2022_shiftii_q59","june2025_q91"],"note":"Middle instruction is not a leader."},{"name":"Compiler phases order","formula":"Lexical → syntax → semantic → intermediate code → optimisation → code generation","used_in":["dec2023_q81","dec2023_q71"],"note":"Semantic analysis does type checking."},{"name":"Constant folding","formula":"Compile-time evaluation of constant expressions","used_in":["june2019_q73"],"note":"Not strength reduction."},{"name":"L* membership","formula":"Parse into {ab,aa,baa} blocks greedily","used_in":["dec2023_q21","sep2022_q15"],"note":"Check a-run parity."}],"plan":[{"step":1,"focus":"Chomsky hierarchy and closure tables","topics":["Language Hierarchy & Closure Properties"],"hours":3.0,"do":"Memorise hierarchy and closure tables; solve reps u8c1, u8c4, u8c5."},{"step":2,"focus":"CFG, ambiguity, CNF, PDA","topics":["Context-Free Grammars & PDA"],"hours":4.0,"do":"Solve reps of u8c6-u8c13; practise PDA tracing."},{"step":3,"focus":"Finite automata and regex","topics":["Finite Automata & Regular Languages","Regular Expressions & Pumping Lemma"],"hours":3.5,"do":"Solve u8c14-u8c21; table-filling and Arden once."},{"step":4,"focus":"Turing machines and decidability","topics":["Turing Machines, Decidability & Reducibility"],"hours":3.0,"do":"Memorise decidability table, Rice; solve u8c30-u8c34."},{"step":5,"focus":"Parsing","topics":["Parsing (LL, LR, Operator Precedence)"],"hours":2.5,"do":"Power ordering, FOLLOW, GOTO; solve u8c22-u8c25."},{"step":6,"focus":"Compiler back-end topics and lexical","topics":["Syntax-Directed Translation, Intermediate Code & Optimization","Lexical Analysis"],"hours":2.5,"do":"Phases, TAC, leaders, optimisation; do u8c26-u8c29 and the token-count singleton."}],"minset":37},{"unit":9,"name":"Data Communication and Computer Networks","total":167,"papers":15,"topics":[{"topic":"Network Security & Cryptography","count":26,"papers":11,"first_year d":"u9c2"},{"title":"Sliding-window passage and throughput calculation","type":"same-formula","topic":"Data Link Layer, Error Control & Flow Control","technique":"Tt = frame bits/rate; Tp = distance x delay per km; optimal window W = 1 + 2Tp/Tt; efficiency = min(1, W_given/W_opt); throughput = efficiency x rate; sequence bits n with 2^n - 1 >= window (go-back-N style).","what_changes":"Which quantity is asked (Tt/Tp, W, seq bits, efficiency, throughput); sep2022_q47 uses a satellite channel with window 15.","representative":"sep2022_q38","members":["sep2022_q36","sep2022_q37","sep2022_q38","sep2022_q39","sep2022_q40","sep2022_q47"],"skip_note":"Once q38 is mastered the other five reuse the same Tt, Tp, W numbers.","id":"u9c3"},{"title":"Propagation delay and bandwidth-delay product","type":"same-formula","topic":"Data Link Layer, Error Control & Flow Control","technique":"Propagation delay = length/speed; BDP = bandwidth x delay (use round-trip time when given RTT).","what_changes":"Numbers and whether delay is one-way or round trip.","representative":"june2025_q24","members":["june2025_q24","june2019_q83"],"skip_note":"One-line direct substitutions; one example is enough.","id":"u9c4"},{"title":"Hamming distance and error detection/correction capacity","type":"same-concept-variant","topic":"Data Link Layer, Error Control & Flow Control","technique":"Detect s errors: d_min = s+1; correct t errors: d_min = 2t+1; Hamming distance = number of differing bit positions; decode to nearest valid codeword.","what_changes":"Asks rule (detect vs correct) or computes a distance or nearest codeword.","representative":"nov2020_q31","members":["nov2020_q31","dec2022_q36","july2018_q49","dec2024_q17"],"skip_note":"The two rules plus XOR-count method answer all four.","id":"u9c5"},{"title":"CRC codeword formation","type":"exact-repeat","topic":"Data Link Layer, Error Control & Flow Control","technique":"Codeword = dataword followed by remainder (append, not add).","what_changes":"Identical question in both Dec 2022 shifts.","representative":"dec2022_q34","members":["dec2022_q34","dec2022_shiftii_q36"],"skip_note":"Identical text; solve once.","id":"u9c6"},{"title":"WAN link protocols (PPP, Frame Relay, X.25) facts","type":"same-concept-variant","topic":"Data Link Layer, Error Control & Flow Control","technique":"Frame relay frame: Flag, Address, Information, FCS, Flag; frame relay detects errors but gives no ack/flow control; PPP gives framing, link setup, authentication but no flow control or sequence numbering; X.25 is connection-oriented with SVCs.","what_changes":"Which protocol and which property is asked.","representative":"june2024_cancelled_q58","members":["june2024_cancelled_q58","june2024_cancelled_q44","nov2021_q99"],"skip_note":"All use the same short fact sheet on three WAN protocols.","id":"u9c7"},{"title":"Subnetting passage (130.56.0.0/16 into 1024 subnets)","type":"same-formula","topic":"IP Addressing, Subnetting & CIDR","technique":"Subnet bits = log2(subnets); new prefix = old + bits; addresses per subnet = 2^(32-prefix); first = block base, last = base + size - 1; last subnet = top of the parent block.","what_changes":"Quantity asked: addresses, prefix, mask, first/last of first or last subnet.","representative":"dec2022_shiftii_q91","members":["dec2022_shiftii_q91","dec2022_shiftii_q92","dec2022_shiftii_q93","dec2022_shiftii_q94","dec2022_shiftii_q95"],"skip_note":"Single worked passage; the same numbers answer all five.","id":"u9c8"},{"title":"IPv4 classes, ranges and special addresses","type":"same-concept-variant","topic":"IP Addressing, Subnetting & CIDR","technique":"Class first octets: A 0-127 (loopback 127), B 128-191, C 192-223, D 224-239, E 240-255. Class A is 1/2 of space, B 1/4, C 1/8 (12.5%).","what_changes":"Asks last address, share of space, class of a given address, or loopback facts.","representative":"june2024_reexam_q32","members":["june2024_reexam_q32","dec2019_q53","june2019_q88","june2019_q85","june2024_reexam_q80"],"skip_note":"Memorising the class table answers all of them.","id":"u9c9"},{"title":"Subnet mask and host/subnet counting","type":"same-formula","topic":"IP Addressing, Subnetting & CIDR","technique":"Hosts per subnet = 2^(host bits) - 2; subnets = 2^(subnet bits) (minus 2 in old classful convention as in nov2021_q95); AND address with mask to compare networks.","what_changes":"Mask value, class, required subnets or hosts.","representative":"june2024_reexam_q58","members":["june2024_reexam_q58","sep2022_q48","nov2021_q95","june2019_q84","june2024_reexam_q69"],"skip_note":"Same bit-counting recipe; do one class B mask problem and one same-network check.","id":"u9c10"},{"title":"CIDR block splitting and route aggregation","type":"same-concept-variant","topic":"IP Addressing, Subnetting & CIDR","technique":"Split a prefix by halves/quarters (add 1 bit or 2 bits); aggregate contiguous blocks by shortening the prefix.","what_changes":"Allocation vs aggregation direction.","representative":"dec2018_q87","members":["dec2018_q87","dec2022_q62"],"skip_note":"Both rely on prefix-length arithmetic on contiguous blocks.","id":"u9c11"},{"title":"IP fragmentation across a smaller MTU","type":"exact-repeat","topic":"IP Fragmentation & Network Layer","technique":"Data per fragment = MTU - 20 header, rounded to multiple of 8 (820 -> 800). 1400 data + 20 = 1420 -> fragments of 800 and 600 data; offset in 8-byte units; MF=1 except last; TCP header only in first fragment.","what_changes":"Different statement asked (fragment count, offset, flags, ports) on same MTU 1500/820 scenario.","representative":"june2023_q55","members":["june2023_q55","dec2022_q63","dec2022_shiftii_q61"],"skip_note":"Identical scenario across three papers.","id":"u9c12"},{"title":"IPv4 header hex decoding","type":"same-formula","topic":"IP Fragmentation & Network Layer","technique":"Hex 45 00 0054 ...: first nibble version, second HLEN (x4 bytes), bytes 3-4 total length, byte 9 TTL, byte 10 protocol (06 TCP, 11 UDP, 01 ICMP); efficiency = (total - header)/total.","what_changes":"Which field is asked from the same header.","representative":"june2023_q98","members":["june2023_q96","june2023_q97","june2023_q98","june2023_q99","june2023_q100","june2024_cancelled_q37"],"skip_note":"Same decoding map; one worked example covers all.","id":"u9c13"},{"title":"IP/TCP header field facts and order","type":"same-concept-variant","topic":"IP Fragmentation & Network Layer","technique":"Fields: version, HLEN, service type, total length, identification, flags, fragment offset, TTL, protocol, checksum, addresses, options. TTL, checksum and fragment fields change in transit; addresses do not. Fragment offset is IP, not TCP.","what_changes":"Ordering, which field changes, or odd one out.","representative":"june2024_reexam_q19","members":["june2024_reexam_q19","june2024_cancelled_q60","dec2023_q34"],"skip_note":"All draw on the same header layout.","id":"u9c14"},{"title":"Ethernet delay calculation (10 Mbps, 2500 m, 512 B)","type":"exact-repeat","topic":"MAC Protocols, Ethernet & LAN","technique":"Tt = frame bits / rate; Tp = distance/speed.","what_changes":"Identical question.","representative":"june2023_q81","members":["june2023_q81","dec2022_shiftii_q35"],"skip_note":"Identical text; solve once.","id":"u9c15"},{"title":"CSMA/CD minimum frame size","type":"same-formula","topic":"MAC Protocols, Ethernet & LAN","technique":"Min frame bits = bandwidth x 2Tp (round-trip); reverse to get speed/distance.","what_changes":"Forward (find frame size) vs reverse (find signal speed).","representative":"dec2024_q29","members":["dec2024_q29","june2024_reexam_q17"],"skip_note":"One formula, algebraically inverted.","id":"u9c16"},{"title":"MAC protocol classification and multiple-access facts","type":"same-concept-variant","topic":"MAC Protocols, Ethernet & LAN","technique":"Random access: ALOHA, CSMA (1-persistent, non-persistent, p-persistent), CSMA/CD wired, CSMA/CA wireless. Controlled: reservation, polling, token passing. Channelization: FDMA, TDMA, CDMA (orthogonal codes).","what_changes":"Matching, true/false statement set, or select-the-examples.","representative":"dec2024_q3","members":["dec2024_q3","june2024_cancelled_q39","june2025_q39","dec2023_q59"],"skip_note":"Same taxonomy of access methods.","id":"u9c17"},{"title":"Ethernet/MAC address facts","type":"same-concept-variant","topic":"MAC Protocols, Ethernet & LAN","technique":"48-bit address in hex; LSB of first byte 0 = unicast, 1 = multicast, all F = broadcast; MAC is globally unique.","what_changes":"Address type, binary-to-hex conversion, uniqueness scope.","representative":"sep2022_q51","members":["sep2022_q51","dec2022_shiftii_q33","dec2018_q86"],"skip_note":"Short fact-based items.","id":"u9c18"},{"title":"RSA computation","type":"same-formula","topic":"Network Security & Cryptography","technique":"n = p*q; phi = (p-1)(q-1); e*d = 1 mod phi; C = M^e mod n.","what_changes":"Given p,q and either e or d; asks other key and cipher value.","representative":"nov2020_q32","members":["nov2020_q32","sep2022_q18"],"skip_note":"Same four-step arithmetic.","id":"u9c19"},{"title":"Classical ciphers (Caesar, transposition) and key exchange","type":"same-concept-variant","topic":"Network Security & Cryptography","technique":"Caesar shifts each letter by k (decrypt = shift back k); transposition permutes positions; Diffie-Hellman exchanges secret keys.","what_changes":"Decrypt vs encrypt; cipher type.","representative":"july2018_q48","members":["july2018_q48","july2018_q50","nov2020_q89"],"skip_note":"Simple mechanical substitution.","id":"u9c20"},{"title":"Symmetric cipher block and key sizes","type":"same-concept-variant","topic":"Network Security & Cryptography","technique":"DES 64-bit block, 56-bit key; 3DES 168; IDEA 64/128; Blowfish 64/32-448; AES 128 block, keys 128/192/256; RSA key about 1024+; RC4 is stream.","what_changes":"Matching table or statement set; same size numbers.","representative":"july2018_q45","members":["july2018_q45","dec2018_q61","sep2022_q82","dec2023_q74","june2025_q78"],"skip_note":"One table of block/key sizes answers all.","id":"u9c21"},{"title":"Firewall function and filtering criteria","type":"same-concept-variant","topic":"Network Security & Cryptography","technique":"Firewall filters in/out traffic by source/destination IP, TCP/UDP ports; VPN simulates a private leased line.","what_changes":"Which criteria or what primary function.","representative":"dec2024_q52","members":["dec2024_q52","nov2020_q60","dec2018_q66"],"skip_note":"Same basic definition.","id":"u9c22"},{"title":"Public-key, hash and digital-signature concepts","type":"same-concept-variant","topic":"Network Security & Cryptography","technique":"Encrypt with receiver public key for secrecy; sign by encrypting hash/digest with sender private key; hash gives fixed-length digest; AES symmetric, RSA asymmetric.","what_changes":"Statement or matching form.","representative":"june2025_q12","members":["june2025_q12","nov2021_q97","dec2023_q20","june2019_q90","nov2020_q54"],"skip_note":"Same asymmetric/hash principles.","id":"u9c23"},{"title":"OSI layer function matching and ordering","type":"same-concept-variant","topic":"OSI & TCP/IP Models","technique":"Physical: raw bits; Data link: frames, MAC, piggybacking; Network: routing, logical address, billing; Transport: end-to-end, segmentation; Session: dialog/token mgmt; Presentation: syntax; Application: user interface.","what_changes":"Which functions/protocols are on the list (SLIP data link, BGP network, UDP transport, SNMP application).","representative":"june2023_q22","members":["june2023_q22","dec2022_q74","dec2022_shiftii_q84","dec2019_q82","nov2021_q91","june2024_reexam_q14","sep2022_q84","nov2020_q72"],"skip_note":"Same layer-function matrix; june2023_q22 and dec2022_q74 are identical.","id":"u9c24"},{"title":"Which layer does what (PDU names, encryption, segmentation)","type":"same-concept-variant","topic":"OSI & TCP/IP Models","technique":"PDUs: frame (link), packet (network), segment (transport). IP is host-to-host, TCP process-to-process. Encryption is presentation/application. Session: dialog control, token management, synchronization.","what_changes":"Single-fact direct questions.","representative":"june2024_cancelled_q62","members":["june2024_cancelled_q62","sep2022_q49","june2019_q86","june2019_q87","dec2018_q63"],"skip_note":"All answered from the same layer fact sheet.","id":"u9c25"},{"title":"Period to frequency conversion","type":"exact-repeat","topic":"Physical Layer, Transmission & Signals","technique":"f = 1/T; T = 100 ms gives 10 Hz = 10^-2 kHz.","what_changes":"Identical.","representative":"nov2020_q34","members":["nov2020_q34","july2018_q42"],"skip_note":"Identical text.","id":"u9c26"},{"title":"Throughput calculation","type":"same-formula","topic":"Physical Layer, Transmission & Signals","technique":"Throughput = bits successfully delivered per second = (rate of requests x size in bits).","what_changes":"Numbers and units.","representative":"june2023_q49","members":["june2023_q49","dec2019_q56"],"skip_note":"Same one-step arithmetic.","id":"u9c27"},{"title":"Nyquist and Shannon limits","type":"same-concept-variant","topic":"Physical Layer, Transmission & Signals","technique":"Nyquist bit rate = 2B log2(L); sampling rate >= 2 f_max; Shannon C = B log2(1 + SNR).","what_changes":"Compute vs statement.","representative":"dec2024_q16","members":["dec2024_q16","nov2020_q88","june2024_cancelled_q81"],"skip_note":"Same two formulas.","id":"u9c28"},{"title":"Circuit vs packet switching statements","type":"same-concept-variant","topic":"Physical Layer, Transmission & Signals","technique":"Circuit switching reserves resources at setup, constant delay; packet switching shares links, variable delay, no dedicated path.","what_changes":"True/false variant.","representative":"june2025_q61","members":["june2025_q61","nov2021_q93","july2018_q46"],"skip_note":"Same comparison.","id":"u9c29"},{"title":"Line coding schemes","type":"same-concept-variant","topic":"Physical Layer, Transmission & Signals","technique":"Average bandwidth: NRZ-L N/2, MLT-3 N/3, 2B1Q N/4, 4D-PAM5 N/8; Manchester is self-clocking with two signal elements per bit; NRZ, Manchester, AMI are encodings; Hamming code is not a line code.","what_changes":"Matching vs statement vs odd one out.","representative":"june2024_cancelled_q8","members":["june2024_cancelled_q8","dec2023_q63","june2025_q84","nov2021_q94"],"skip_note":"One scheme table covers all.","id":"u9c30"},{"title":"TCP behaviour after server crash","type":"exact-repeat","topic":"Transport Layer (TCP/UDP, Congestion)","technique":"After reboot the server has no connection state; client data gets RST; client waiting without keepalive may hang.","what_changes":"Same scenario.","representative":"june2023_q8","members":["june2023_q8","dec2022_shiftii_q90"],"skip_note":"Identical.","id":"u9c31"},{"title":"UDP versus TCP services","type":"same-concept-variant","topic":"Transport Layer (TCP/UDP, Congestion)","technique":"UDP is connectionless, offers no flow/congestion control or retransmission; TCP has both.","what_changes":"Statements about which protocol does what.","representative":"dec2023_q61","members":["dec2023_q61","sep2022_q46","dec2018_q88"],"skip_note":"Same TCP/UDP contrast.","id":"u9c32"},{"title":"Congestion control mechanisms","type":"same-concept-variant","topic":"Transport Layer (TCP/UDP, Congestion)","technique":"Choke packet notifies source; token bucket burst time = capacity/(output rate - fill rate).","what_changes":"Concept vs numeric.","representative":"june2025_q38","members":["june2025_q38","dec2022_shiftii_q34"],"skip_note":"Two small items; token bucket formula is the only calculation.","id":"u9c33"},{"title":"Wireless technology matching (CDMA, GSM, UMTS, WiFi)","type":"exact-repeat","topic":"Wireless, Mobile & Emerging Networks","technique":"CDMA multiple access, GSM FDMA+TDMA hybrid, UMTS faster mobile data, WiFi wireless LAN.","what_changes":"Identical.","representative":"june2023_q39","members":["june2023_q39","dec2022_shiftii_q74"],"skip_note":"Identical.","id":"u9c34"},{"title":"Cloud service models and virtualization","type":"same-concept-variant","topic":"Wireless, Mobile & Emerging Networks","technique":"SaaS software stack; PaaS development environment; IaaS infrastructure; hypervisor then VMs then resources then workloads; Azure OS-like platform, CloudFront CDN.","what_changes":"Matching, ordering, definition.","representative":"dec2024_q68","members":["dec2024_q68","june2025_q26","dec2018_q64","dec2019_q78"],"skip_note":"Same cloud concept fact sheet.","id":"u9c35"},{"title":"Cellular generations","type":"same-concept-variant","topic":"Wireless, Mobile & Emerging Networks","technique":"AMPS 1G analog; IS-95 2G CDMA/DSSS; 3G broadband CDMA.","what_changes":"Which generation.","representative":"dec2018_q65","members":["dec2018_q65","july2018_q44"],"skip_note":"Same table.","id":"u9c36"},{"title":"Sliding window mechanics (steps and Go-back-N variables)","type":"same-concept-variant","topic":"Data Link Layer, Error Control & Flow Control","technique":"Sliding window: send window, ack, slide; in Go-back-N Sn stays at window end, only Sf moves on ack.","what_changes":"Steps vs variable update.","representative":"dec2024_q32","members":["dec2024_q32","dec2022_q35"],"skip_note":"Both test window mechanics.","id":"u9c37"}],"singletons":43,"mindset":["Format mix: heavy on matching (List I/List II), arrange-in-order and multi-statement combos; pure numeric questions are about 20-25 of 167 and are single-step substitutions.","Exact repeats are common: Dec 2022 Shift I and II share CRC, MTU fragmentation and Ethernet delay questions; June 2023 reuses the fragmentation and Ethernet delay problems; period-to-frequency appears in 2018 and 2020.","Passage sets (sliding window Sep 2022, subnetting Dec 2022 Shift II, IPv4 header June 2023) give 5 questions from one setup, so one worked example is worth 5 marks.","Standard numbers are reused: 10 Mbps, 512-byte frame, 2500 m, 2e8 m/s; MTU 1500/820, 1400-byte TCP segment; header 45 00 00 54; RSA p,q small (3,11; 13,5).","Security is the largest topic (26) but mostly recall: key and block sizes, hash and digital-signature roles, RSA arithmetic, firewall basics; no deep protocol analysis.","Distractors: options differ by one detail (ordering swapped, 2^n vs 2^n - 2, 1-persistent vs 2-persistent, SYN vs ACK number); some answer keys have inconsistent options (Ethernet delay, Dec 2022 Shift II q35 vs June 2023 q81), so follow the key.","Recent papers (2023-2025) emphasise IP header/fragmentation, wireless/cloud/MANET matching and ordering questions; classical ciphers and sliding-window calculations appeared mostly 2018-2022.","Cross-unit overlap: cloud, virtualization, IoT, social networks and MANET belong to the emerging-networks end of this unit; hash and RSA overlap with theory-of-computation style number arithmetic.","He never asks: routing algorithm computation beyond a single distance-vector update, OSPF/BGP internals, TCP congestion window plots, or full-length subnet design with VLSM.","Difficulty is low: about 70% of questions are difficulty 1-2 recall; the few hard ones are the sliding-window passage and the distance-vector update."],"formulas":[{"name":"Transmission delay","formula":"Tt = frame size (bits) / bandwidth (bps)","used_in":["sep2022_q36","june2023_q81","dec2022_shiftii_q35"],"note":"Convert bytes to bits first."},{"name":"Propagation delay","formula":"Tp = distance / propagation speed","used_in":["june2019_q83","sep2022_q36","june2023_q81"],"note":"Watch units: km vs m, us per km vs km/s."},{"name":"Bandwidth-delay product","formula":"BDP = bandwidth x delay (RTT if round trip given)","used_in":["june2025_q24"],"note":"Result in bits."},{"name":"Optimal sliding-window size","formula":"W = 1 + 2Tp/Tt","used_in":["sep2022_q38","sep2022_q37"],"note":"Sequence bits n: window <= 2^n - 1 (go-back-N) or 2^(n-1) (SR)."},{"name":"Sliding-window efficiency / throughput","formula":"efficiency = W / (1 + 2Tp/Tt) capped at 1; throughput = efficiency x bandwidth","used_in":["sep2022_q39","sep2022_q40","sep2022_q47"],"note":"Throughput cannot exceed link rate."},{"name":"Error detection/correction distance","formula":"Detect s errors: d_min = s + 1; correct t errors: d_min = 2t + 1","used_in":["dec2022_q36","july2018_q49","nov2020_q31"],"note":"Mixing the two is the usual trap."},{"name":"Hamming distance","formula":"Number of bit positions where two words differ (weight of XOR)","used_in":["dec2024_q17","nov2020_q31"],"note":"Decode to nearest valid codeword."},{"name":"CRC codeword","formula":"Codeword = dataword || remainder (remainder from modulo-2 division after appending zeros)","used_in":["dec2022_q34","dec2022_shiftii_q36"],"note":"(x+1) factor of G(x) catches all odd-bit errors (nov2021_q100)."},{"name":"Bit stuffing flag","formula":"Frame flag 01111110 = 0x7E; stuff 0 after five consecutive 1s","used_in":["dec2023_q35"],"note":"Flag is hex 7E."},{"name":"Nyquist bit rate","formula":"C = 2B log2(L)","used_in":["dec2024_q16","nov2020_q88"],"note":"Noiseless channel only; sampling rate >= 2 f_max."},{"name":"Shannon capacity","formula":"C = B log2(1 + SNR)","used_in":["nov2020_q88"],"note":"Noisy channel; SNR is a ratio, not dB."},{"name":"Frequency and period","formula":"f = 1/T","used_in":["nov2020_q34","july2018_q42"],"note":"100 ms = 10 Hz = 10^-2 kHz."},{"name":"Fully connected links","formula":"n(n-1)/2","used_in":["june2019_q81"],"note":"Symmetric keys for N persons also N(N-1)/2 (dec2018_q90)."},{"name":"CSMA/CD minimum frame","formula":"L_min = bandwidth x 2Tp","used_in":["dec2024_q29","june2024_reexam_q17"],"note":"Round-trip time, not one way."},{"name":"Slotted ALOHA throughput","formula":"S = G e^(-G); pure ALOHA S = G e^(-2G)","used_in":["july2018_q41"],"note":"G = frames per frame time."},{"name":"Token bucket burst duration","formula":"T = C / (M - rho) = capacity / (output rate - token rate)","used_in":["dec2022_shiftii_q34"],"note":"16/(10-2) = 2 s."},{"name":"Token ring 1-bit delay","formula":"distance per bit = propagation speed / bit rate","used_in":["june2024_reexam_q4"],"note":"200 m/us / 10 Mbps = 20 m."},{"name":"Hosts per subnet","formula":"2^(host bits) - 2; subnets = 2^(subnet bits)","used_in":["june2024_reexam_q58","sep2022_q48","nov2021_q95","june2019_q84"],"note":"Subtract 2 for network and broadcast addresses."},{"name":"Subnetting a block","formula":"new prefix = old prefix + log2(subnets); addresses = 2^(32 - prefix)","used_in":["dec2022_shiftii_q91","dec2022_shiftii_q92","dec2022_shiftii_q94"],"note":"1024 subnets from /16 gives /26 and 64 addresses."},{"name":"IPv4 class ranges","formula":"A 0-127, B 128-191, C 192-223, D 224-239, E 240-255; A=50%, B=25%, C=12.5% of space","used_in":["dec2019_q53","june2019_q88","june2024_reexam_q32","june2019_q85"],"note":"127.x.x.x loopback is class A."},{"name":"IP fragmentation","formula":"data per fragment = floor((MTU - 20)/8)*8; offset = bytes/8","used_in":["dec2022_q63","june2023_q55","dec2022_shiftii_q61"],"note":"MTU 820 gives 800 data bytes."},{"name":"IPv4 header decode","formula":"byte0 low nibble HLEN x 4; bytes 2-3 total length; byte 8 TTL; byte 9 protocol (6 TCP, 17 UDP, 1 ICMP)","used_in":["june2023_q96","june2023_q97","june2023_q98","june2023_q99","june2024_cancelled_q37"],"note":"Efficiency = (total - header)/total."},{"name":"RSA","formula":"n = pq; phi = (p-1)(q-1); ed = 1 mod phi; C = M^e mod n; M = C^d mod n","used_in":["sep2022_q18","nov2020_q32","dec2022_q84"],"note":"Private-key encryption gives digital signature."},{"name":"Symmetric key count","formula":"N(N-1)/2 keys for N parties","used_in":["dec2018_q90"],"note":"Public-key needs only N key pairs."},{"name":"Cipher sizes","formula":"DES 64-bit block/56-bit key; 3DES 168; AES 128 block, 128/192/256 key; IDEA 64/128; Blowfish 32-448","used_in":["july2018_q45","dec2018_q61","sep2022_q82"],"note":"DES has 16 rounds; function steps: expansion, XOR key, S-box, P-box."},{"name":"Line coding average bandwidth","formula":"NRZ-L N/2; MLT-3 N/3; 2B1Q N/4; 4D-PAM5 N/8; Manchester bit rate = half baud","used_in":["june2024_cancelled_q8","dec2023_q63","nov2021_q94"],"note":"Manchester needs twice the bandwidth of NRZ."},{"name":"DHCP sequence","formula":"Discover, Offer, Request, Ack","used_in":["dec2024_q88","dec2023_q84"],"note":"Renewal: timer, request, ack."},{"name":"Hierarchical routing table size","formula":"entries = routers in own region + other regions in cluster + other clusters","used_in":["dec2019_q54"],"note":"Key gives 25 for the 720-router example."},{"name":"Piconet","formula":"1 master + up to 7 active slaves","used_in":["dec2019_q55"],"note":"Scatternet joins piconets."}],"plan":[{"step":1,"focus":"Security and cryptography recall","topics":["Network Security & Cryptography"],"hours":3.0,"do":"Learn the cipher size table (u9c19), RSA arithmetic (u9c18), digital signature/hash roles (u9c21); solve nov2020_q32, july2018_q45, june2025_q12."},{"step":2,"focus":"Data link calculations","topics":["Data Link Layer, Error Control & Flow Control"],"hours":3.5,"do":"Master the sliding window passage (sep2022_q38), Hamming rules (nov2020_q31), CRC (dec2022_q34), WAN protocol facts (june2024_cancelled_q58)."},{"step":3,"focus":"IP addressing and subnetting","topics":["IP Addressing, Subnetting & CIDR"],"hours":3.0,"do":"Class table (june2024_reexam_q32), mask counting (june2024_reexam_q58), subnetting passage (dec2022_shiftii_q91), CIDR (dec2018_q87)."},{"step":4,"focus":"IP header and fragmentation","topics":["IP Fragmentation & Network Layer"],"hours":2.0,"do":"Do the MTU problem (june2023_q55) and header decode (june2023_q98); read header field order."},{"step":5,"focus":"Physical layer and signals","topics":["Physical Layer, Transmission & Signals"],"hours":2.5,"do":"Line coding table (june2024_cancelled_q8), Nyquist/Shannon (dec2024_q16), switching (june2025_q61), throughput (june2023_q49), TDM (dec2023_q33)."},{"step":6,"focus":"MAC and LAN","topics":["MAC Protocols, Ethernet & LAN"],"hours":2.0,"do":"CSMA/CD frame size (dec2024_q29), Ethernet delay (june2023_q81), access-protocol classification (dec2024_q3), ALOHA formula (july2018_q41)."},{"step":7,"focus":"OSI and TCP/IP models","topics":["OSI & TCP/IP Models"],"hours":1.5,"do":"Layer functions matrix (june2023_q22) and PDU/layer facts (june2024_cancelled_q62)."},{"step":8,"focus":"Transport and application layer","topics":["Transport Layer (TCP/UDP, Congestion)","Application Layer Protocols (HTTP, DNS, SMTP)"],"hours":2.0,"do":"TCP vs UDP (dec2023_q61), handshake (june2024_reexam_q68), DHCP/DNS/URL orderings (dec2024_q88, june2025_q55), POP/IMAP facts."},{"step":9,"focus":"Wireless, cloud and routing","topics":["Wireless, Mobile & Emerging Networks","Routing Algorithms & Protocols"],"hours":1.5,"do":"Cloud models (dec2024_q68), wireless matching (june2023_q39), MANET (dec2024_q4), RIP/OSPF/BGP distinctions (dec2023_q62)."}],"minset":63},{"unit":10,"name":"Artificial Intelligence (AI)","total":132,"papers":15,"topics":[{"topic":"Natural Language Processing, Expert Systems & Misc AI","count":37,"papers":15,"first_year":"July 2018","last_year":"June 2025","trend":"rising","priority":"Must","why":"37 questions (28%), largest bucket, 21 of them in 2023-25; genetic algorithms and agents dominate.","what_to_study":["Genetic algorithm: operators, encoding, selection, crossover, termination, fitness calc","Agent types and environment properties","Planning/STRIPS and expert system basics (Mycin, Dendral, certainty factors, Dempster-Shafer)","NLU/NLG components and parsing"]},{"topic":"Neural Networks & Deep Learning","count":23,"papers":9,"first_year":"June 2019","last_year":"June 2025","trend":"rising","priority":"Must","why":"23 questions (17%) with 14 in 2023-25, in 9 papers.","what_to_study":["Perceptro n vs. which property is invalid.","representative":"june2025_q74","members":["june2025_q74","june2019_q95"],"skip_note":"Both reduce to 'higher alpha means smaller set'."},{"id":"u10c4","title":"Minimax root value of a game tree","type":"same-concept-variant","topic":"Game Playing (Minimax, Alpha-Beta)","technique":"Evaluate bottom-up: MAX nodes take max of children, MIN nodes take min. Alpha-beta gives the same root value.","what_changes":"Tree shape, leaf values; june2019_q91 and dec2019_q60 are the same tree (values 7 vs 17 style).","representative":"nov2021_q53","members":["nov2021_q53","june2019_q91","dec2019_q60","dec2018_q97"],"skip_note":"Same bottom-up procedure; the rep covers it. (Figures in q91/q60 are partly blank in the source.)"},{"id":"u10c5","title":"Alpha-beta pruning true/false statements","type":"same-concept-variant","topic":"Game Playing (Minimax, Alpha-Beta)","technique":"Facts: minimax is depth-first; alpha-beta returns the same value as minimax; pruning efficiency depends on move ordering; alpha init -inf, beta +inf; values updated along the search path; best case halves depth (O(b^(d/2))).","what_changes":"Which statements are listed as true/false.","representative":"dec2023_q65","members":["dec2023_q65","nov2020_q63","sep2022_q70","dec2022_shiftii_q39"],"skip_note":"All draw on the same handful of facts listed in formulas."},{"id":"u10c6","title":"Count models of a propositional sentence","type":"same-formula","topic":"Knowledge Representation & Logic (Prolog, Resolution)","technique":"Models over n symbols = 2^n assignments; count assignments making the sentence true. For an OR of literals, 2^n minus falsifying assignments.","what_changes":"Sentence (B v C vs. a 4-literal disjunction).","representative":"dec2018_q98","members":["dec2018_q98","july2018_q75"],"skip_note":"Same method; 2^4=16 minus falsifying ones."},{"id":"u10c7","title":"English to FOL: 'a country that borders both ...'","type":"exact-repeat","topic":"Knowledge Representation & Logic (Prolog, Resolution)","technique":"Existential quantifier pairs with conjunction (AND), never implication.","what_changes":"Only the country names (India/Nepal vs India/Pakistan).","representative":"nov2021_q55","members":["nov2021_q55","dec2018_q99"],"skip_note":"Identical question; answer A both times."},{"id":"u10c8","title":"Entailment definition and properties","type":"same-concept-variant","topic":"Knowledge Representation & Logic (Prolog, Resolution)","technique":"alpha entails beta (alpha |= beta) iff beta true in every model where alpha true; False entails everything; alpha |= (b and g) implies alpha |= b and alpha |= g; Horn KB works with forward/backward chaining.","what_changes":"Notation vs true/false statements.","representative":"nov2020_q62","members":["nov2020_q62","july2018_q76","dec2024_q45"],"skip_note":"Basic definitions, covered by the rep."},{"id":"u10c9","title":"Knowledge-base design steps order","type":"exact-repeat","topic":"Knowledge Representation & Logic (Prolog, Resolution)","technique":"Order: choose task domain, select atoms for propositions, axiomatize the domain, ask questions about the intended interpretation.","what_changes":"Wording and option order only.","representative":"june2025_q7","members":["june2025_q7","dec2024_q44"],"skip_note":"Same sequence both times (answer: domain, atoms, axiomatize, ask)."},{"id":"u10c10","title":"Supervised vs unsupervised vs classification algorithm identification","type":"same-concept-variant","topic":"Machine Learning & Classification","technique":"Supervised: regression, KNN, decision tree, logistic regression, SVM, backprop. Unsupervised: clustering, PCA, Apriori, SOM. Reinforcement: reward/punish with MDP. Regression is not classification.","what_changes":"Which algorithms are listed and which category is asked.","representative":"dec2022_q75","members":["dec2022_q75","dec2019_q81","dec2022_shiftii_q64","june2023_q64"],"skip_note":"dec2019_q81 and dec2022_shiftii_q64 are the same question."},{"id":"u10c11","title":"Clustering algorithm steps and k-means calculation","type":"same-concept-variant","topic":"Machine Learning & Classification","technique":"K-means: choose k, init centroids, assign to nearest, update centroids as mean, repeat. DBSCAN: eps neighbours, core points via MinPts, expand density-connected points. Compute distance (Manhattan = sum |dx|+|dy|) to a recomputed centroid.","what_changes":"Sequence ordering vs one-step numeric vs correlation statement.","representative":"dec2023_q85","members":["dec2023_q85","dec2022_shiftii_q79","june2019_q40","nov2020_q83"],"skip_note":"Procedure-level knowledge; rep sequence plus one centroid computation."},{"id":"u10c12","title":"Planning and STRIPS","type":"same-concept-variant","topic":"Natural Language Processing, Expert Systems & Misc AI","technique":"STRIPS is action-centric: each action has precondition and effect (add/delete lists); features are primitive or derived; no conditional effects directly. Planning graph gives heuristics; relaxation drops negative effects. Classic planning definition: init, actions, goal.","what_changes":"STRIPS statements vs planning components. (june2019_q93 is tagged Knowledge Representation.)","representative":"june2025_q81","members":["june2025_q81","june2019_q93","july2018_q78","dec2024_q73"],"skip_note":"Same small fact set."},{"id":"u10c13","title":"GA fitness and selection probability calculation","type":"same-formula","topic":"Natural Language Processing, Expert Systems & Misc AI","technique":"Fitness f(x); selection probability = f(x)/sum f; the parent chosen is the one with highest fitness. Convert binary string to decimal before f(x)=x^2.","what_changes":"Fitness function and population values.","representative":"dec2023_q39","members":["dec2023_q39","dec2019_q65"],"skip_note":"Same calculation pattern; practise rep."},{"id":"u10c14","title":"GA step sequence","type":"same-concept-variant","topic":"Natural Language Processing, Expert Systems & Misc AI","technique":"Order: initialization/evaluate fitness, selection of parents, crossover (prob pc), mutation (prob pm), repeat until termination.","what_changes":"Step labels and whether evaluation comes before selection.","representative":"june2025_q40","members":["june2025_q40","june2024_reexam_q26"],"skip_note":"Same flow in both."},{"id":"u10c15","title":"GA crossover types","type":"same-concept-variant","topic":"Natural Language Processing, Expert Systems & Misc AI","technique":"One-point: swap tails after one cut; two-point: swap middle segment; uniform: binary mask per gene decides which parent gives the gene.","what_changes":"Diagram vs 'mask is used in' question.","representative":"june2024_cancelled_q12","members":["june2024_cancelled_q12","june2024_cancelled_q76"],"skip_note":"Same crossover concept."},{"id":"u10c16","title":"GA odd-one-out: operators, encodings, selection","type":"same-concept-variant","topic":"Natural Language Processing, Expert Systems & Misc AI","technique":"Mutation: random resetting, scramble, inversion, swap, bit flip. Representations: binary, real, permutation (Gray also). Parent selection: roulette/fitness-proportional, tournament, rank, Boltzmann. 'Actual count' relates to selection.","what_changes":"Which category is asked; distractor invented term (Difference, Combinations, Radial).","representative":"june2025_q47","members":["june2025_q47","june2023_q41","june2023_q59","dec2023_q83","june2024_cancelled_q72"],"skip_note":"Memorise the three lists once."},{"id":"u10c17","title":"GA general concepts","type":"same-concept-variant","topic":"Natural Language Processing, Expert Systems & Misc AI","technique":"GA mimics evolution: selection, crossover/reproduction, mutation; stochastic hill-climbing with a population. Reproduction is the costliest step.","what_changes":"Which AI technique mimics evolution / GA components.","representative":"june2019_q97","members":["june2019_q97","dec2022_shiftii_q63"],"skip_note":"Same recognition question."},{"id":"u10c18","title":"Agent types, architecture and environments","type":"same-concept-variant","topic":"Natural Language Processing, Expert Systems & Misc AI","technique":"Simple reflex agent uses only current percept; utility-based handles happy/unhappy; learning agent improves performance; environment properties: observable, deterministic, static, semi-dynamic (environment fixed, performance score changes), uncertain = not fully observable OR not deterministic. MAS: multiple agents with diverse objectives and communication.","what_changes":"Agent type, environment property, or statement set.","representative":"june2025_q5","members":["june2025_q5","july2018_q72","july2018_q71","dec2018_q92","dec2018_q91","nov2021_q51","dec2023_q37"],"skip_note":"The same agent vocabulary is reused."},{"id":"u10c19","title":"NLP components and NLU vs NLG","type":"same-concept-variant","topic":"Natural Language Processing, Expert Systems & Misc AI","technique":"NLU: morphological, syntactic, semantic, pragmatic analysis (no 'meaning analysis'). NLG: text planning, sentence planning, realization. Parsing: top-down, bottom-up, dependency, Earley; SMT is not a parser.","what_changes":"Component-not-in-list vs match.","representative":"dec2023_q64","members":["dec2023_q64","june2023_q43","dec2022_shiftii_q75"],"skip_note":"Same vocabulary."},{"id":"u10c20","title":"ANN features and layer statements","type":"same-concept-variant","topic":"Neural Networks & Deep Learning","technique":"ANN: machine learning algorithm, handles large data, extracts features automatically, modelled on brain; training time grows with size; can be simulated on conventional computer; can include feedback. Information flows input, hidden, output.","what_changes":"Statement combos; dec2022_q64 and dec2022_shiftii_q85 are the same question.","representative":"dec2024_q42","members":["dec2024_q42","dec2022_q64","dec2022_shiftii_q85","dec2022_q85"],"skip_note":"Statements are the same each time."},{"id":"u10c21","title":"Backpropagation and weight update","type":"same-concept-variant","topic":"Neural Networks & Deep Learning","technique":"Backprop propagates error backward from output to input; gradient descent: W(t+1)=W(t)-alpha dE/dW. Training order: initialize weights, feed forward, loss, backprop, update.","what_changes":"Formula vs sequence vs A/R statement.","representative":"dec2019_q63","members":["dec2019_q63","june2024_cancelled_q33","dec2022_q90","june2024_reexam_q39","dec2024_q85"],"skip_note":"All based on the gradient-descent idea."},{"id":"u10c22","title":"NN numerical computation","type":"same-formula","topic":"Neural Networks & Deep Learning","technique":"Neuron output = f(sum w_i x_i + bias); linear transfer multiplies by constant; sigmoid 1/(1+e^-x), derivative f(1-f); perceptron update w += eta (t - y) x.","what_changes":"Weights/inputs and which activation.","representative":"june2025_q36","members":["june2025_q36","dec2023_q40","dec2022_shiftii_q40","june2019_q99"],"skip_note":"Same weighted-sum pattern; practise rep and dec2023_q40 once."},{"id":"u10c23","title":"Perceptron capability","type":"same-concept-variant","topic":"Neural Networks & Deep Learning","technique":"Single-layer perceptron solves linearly separable functions (AND, OR, NOR) but not XOR; single layer feed-forward network.","what_changes":"Definition vs Boolean functions.","representative":"dec2022_shiftii_q65","members":["dec2022_shiftii_q65","june2024_cancelled_q6"],"skip_note":"Rep covers it."},{"id":"u10c24","title":"Unsupervised neural nets / Kohonen SOM","type":"same-concept-variant","topic":"Neural Networks & Deep Learning","technique":"SOM is unsupervised, competitive learning; weight update w_new=(1-eta)w_old+eta x for winner and neighbours.","what_changes":"Which network is unsupervised vs update rule.","representative":"june2025_q80","members":["june2025_q80","june2019_q98"],"skip_note":"Rep covers it."},{"id":"u10c25","title":"ANN passage questions (June 2024 re-exam)","type":"same-concept-variant","topic":"Neural Networks & Deep Learning","technique":"Read the passage: ANNs are inspired by the brain; input/hidden/output layers; weights adjusted to reduce error.","what_changes":"Different question on the same passage.","representative":"june2024_reexam_q91","members":["june2024_reexam_q91","june2024_reexam_q92","june2024_reexam_q93","june2024_reexam_q94","june2024_reexam_q95"],"skip_note":"Passage-based, answerable from text."},{"id":"u10c26","title":"Match search algorithms to properties","type":"exact-repeat","topic":"Search Strategies (Uninformed & Heuristic)","technique":"Greedy best-first: incomplete even in finite spaces; A*: optimal if heuristic admissible; RBFS: O(bd) linear space; know the 4th option too.","what_changes":"Order of options only.","representative":"dec2023_q73","members":["dec2023_q73","nov2020_q73"],"skip_note":"Identical question."},{"id":"u10c27","title":"Match search algorithms to evaluation function / space complexity","type":"same-concept-variant","topic":"Search Strategies (Uninformed & Heuristic)","technique":"Greedy: h(n); UCS/lowest-cost: g(n); A*: g+h. Space: BFS O(b^d), DFS O(bm), DLS O(bl), IDS O(bd).","what_changes":"Which property is paired with which algorithm.","representative":"june2019_q92","members":["june2019_q92","dec2018_q94","dec2018_q93"],"skip_note":"Same table of properties."},{"id":"u10c28","title":"A* optimality and heuristic admissibility","type":"same-concept-variant","topic":"Search Strategies (Uninformed & Heuristic)","technique":"A* optimal with admissible h (tree) / consistent h (graph); admissible = never overestimates; consistent = triangle inequality; A* expands all nodes with f<C* and none with f>C*; max of admissible heuristics dominates.","what_changes":"Which statements about A*/heuristics are true.","representative":"nov2021_q54","members":["nov2021_q54","dec2022_q37","dec2022_shiftii_q37","dec2018_q95","july2018_q74","july2018_q73"],"skip_note":"All une2024_cancelled_q82","june2025_q60"],"note":"Standard Zadeh operators."},{"name":"Algebraic sum / bounded sum / bounded difference","formula":"a+b-ab ; min(1,a+b) ; max(0,a-b)","used_in":["june2025_q60"],"note":"Bounded sum uses min with 1."},{"name":"Dual t-norm and s-norm","formula":"t(x,y)=1-s(1-x,1-y)","used_in":["dec2019_q62","june2019_q94"],"note":"Substitute then simplify."},{"name":"alpha-cut nesting","formula":"alpha1<alpha2 => A_alpha1 contains A_alpha2","used_in":["june2019_q95","june2025_q74"],"note":"Higher cut gives smaller set."},{"name":"Crossover point","formula":"mu_A(x)=0.5","used_in":["dec2023_q38"],"note":"Core is mu=1, support is mu>0."},{"name":"Number of models","formula":"2^n assignments over n symbols; models of OR = 2^n - falsifying","used_in":["july2018_q75","dec2018_q98"],"note":"B v C over 4 symbols gives 12; 4-literal clause gives 15."},{"name":"Entailment","formula":"alpha |= beta iff M(alpha) subset of M(beta)","used_in":["july2018_q76","dec2024_q45","nov2020_q62"],"note":"False |= anything."},{"name":"Existential translation","formula":"exists x (P(x) AND Q(x))","used_in":["dec2018_q99","nov2021_q55"],"note":"Never use implication with exists."},{"name":"Minimax / alpha-beta","formula":"MAX takes max, MIN takes min; alpha=-inf, beta=+inf initially; best case O(b^(d/2))","used_in":["nov2021_q53","dec2023_q65","dec2018_q97"],"note":"Alpha-beta gives same value as minimax."},{"name":"A* evaluation","formula":"f(n)=g(n)+h(n); admissible: h<=h*","used_in":["june2019_q92","july2018_q74"],"note":"Consistent: h(n)<=c(n,n')+h(n')."},{"name":"Search complexities","formula":"BFS O(b^d); DFS O(bm); DLS O(bl); IDS O(bd)","used_in":["dec2018_q93"],"note":"Space complexity; RBFS is O(bd) space."},{"name":"GA selection probability","formula":"p(x)=f(x)/sum f(x)","used_in":["dec2019_q65","dec2023_q39"],"note":"Convert binary chromosome first."},{"name":"Schema order","formula":"order = number of fixed (non-*) positions","used_in":["dec2019_q64"],"note":"Wildcard positions do not count."},{"name":"Certainty factors","formula":"AND: min; OR: max; CF(conclusion)=CF(premise)*CF(rule)","used_in":["sep2022_q1"],"note":"Example: min(0.5,0.8)=0.5 times 0.8 = 0.40."},{"name":"Dempster-Shafer","formula":"Bel(A)+Bel(not A) <= 1","used_in":["dec2019_q58"],"note":"Not equal 1 unlike probability."},{"name":"Sigmoid","formula":"f(x)=1/(1+e^-x); f'=f(1-f); for 1/(1+e^-2x), f'(0)=2*0.25=0.5","used_in":["june2019_q99","dec2023_q40"],"note":"Scaling factor 2 doubles derivative."},{"name":"Neuron weighted sum","formula":"y=k*sum w_i x_i","used_in":["dec2022_shiftii_q40"],"note":"1*5+2*7+3*10+4*30=169, times 3 = 507."},{"name":"Perceptron rule","formula":"w_new=w+eta*(t-y)*x","used_in":["june2025_q36"],"note":"Single layer separates AND, OR, NOR but not XOR."},{"name":"Gradient descent update","formula":"W(t+1)=W(t)-alpha*dE/dW","used_in":["dec2019_q63"],"note":"Minus sign."},{"name":"Kohonen SOM update","formula":"w_new=(1-eta)*w_old+eta*x","used_in":["june2025_q80"],"note":"Winner and neighbours."},{"name":"K-means / Manhattan distance","formula":"centroid=mean of cluster points; d=|x1-x2|+|y1-y2|","used_in":["june2019_q40"],"note":"Recompute centroid after assignment."},{"name":"Decision tree to rules","formula":"AND along a branch, OR across branches","used_in":["dec2022_q16"],"note":"Disjunctive normal form."},{"name":"Environment property","formula":"uncertain = not fully observable OR not deterministic; semi-dynamic: environment static but score changes","used_in":["july2018_q71","dec2018_q92"],"note":"Common trap."},{"name":"Hill-climbing shortcomings","formula":"local maxima, plateau, ridge","used_in":["dec2019_q80"],"note":"All three are listed."}],"plan":[{"step":1,"focus":"Genetic algorithms and agents (largest bucket)","topics":["Natural Language Processing, Expert Systems & Misc AI"],"hours":3.0,"do":"Do clusters u10c12-u10c18; memorise operator/selection/encoding lists and agent environment properties."},{"step":2 e memory-model vocabulary."},{"id":"u11c26","title":"Learning theories, styles and methods","type":"same-concept-variant","topic":"Teaching Aptitude","technique":"VARK = Visual, Aural, Read/write, Kinaesthetic; Bandura observational learning: attention, retention, production, motivation; cooperative learning has individual and group accountability; cognitive apprenticeship.","what_changes":"Term identification or elements.","representative":"gp2023_q8","members":["gp2023_q8","gp2023_q9","gp2023_q10","gp2024_q41","gp2025_q15"],"skip_note":"Definition recall from the learning-theory chapter."},{"id":"u11c27","title":"Educational technology and digital tools","type":"same-concept-variant","topic":"Teaching Aptitude","technique":"Canva-infographics; Genially/H5P/LearningApps/Educaplay for interactive content; Mentimeter/Slido/Poll Everywhere for live polls; SWAYAM Prabha DTH channels by provider.","what_changes":"Tool-to-purpose choice.","representative":"gp2025_q31","members":["gp2023_q6","gp2024_q9","gp2024_q32","gp2025_q31"],"skip_note":"Application-style tool questions; learn the tool list once."},{"id":"u11c28","title":"Assessment: norm, criterion and authentic","type":"same-concept-variant","topic":"Teaching Aptitude","technique":"Norm referencing compares to peers; criterion to a standard; authentic assessment for real-task projects; formative for ongoing progress.","what_changes":"Choose assessment type for a scenario.","representative":"gp2024_q26","members":["gp2023_q7","gp2024_q26"],"skip_note":"Same assessment-type taxonomy."},{"id":"u11c29","title":"Qualitative research characteristics","type":"exact-repeat","topic":"Research Aptitude","technique":"Qualitative: process, context, description, meanings and experiences; not generalisation or rigid structure.","what_changes":"Wording only; option sets reshuffled.","representative":"gp2025_q21","members":["gp2024_q37","gp2025_q21"],"skip_note":"Near-identical question in successive years."},{"id":"u11c30","title
